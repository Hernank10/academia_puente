name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-django pytest-cov

      - name: Preparar media
        run: |
          mkdir -p media/apps/lengua-castellana
          touch media/apps/lengua-castellana/.gitkeep

      - name: Correr tests
        run: pytest -q --no-header

      - name: Cobertura
        run: pytest -q --no-header --cov --cov-report=term --cov-report=xml

      - name: Subir coverage.xml
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage.xml
