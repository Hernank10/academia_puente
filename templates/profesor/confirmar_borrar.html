{% extends "base.html" %}
{% block content %}
<style>
    .conf-wrap { max-width: 520px; margin: 3rem auto; padding: 0 1rem; text-align: center; }
    .conf-card { background: #161b22; border: 2px solid #ff9999; border-radius: 12px;
        padding: 2rem; }
    .conf-title { color: #ff9999; font-size: 1.5rem; margin-bottom: 0.75rem; font-weight: 700; }
    .conf-msg { color: #c9d1d9; margin-bottom: 1.5rem; }
    .conf-actions { display: flex; gap: 0.75rem; justify-content: center; flex-wrap: wrap; }
    .btn-danger { display: inline-block; padding: 0.65rem 1.4rem;
        background: #dc2626; color: #fff; font-weight: 700;
        border-radius: 8px; border: none; cursor: pointer; text-decoration: none; }
    .btn-cancel { display: inline-block; padding: 0.65rem 1.4rem;
        background: #21262d; color: #c9d1d9; border: 1px solid #30363d;
        border-radius: 8px; text-decoration: none; }
</style>
<div class="conf-wrap">
    <div class="conf-card">
        <div class="conf-title">{{ titulo }}</div>
        <div class="conf-msg">{{ mensaje }}</div>
        <form method="post" action="{{ url_confirmar }}">
            {% csrf_token %}
            <div class="conf-actions">
                <button type="submit" class="btn-danger">Si, borrar</button>
                <a href="{{ url_cancelar }}" class="btn-cancel">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
