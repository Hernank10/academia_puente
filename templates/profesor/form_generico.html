{% extends "base.html" %}
{% load i18n %}

{% block content %}

<!-- Quill CSS por <link> (el @import dentro de <style> NO funciona) -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.snow.css">

<style>
    .form-wrap { max-width: 820px; margin: 1rem auto 3rem; padding: 0 1rem; }
    .form-title { color: #f1c40f; font-size: 1.6rem; margin-bottom: 1rem; font-weight: 700; }
    .form-card { background: #161b22; border: 1px solid #30363d; border-radius: 12px;
        padding: 1.5rem; }

    .form-card p { margin-bottom: 1.25rem; }
    .form-card label {
        display: block; color: #e6edf3; font-weight: 600;
        margin-bottom: 0.35rem; font-size: 0.9rem;
    }
    .form-card input[type=text],
    .form-card input[type=number],
    .form-card input[type=email],
    .form-card input[type=url],
    .form-card input[type=password],
    .form-card input[type=datetime-local],
    .form-card input[type=date],
    .form-card input[type=file],
    .form-card select,
    .form-card textarea {
        width: 100%;
        background: #0d1117;
        color: #c9d1d9;
        border: 1px solid #30363d;
        border-radius: 8px;
        padding: 0.6rem 0.8rem;
        font-size: 0.95rem;
        font-family: inherit;
        box-sizing: border-box;
    }
    .form-card textarea {
        min-height: 120px;
        resize: vertical;
        line-height: 1.5;
        font-family: ui-monospace, Consolas, monospace;
        font-size: 0.9rem;
    }
    .form-card textarea[rows="10"],
    .form-card textarea[rows="8"] {
        min-height: 200px;
    }
    .form-card input:focus,
    .form-card select:focus,
    .form-card textarea:focus {
        outline: none;
        border-color: #f1c40f;
        box-shadow: 0 0 0 2px rgba(241,196,15,0.15);
    }
    .form-card input[type=checkbox] { width: auto; }
    .form-card .helptext { color: #6e7681; font-size: 0.8rem; display: block; margin-top: 0.25rem; }
    .errorlist { color: #ff9999; list-style: none; padding: 0; margin: 0.25rem 0; font-size: 0.85rem; }

    .form-actions {
        display: flex; gap: 0.5rem; margin-top: 1.5rem; flex-wrap: wrap;
    }
    .btn-primary {
        display: inline-block; padding: 0.65rem 1.4rem;
        background: linear-gradient(135deg, #f1c40f, #e67e22);
        color: #0d1117; font-weight: 700; border-radius: 8px;
        border: none; text-decoration: none; cursor: pointer; font-size: 0.95rem;
    }
    .btn-primary:hover { color: #0d1117; transform: scale(1.02); }
    .btn-secondary {
        display: inline-block; padding: 0.65rem 1.4rem;
        background: #21262d; color: #c9d1d9; border: 1px solid #30363d;
        border-radius: 8px; text-decoration: none; font-size: 0.95rem;
    }
    .btn-secondary:hover { color: #f1c40f; border-color: #f1c40f; }

    .info-extra {
        background: #1a2332; border-left: 3px solid #58a6ff;
        padding: 0.75rem 1rem; border-radius: 6px; color: #8b949e;
        font-size: 0.9rem; margin-bottom: 1rem; white-space: pre-wrap;
    }

    /* ============================================================
       Editor visual (Quill) - solo se activa si el usuario lo pide
       ============================================================ */
    .quill-toolbar-toggle {
        display: inline-block;
        margin-bottom: 0.4rem;
        padding: 0.35rem 0.85rem;
        background: #21262d;
        color: #c9d1d9;
        border: 1px solid #30363d;
        border-radius: 6px;
        font-size: 0.8rem;
        cursor: pointer;
        font-family: inherit;
    }
    .quill-toolbar-toggle:hover {
        color: #f1c40f;
        border-color: #f1c40f;
    }
    .quill-toolbar-toggle.activo {
        background: linear-gradient(135deg, #f1c40f, #e67e22);
        color: #0d1117;
        border-color: #f1c40f;
    }

    .quill-wrap { display: none; }
    .quill-wrap.visible { display: block; margin-bottom: 0.5rem; }

    /* Tema oscuro para Quill */
    .quill-wrap .ql-toolbar.ql-snow {
        background: #21262d !important;
        border: 1px solid #30363d !important;
        border-top-left-radius: 8px;
        border-top-right-radius: 8px;
    }
    .quill-wrap .ql-container.ql-snow {
        background: #0d1117 !important;
        border: 1px solid #30363d !important;
        border-top: none !important;
        border-bottom-left-radius: 8px;
        border-bottom-right-radius: 8px;
        color: #c9d1d9 !important;
        font-family: inherit !important;
        font-size: 0.95rem !important;
        min-height: 220px;
    }
    .quill-wrap .ql-editor {
        color: #c9d1d9 !important;
        min-height: 220px;
    }
    .quill-wrap .ql-editor.ql-blank::before { color: #6e7681 !important; }
    .quill-wrap .ql-snow .ql-stroke { stroke: #c9d1d9 !important; }
    .quill-wrap .ql-snow .ql-fill,
    .quill-wrap .ql-snow .ql-stroke.ql-fill { fill: #c9d1d9 !important; }
    .quill-wrap .ql-snow .ql-picker { color: #c9d1d9 !important; }
    .quill-wrap .ql-snow .ql-picker-options {
        background: #21262d !important;
        border-color: #30363d !important;
    }
    .quill-wrap .ql-snow .ql-picker-item { color: #c9d1d9 !important; }
    .quill-wrap .ql-snow .ql-picker-item:hover,
    .quill-wrap .ql-snow .ql-picker-item.ql-selected { color: #f1c40f !important; }
    .quill-wrap .ql-snow button:hover .ql-stroke,
    .quill-wrap .ql-snow button.ql-active .ql-stroke { stroke: #f1c40f !important; }
    .quill-wrap .ql-snow button:hover .ql-fill,
    .quill-wrap .ql-snow button.ql-active .ql-fill { fill: #f1c40f !important; }
    .quill-wrap .ql-snow a { color: #58a6ff !important; }
</style>

<div class="form-wrap">
    <h1 class="form-title">{{ titulo_form }}</h1>

    <div class="form-card">

        {% if extra_info %}
            <div class="info-extra">{{ extra_info }}</div>
        {% endif %}

        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            {{ form.as_p }}

            <div class="form-actions">
                <button type="submit" class="btn-primary">{{ accion }}</button>
                <a href="{{ url_cancelar }}" class="btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/quill@2.0.3/dist/quill.js"></script>
<script>
(function () {
    "use strict";

    var quillDisponible = (typeof Quill !== "undefined");

    function activarQuill(textarea) {
        // Si ya esta activo, no hacer nada
        if (textarea.dataset.quillActivo === "1") return;

        // Crear contenedor y toggle
        var wrapper = document.createElement("div");
        wrapper.className = "quill-wrap visible";

        var toolbarConfig = [
            [{ "header": [1, 2, 3, false] }],
            ["bold", "italic", "underline", "strike"],
            [{ "list": "ordered" }, { "list": "bullet" }],
            [{ "align": [] }],
            ["blockquote", "code-block"],
            ["link"],
            ["clean"]
        ];

        var quill;
        try {
            quill = new Quill(wrapper, {
                theme: "snow",
                placeholder: textarea.getAttribute("placeholder") || "Escribe aqui...",
                modules: { toolbar: toolbarConfig }
            });
        } catch (e) {
            console.warn("Quill no se pudo inicializar:", e);
            return;
        }

        // Insertar el editor justo antes del textarea
        textarea.parentNode.insertBefore(wrapper, textarea);

        // Cargar valor inicial
        var initial = textarea.value || "";
        if (initial.trim()) {
            try {
                quill.clipboard.dangerouslyPasteHTML(initial);
            } catch (e) {
                quill.root.innerHTML = initial;
            }
        }

        // Ocultar textarea (ahora SI, porque el editor quedo visible)
        textarea.style.display = "none";
        textarea.dataset.quillActivo = "1";

        // Sincronizar al enviar
        var form = textarea.closest("form");
        if (form) {
            form.addEventListener("submit", function () {
                var html = quill.root.innerHTML;
                if (html === "<p><br></p>" || html.trim() === "") html = "";
                textarea.value = html;
            });
        }

        // Cambiar el label del boton
        if (textarea._btnToggle) {
            textarea._btnToggle.textContent = "📝 Ocultar editor visual";
            textarea._btnToggle.classList.add("activo");
        }
    }

    function desactivarQuill(textarea) {
        if (textarea.dataset.quillActivo !== "1") return;
        // Sincronizar antes de ocultar
        var wrapper = textarea.parentNode.querySelector(".quill-wrap");
        if (wrapper) {
            var editor = wrapper.querySelector(".ql-editor");
            if (editor) textarea.value = editor.innerHTML;
            wrapper.remove();
        }
        textarea.style.display = "";
        textarea.dataset.quillActivo = "0";
        if (textarea._btnToggle) {
            textarea._btnToggle.textContent = "🎨 Usar editor visual";
            textarea._btnToggle.classList.remove("activo");
        }
    }

    function init() {
        var textareas = document.querySelectorAll("textarea.quill-editor");
        if (!textareas.length) return;

        textareas.forEach(function (textarea) {
            // Asegurar que el textarea es visible al inicio
            textarea.style.display = "";

            // Crear boton de toggle
            var btn = document.createElement("button");
            btn.type = "button";
            btn.className = "quill-toolbar-toggle";
            btn.textContent = quillDisponible
                ? "🎨 Usar editor visual"
                : "🎨 Editor visual (no disponible)";
            btn.disabled = !quillDisponible;

            if (quillDisponible) {
                btn.addEventListener("click", function () {
                    if (textarea.dataset.quillActivo === "1") {
                        desactivarQuill(textarea);
                    } else {
                        activarQuill(textarea);
                    }
                });
            }

            textarea.parentNode.insertBefore(btn, textarea);
            textarea._btnToggle = btn;
        });
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", init);
    } else {
        init();
    }
})();
</script>

{% endblock %}
