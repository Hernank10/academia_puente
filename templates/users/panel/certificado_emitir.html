{% extends "users/panel/base_panel.html" %}

{% block panel_content %}
<div class="panel-header">
    <a href="{% url 'users:panel_certificados' %}" class="btn-sec" style="margin-bottom:0.75rem;">← Volver</a>
    <h1>🎓 Emitir certificado</h1>
    <p>Emite un certificado manualmente. Verifica que el estudiante esté inscrito.</p>
</div>

<div class="card" style="max-width:600px;">
    <form method="post">
        {% csrf_token %}

        <div style="margin-bottom:1rem;">
            <label style="display:block; color:#e6edf3; font-weight:600; margin-bottom:0.35rem;">
                Estudiante
            </label>
            <select name="estudiante_id" required
                    style="width:100%; background:#0d1117; color:#c9d1d9;
                    border:1px solid #30363d; border-radius:8px; padding:0.6rem;">
                <option value="">— Selecciona un estudiante —</option>
                {% for e in estudiantes %}
                    <option value="{{ e.id }}">{{ e.username }} — {{ e.get_full_name }}</option>
                {% endfor %}
            </select>
        </div>

        <div style="margin-bottom:1rem;">
            <label style="display:block; color:#e6edf3; font-weight:600; margin-bottom:0.35rem;">
                Curso
            </label>
            <select name="curso_id" required
                    style="width:100%; background:#0d1117; color:#c9d1d9;
                    border:1px solid #30363d; border-radius:8px; padding:0.6rem;">
                <option value="">— Selecciona un curso —</option>
                {% for c in cursos %}
                    <option value="{{ c.id }}">{{ c.titulo }} ({{ c.nivel }})</option>
                {% endfor %}
            </select>
        </div>

        <div style="display:flex; gap:0.5rem;">
            <button type="submit" class="btn">🎓 Emitir certificado</button>
            <a href="{% url 'users:panel_certificados' %}" class="btn-sec">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
