{% extends "base.html" %}
{% load i18n %}

{% block content %}
<style>
    .auth-wrapper { max-width: 420px; margin: 4rem auto; padding: 2rem;
        background: #161b22; border: 1px solid #30363d; border-radius: 12px; }
    .auth-title { color: #f1c40f; font-weight: 700; margin-bottom: 0.5rem; text-align: center; }
    .auth-sub { color: #8b949e; text-align: center; margin-bottom: 2rem; font-size: 0.9rem; }
    .form-label-custom { color: #c9d1d9; font-size: 0.9rem; margin-bottom: 0.3rem; display: block; }
    .form-input { width: 100%; padding: 0.7rem 1rem; background: #0d1117;
        border: 1px solid #30363d; border-radius: 8px; color: #e6edf3;
        font-size: 1rem; margin-bottom: 1rem; }
    .form-input:focus { outline: none; border-color: #f1c40f;
        box-shadow: 0 0 0 3px rgba(241, 196, 15, 0.1); }
    .btn-submit { width: 100%; padding: 0.8rem;
        background: linear-gradient(135deg, #f1c40f, #e67e22);
        color: #0d1117; font-weight: 700; border: none; border-radius: 8px;
        cursor: pointer; font-size: 1rem; }
    .btn-submit:hover { transform: scale(1.02); }
    .auth-footer { text-align: center; margin-top: 1.5rem; color: #8b949e; font-size: 0.9rem; }
    .auth-footer a { color: #f1c40f; text-decoration: none; }
    .alert-error { background: #3d1f1f; border: 1px solid #6b2222; color: #ff9999;
        padding: 0.75rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.9rem; }
    .alert-success { background: #1f3d1f; border: 1px solid #226b22; color: #99ff99;
        padding: 0.75rem; border-radius: 8px; margin-bottom: 1rem; font-size: 0.9rem; }
</style>

<div class="auth-wrapper">
    <h1 class="auth-title">🔐 Iniciar sesión</h1>
    <p class="auth-sub">Bienvenido a Puente Digital</p>

    {% if messages %}
        {% for message in messages %}
            <div class="{% if message.tags == 'error' %}alert-error{% else %}alert-success{% endif %}">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <form method="post">
        {% csrf_token %}
        <label class="form-label-custom">{% trans "Usuario" %}</label>
        <input type="text" name="username" class="form-input" required autofocus>

        <label class="form-label-custom">{% trans "Contraseña" %}</label>
        <input type="password" name="password" class="form-input" required>

        <button type="submit" class="btn-submit">Entrar →</button>
    </form>

    <p class="auth-footer">
        ¿No tienes cuenta? <a href="{% url 'users:registro' %}">Regístrate</a>
    </p>
</div>
{% endblock %}
