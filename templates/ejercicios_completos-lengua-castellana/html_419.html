<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>🎵 LIRA · 100 técnicas poéticas</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Quicksand:wght@300;400;500;600;700&family=Nunito:wght@300;400;600;700&family=Dancing+Script:wght@400..700&family=Great+Vibes&family=Alex+Brush&family=Cedarville+Cursive&display=swap" rel="stylesheet" />

    <style>
        /* ============================================================
           BASE · ESTILO CUADERNO DE CALIGRAFÍA (pastel)
           ============================================================ */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --pastel-blue: #d4e8f7;
            --pastel-blue-dark: #b5d4e8;
            --pastel-yellow: #fdf6d3;
            --pastel-yellow-dark: #f5e8b0;
            --pastel-cream: #fcf8f0;
            --pastel-pink: #fce4ec;
            --pastel-mint: #d5f5e3;
            --ink-blue: #2c4a6e;
            --ink-blue-light: #5a7fa8;
            --ink-gray: #8a9bb5;
            --text-dark: #1a2a3a;
            --text-soft: #3d5a78;
            --shadow-soft: rgba(44, 74, 110, 0.08);
            --shadow-medium: rgba(44, 74, 110, 0.12);
            --font-hand: 'Patrick Hand', 'Quicksand', cursive;
            --font-sans: 'Quicksand', 'Nunito', sans-serif;
            --font-spencerian: 'Great Vibes', cursive;
            --font-copperplate: 'Alex Brush', cursive;
            --font-chancery: 'Cedarville Cursive', cursive;
            --font-palmer: 'Dancing Script', cursive;
            --border-radius: 16px;
        }

        body {
            font-family: var(--font-sans);
            background: var(--pastel-cream);
            background-image:
                radial-gradient(ellipse at 20% 30%, var(--pastel-blue) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 70%, var(--pastel-yellow) 0%, transparent 50%);
            min-height: 100vh;
            padding: 0.8rem;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            color: var(--text-dark);
        }

        .notebook {
            max-width: 1200px;
            width: 100%;
            background: var(--pastel-cream);
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(180, 200, 220, 0.12) 27px, rgba(180, 200, 220, 0.12) 28px);
            border-radius: var(--border-radius);
            box-shadow:
                0 4px 40px var(--shadow-medium),
                inset 0 0 60px rgba(255, 255, 255, 0.4);
            padding: 1.8rem 1.8rem 1.2rem;
            position: relative;
            border: 2px solid var(--pastel-blue-dark);
        }

        .notebook::before {
            content: '';
            position: absolute;
            inset: 6px;
            border: 1px dashed rgba(180, 200, 220, 0.3);
            border-radius: 12px;
            pointer-events: none;
        }

        .notebook::after {
            content: '✧ ✧ ✧';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--pastel-blue-dark);
            font-size: 0.6rem;
            letter-spacing: 6px;
            background: var(--pastel-cream);
            padding: 0 1rem;
            font-family: var(--font-hand);
            opacity: 0.4;
        }

        /* ============================================================
           ENCABEZADO
           ============================================================ */

        .app-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem 1rem;
            margin-bottom: 1rem;
            padding-bottom: 0.6rem;
            border-bottom: 2px dotted var(--pastel-blue-dark);
        }

        .app-header h1 {
            font-family: var(--font-hand);
            font-weight: 700;
            font-size: 1.8rem;
            color: var(--ink-blue);
            letter-spacing: 0.02em;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .app-header h1 small {
            font-family: var(--font-sans);
            font-size: 0.65rem;
            font-weight: 400;
            color: var(--ink-gray);
            letter-spacing: 0.06em;
        }

        .app-header .header-actions {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        .btn-notebook {
            font-family: var(--font-sans);
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0.3rem 1.2rem;
            border-radius: 30px;
            border: 2px solid var(--pastel-blue-dark);
            background: rgba(255, 255, 255, 0.4);
            color: var(--ink-blue);
            cursor: pointer;
            transition: all 0.3s;
            backdrop-filter: blur(4px);
        }

        .btn-notebook:hover {
            background: rgba(255, 255, 255, 0.7);
            border-color: var(--ink-blue);
            box-shadow: 0 2px 12px var(--shadow-soft);
        }

        .btn-notebook.primary {
            background: var(--pastel-blue);
            border-color: var(--pastel-blue-dark);
        }

        .btn-notebook.primary:hover {
            background: var(--pastel-blue-dark);
        }

        .btn-notebook.yellow {
            background: var(--pastel-yellow);
            border-color: var(--pastel-yellow-dark);
        }

        .btn-notebook.yellow:hover {
            background: var(--pastel-yellow-dark);
        }

        /* ============================================================
           PESTAÑAS
           ============================================================ */

        .tab-bar {
            display: flex;
            gap: 0.1rem;
            border-bottom: 2px solid var(--pastel-blue-dark);
            margin-bottom: 1.2rem;
            padding-bottom: 0.1rem;
            flex-wrap: wrap;
        }

        .tab-btn {
            font-family: var(--font-hand);
            font-size: 0.85rem;
            padding: 0.4rem 1.6rem 0.35rem;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            color: var(--ink-gray);
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 0.02em;
        }

        .tab-btn:hover {
            color: var(--ink-blue);
            background: rgba(255, 255, 255, 0.2);
        }

        .tab-btn.active {
            color: var(--ink-blue);
            border-bottom-color: var(--pastel-blue-dark);
            background: rgba(255, 255, 255, 0.3);
        }

        .tab-btn .badge-progress {
            display: inline-block;
            font-family: var(--font-sans);
            font-size: 0.55rem;
            background: var(--pastel-yellow);
            color: var(--ink-blue);
            border-radius: 30px;
            padding: 0.02rem 0.5rem;
            margin-left: 0.2rem;
            font-weight: 600;
            vertical-align: middle;
            line-height: 1.4;
        }

        .tab-pane {
            display: none;
            animation: fadeIn 0.35s ease;
        }

        .tab-pane.active {
            display: block;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(6px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============================================================
           PROGRESO
           ============================================================ */

        .progress-summary {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.4rem 1rem;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 12px;
            border: 1px solid var(--pastel-blue-dark);
            margin-bottom: 1rem;
            flex-wrap: wrap;
            backdrop-filter: blur(4px);
        }

        .progress-summary .progress-bar-bg {
            flex: 1;
            min-width: 80px;
            height: 8px;
            background: rgba(180, 200, 220, 0.2);
            border-radius: 30px;
            overflow: hidden;
            border: 1px solid var(--pastel-blue-dark);
        }

        .progress-summary .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--pastel-blue-dark), var(--ink-blue));
            border-radius: 30px;
            transition: width 0.5s ease;
        }

        .progress-summary .progress-text {
            font-family: var(--font-hand);
            font-size: 0.8rem;
            color: var(--ink-blue);
            white-space: nowrap;
        }

        .progress-summary .progress-text strong {
            color: var(--ink-blue);
            font-family: var(--font-sans);
        }

        /* ============================================================
           ACORDEÓN DE TÉCNICAS
           ============================================================ */

        .category-accordion {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            max-height: 540px;
            overflow-y: auto;
            padding-right: 0.3rem;
        }

        .category-accordion::-webkit-scrollbar {
            width: 5px;
        }
        .category-accordion::-webkit-scrollbar-track {
            background: var(--pastel-cream);
            border-radius: 30px;
        }
        .category-accordion::-webkit-scrollbar-thumb {
            background: var(--pastel-blue-dark);
            border-radius: 30px;
        }

        .category-item {
            border: 1px solid var(--pastel-blue-dark);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.2);
            overflow: hidden;
            transition: all 0.25s;
            backdrop-filter: blur(2px);
        }

        .category-item:hover {
            border-color: var(--ink-blue);
            box-shadow: 0 2px 16px var(--shadow-soft);
        }

        .category-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 0.8rem;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.15);
            transition: background 0.2s;
            user-select: none;
            flex-wrap: wrap;
        }

        .category-header:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .category-header .cat-icon {
            font-size: 1.2rem;
            color: var(--ink-blue);
            width: 2rem;
            text-align: center;
        }

        .category-header .cat-title {
            font-family: var(--font-hand);
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--ink-blue);
            flex: 1;
        }

        .category-header .cat-count {
            font-size: 0.6rem;
            color: var(--ink-gray);
            background: rgba(255, 255, 255, 0.3);
            padding: 0.02rem 0.6rem;
            border-radius: 30px;
            font-family: var(--font-sans);
            font-weight: 600;
        }

        .category-header .cat-arrow {
            color: var(--ink-gray);
            font-size: 0.7rem;
            transition: transform 0.3s;
        }

        .category-header .cat-arrow.open {
            transform: rotate(180deg);
            color: var(--ink-blue);
        }

        .category-body {
            padding: 0 0.8rem 0.8rem;
            display: none;
            border-top: 1px solid var(--pastel-blue-dark);
            padding-top: 0.5rem;
        }

        .category-body.open {
            display: block;
        }

        /* ============================================================
           TARJETA DE TÉCNICA
           ============================================================ */

        .tech-card {
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
            padding: 0.5rem 0.6rem;
            margin-bottom: 0.25rem;
            border-radius: 10px;
            border-left: 4px solid var(--pastel-yellow-dark);
            background: rgba(255, 255, 255, 0.15);
            transition: background 0.2s;
        }

        .tech-card:hover {
            background: rgba(255, 255, 255, 0.35);
        }

        .tech-card .tech-head {
            display: flex;
            align-items: baseline;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        .tech-card .tech-num {
            font-family: var(--font-hand);
            font-size: 0.6rem;
            color: var(--ink-gray);
            min-width: 2.2rem;
            font-weight: 600;
        }

        .tech-card .tech-name {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--ink-blue);
            font-family: var(--font-sans);
        }

        .tech-card .tech-rhetoric {
            font-size: 0.55rem;
            background: var(--pastel-yellow);
            padding: 0.02rem 0.5rem;
            border-radius: 30px;
            color: var(--ink-blue);
            font-style: italic;
            font-weight: 500;
            border: 1px solid var(--pastel-yellow-dark);
        }

        .tech-card .tech-def {
            font-size: 0.8rem;
            color: var(--text-soft);
            line-height: 1.5;
            margin: 0.05rem 0 0.05rem;
            padding-left: 0.1rem;
        }

        .tech-card .tech-example-box {
            font-size: 0.75rem;
            color: var(--text-soft);
            font-style: italic;
            background: rgba(255, 255, 255, 0.3);
            padding: 0.15rem 0.6rem;
            border-radius: 8px;
            border-left: 3px solid var(--pastel-blue-dark);
            margin: 0.05rem 0 0.1rem;
            line-height: 1.6;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.3rem;
        }

        .tech-card .tech-example-box .example-text {
            flex: 1;
            min-width: 120px;
        }

        .tech-card .tech-example-box .btn-speech {
            font-family: var(--font-sans);
            font-size: 0.5rem;
            padding: 0.05rem 0.5rem;
            border-radius: 30px;
            border: 1px solid var(--pastel-blue-dark);
            background: rgba(255, 255, 255, 0.3);
            color: var(--ink-gray);
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.1rem;
            white-space: nowrap;
        }

        .tech-card .tech-example-box .btn-speech:hover {
            background: rgba(255, 255, 255, 0.6);
            border-color: var(--ink-blue);
            color: var(--ink-blue);
        }

        .tech-card .tech-example-box .btn-speech.speaking {
            color: var(--ink-blue);
            border-color: var(--ink-blue);
            background: var(--pastel-yellow);
        }

        .tech-card .tech-practice-area {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 0.3rem 0.6rem;
            margin-top: 0.1rem;
            padding-top: 0.2rem;
            border-top: 1px dashed var(--pastel-blue-dark);
        }

        .tech-card .tech-practice-area .practice-input-group {
            flex: 1;
            min-width: 160px;
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
        }

        .tech-card .tech-practice-area .practice-input-group textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.3);
            border: 1px solid var(--pastel-blue-dark);
            border-radius: 8px;
            padding: 0.2rem 0.5rem;
            font-family: var(--font-sans);
            font-size: 0.75rem;
            color: var(--text-dark);
            resize: vertical;
            min-height: 32px;
            transition: border-color 0.3s;
        }

        .tech-card .tech-practice-area .practice-input-group textarea:focus {
            border-color: var(--ink-blue);
            outline: none;
            box-shadow: 0 0 0 3px rgba(44, 74, 110, 0.05);
        }

        .tech-card .tech-practice-area .practice-input-group .practice-preview {
            font-size: 0.85rem;
            padding: 0.1rem 0.3rem;
            min-height: 1.4rem;
            color: var(--ink-blue);
            border-bottom: 1px solid var(--pastel-blue-dark);
            line-height: 1.6;
            word-break: break-word;
            transition: all 0.15s;
            font-style: italic;
            opacity: 0.5;
        }

        .tech-card .tech-practice-area .practice-input-group .practice-preview:empty::before {
            content: 'tu verso aparecerá aquí...';
            color: var(--ink-gray);
            opacity: 0.3;
            font-size: 0.6rem;
            font-style: italic;
        }

        /* Estilos de caligrafía para previsualización */
        .preview-spencerian {
            font-family: var(--font-spencerian);
            font-style: normal;
            opacity: 1;
        }
        .preview-copperplate {
            font-family: var(--font-copperplate);
            font-style: normal;
            opacity: 1;
        }
        .preview-chancery {
            font-family: var(--font-chancery);
            font-style: normal;
            opacity: 1;
        }
        .preview-palmer {
            font-family: var(--font-palmer);
            font-style: normal;
            opacity: 1;
        }
        .preview-normal {
            font-family: var(--font-sans);
            font-style: italic;
            opacity: 0.5;
        }

        .tech-card .tech-practice-area .tech-actions {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            flex-wrap: wrap;
            padding-top: 0.1rem;
        }

        .tech-card .tech-practice-area .tech-actions .btn-speech-small {
            font-family: var(--font-sans);
            font-size: 0.45rem;
            padding: 0.04rem 0.4rem;
            border-radius: 30px;
            border: 1px solid var(--pastel-blue-dark);
            background: rgba(255, 255, 255, 0.2);
            color: var(--ink-gray);
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.05rem;
        }

        .tech-card .tech-practice-area .tech-actions .btn-speech-small:hover {
            background: rgba(255, 255, 255, 0.5);
            border-color: var(--ink-blue);
            color: var(--ink-blue);
        }

        .tech-card .tech-practice-area .tech-actions .btn-speech-small.speaking {
            color: var(--ink-blue);
            border-color: var(--ink-blue);
            background: var(--pastel-yellow);
        }

        .tech-card .tech-practice-area .tech-actions label {
            display: flex;
            align-items: center;
            gap: 0.15rem;
            font-size: 0.55rem;
            color: var(--ink-gray);
            cursor: pointer;
            font-family: var(--font-sans);
        }

        .tech-card .tech-practice-area .tech-actions input[type="checkbox"] {
            appearance: none;
            width: 0.9rem;
            height: 0.9rem;
            border: 2px solid var(--pastel-blue-dark);
            border-radius: 4px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.3);
            transition: all 0.15s;
            position: relative;
            flex-shrink: 0;
        }

        .tech-card .tech-practice-area .tech-actions input[type="checkbox"]:checked {
            background: var(--pastel-blue-dark);
            border-color: var(--ink-blue);
        }

        .tech-card .tech-practice-area .tech-actions input[type="checkbox"]:checked::after {
            content: '✓';
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--pastel-cream);
            font-size: 0.6rem;
            font-weight: 700;
        }

        .tech-card .tech-practice-area .tech-actions .wax-seal {
            display: inline-flex;
            align-items: center;
            gap: 0.1rem;
            font-size: 0.5rem;
            color: var(--ink-blue);
            font-weight: 600;
            font-family: var(--font-hand);
            opacity: 0.2;
            transition: opacity 0.3s;
        }

        .tech-card .tech-practice-area .tech-actions .wax-seal.active {
            opacity: 1;
        }

        .tech-card .tech-practice-area .tech-actions .wax-seal .seal-icon {
            font-size: 0.8rem;
        }

        /* ============================================================
           PASTILLAS DE ESTILO (caligrafía)
           ============================================================ */

        .style-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 0.1rem;
            margin: 0.15rem 0 0.05rem;
            padding: 0.1rem 0.2rem;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            border: 1px solid var(--pastel-blue-dark);
        }

        .style-pill {
            font-family: var(--font-sans);
            font-size: 0.4rem;
            font-weight: 600;
            padding: 0.04rem 0.4rem;
            border-radius: 30px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--ink-gray);
            cursor: pointer;
            transition: all 0.2s;
        }

        .style-pill:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: var(--pastel-blue-dark);
            color: var(--ink-blue);
        }

        .style-pill.active {
            background: var(--pastel-yellow);
            border-color: var(--pastel-yellow-dark);
            color: var(--ink-blue);
        }

        .style-pill .pill-preview {
            display: inline-block;
            font-size: 0.6rem;
            margin-left: 0.05rem;
            opacity: 0.3;
        }

        .style-pill.active .pill-preview {
            opacity: 1;
        }

        /* ============================================================
           EJERCICIOS INTERACTIVOS
           ============================================================ */

        .exercise-section {
            background: rgba(255, 255, 255, 0.3);
            border: 1px solid var(--pastel-blue-dark);
            border-radius: 12px;
            padding: 1rem 1.2rem;
            margin-top: 1rem;
            backdrop-filter: blur(4px);
        }

        .exercise-section h3 {
            font-family: var(--font-hand);
            font-size: 1rem;
            color: var(--ink-blue);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .exercise-section .exercise-prompt {
            font-size: 0.85rem;
            color: var(--text-soft);
            margin-bottom: 0.4rem;
            line-height: 1.6;
        }

        .exercise-section .exercise-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.3);
            border: 1px solid var(--pastel-blue-dark);
            border-radius: 8px;
            padding: 0.4rem 0.6rem;
            font-family: var(--font-sans);
            font-size: 0.8rem;
            color: var(--text-dark);
            resize: vertical;
            min-height: 60px;
            transition: border-color 0.3s;
        }

        .exercise-section .exercise-input:focus {
            border-color: var(--ink-blue);
            outline: none;
            box-shadow: 0 0 0 3px rgba(44, 74, 110, 0.05);
        }

        .exercise-section .exercise-actions {
            display: flex;
            gap: 0.4rem;
            margin-top: 0.4rem;
            flex-wrap: wrap;
        }

        .exercise-section .exercise-actions .btn-exercise {
            font-family: var(--font-sans);
            font-size: 0.65rem;
            font-weight: 600;
            padding: 0.2rem 1rem;
            border-radius: 30px;
            border: 1px solid var(--pastel-blue-dark);
            background: rgba(255, 255, 255, 0.3);
            color: var(--ink-blue);
            cursor: pointer;
            transition: all 0.3s;
        }

        .exercise-section .exercise-actions .btn-exercise:hover {
            background: rgba(255, 255, 255, 0.6);
            border-color: var(--ink-blue);
        }

        .exercise-section .exercise-actions .btn-exercise.primary {
            background: var(--pastel-yellow);
            border-color: var(--pastel-yellow-dark);
        }

        .exercise-section .exercise-actions .btn-exercise.primary:hover {
            background: var(--pastel-yellow-dark);
        }

    <script>
        (function() {
            'use strict';

            // ============================================================
            //  1. DATOS: 100 TÉCNICAS POÉTICAS
            // ============================================================

            const CATEGORIES = [{
                id: 'p1',
                icon: '📏',
                name: 'Métrica y ritmo',
                techniques: [
                    { id: 1, name: 'Verso endecasílabo', rhetoric: 'Métrica',
                        def: 'Verso de once sílabas, el más usado en la lírica española. Su ritmo natural lo hace ideal para el verso heroico.',
                        example: 'No era el sueño, era la luz que vibra.' },
                    { id: 2, name: 'Verso heptasílabo', rhetoric: 'Métrica',
                        def: 'Verso de siete sílabas, de carácter popular y canción. Transmite ligereza y fluidez.',
                        example: 'La luna se ha dormido.' },
                    { id: 3, name: 'Verso alejandrino', rhetoric: 'Métrica',
                        def: 'Verso de catorce sílabas, dividido en dos hemistiquios de siete. Usado en la poesía culta.',
                        example: 'El viento deshojaba la tarde, y la lluvia contaba los sueños.' },
                    { id: 4, name: 'Verso libre', rhetoric: 'Métrica',
                        def: 'Verso sin métrica fija ni rima regular. Se rige por el ritmo interno y la respiración del poema.',
                        example: 'la luz se desliza / como un río de plata / y el silencio se vuelve agua' },
                    { id: 5, name: 'Anacrusis', rhetoric: 'Ritmo',
                        def: 'Sílaba o sílabas que anteceden al primer tiempo fuerte del verso, creando un impulso inicial.',
                        example: 'y en la noche / canta el viento' },
                    { id: 6, name: 'Cesura', rhetoric: 'Ritmo',
                        def: 'Pausa interna en el verso alejandrino o en versos compuestos. Divide el verso en dos partes rítmicas.',
                        example: 'El mar, en su silencio, / guarda todas las voces.' },
                    { id: 7, name: 'Encabalgamiento', rhetoric: 'Ritmo',
                        def: 'Continuación de la frase más allá del final del verso, creando tensión y fluidez.',
                        example: 'la luz se desvanece / y el día / se convierte en sombra' },
                    { id: 8, name: 'Ritmo yámbico', rhetoric: 'Ritmo',
                        def: 'Sucesión de sílabas átonas y tónicas que crea un ritmo ascendente. Propio de la poesía inglesa pero adaptable.',
                        example: 'el tiempo / no existe / solo el latido' },
                    { id: 9, name: 'Ritmo trocaico', rhetoric: 'Ritmo',
                        def: 'Sucesión de sílabas tónicas y átonas que crea un ritmo descendente y marcado.',
                        example: 'cierra / los ojos / y escucha / el viento' },
                    { id: 10, name: 'Polirritmia', rhetoric: 'Ritmo',
                        def: 'Combinación de varios ritmos dentro de un mismo poema, creando un efecto de diversidad y movimiento.',
                        example: 'La luz cae / como una hoja / y el viento / es un río / que no se detiene' }
                ]
            }, {
                id: 'p2',
                icon: '🔤',
                name: 'Rima y sonido',
                techniques: [
                    { id: 11, name: 'Rima consonante', rhetoric: 'Rima',
                        def: 'Coincidencia de todos los sonidos a partir de la última vocal acentuada. Da musicalidad y cohesión.',
                        example: 'Como el agua que pasa, / la vida se deshace / y el tiempo se reparte / en sueños y en fracasos.' },
                    { id: 12, name: 'Rima asonante', rhetoric: 'Rima',
                        def: 'Coincidencia solo de las vocales a partir de la última vocal acentuada. Produce un efecto más suave.',
                        example: 'El viento canta en la tarde, / y el árbol se viste de sombra, / todo es luz y desvarío.' },
                    { id: 13, name: 'Rima interna', rhetoric: 'Rima',
                        def: 'Rima que se produce dentro del mismo verso, no al final. Refuerza la musicalidad interna.',
                        example: 'La noche abre su mano y el día se va, tarde.' },
                    { id: 14, name: 'Aliteración', rhetoric: 'Sonido',
                        def: 'Repetición de sonidos consonánticos para crear un efecto auditivo que refuerza el sentido.',
                        example: 'Susurra el silencio, se cuela en la sombra.' },
                    { id: 15, name: 'Onomatopeya', rhetoric: 'Sonido',
                        def: 'Palabra que imita un sonido natural, creando una imagen auditiva directa.',
                        example: 'El reloj hace tictac, / y el tren, chucuchú, / se aleja hacia el mar.' },
                    { id: 16, name: 'Paronomasia', rhetoric: 'Sonido',
                        def: 'Juego de palabras con sonidos similares pero significados diferentes. Crea tensión y sorpresa.',
                        example: 'El alma se alza, el alba se alza.' },
                    { id: 17, name: 'Eufonía', rhetoric: 'Sonido',
                        def: 'Combinación de sonidos agradables al oído, que busca la belleza sonora del poema.',
                        example: 'La luz del alba baña las alas del ave que vuela.' },
                    { id: 18, name: 'Cacofonía', rhetoric: 'Sonido',
                        def: 'Combinación de sonidos ásperos o desagradables, usada con intención expresiva.',
                        example: 'El trueno ronco rasga la roca.' },
                    { id: 19, name: 'Verso blanco', rhetoric: 'Rima',
                        def: 'Verso con métrica pero sin rima. Crea un efecto de naturalidad y libertad dentro de la forma.',
                        example: 'La noche se derrama sobre el campo, / y el viento trae el eco de los pasos.' },
                    { id: 20, name: 'Verso suelto', rhetoric: 'Rima',
                        def: 'Verso que no rima con otros en un poema con rima. Genera contraste y libertad dentro de la estructura.',
                        example: 'El mar es un espejo de la luna. / La brisa juega con la arena, / y yo, mudo, observo.' }
                ]
            }, {
                id: 'p3',
                icon: '🌿',
                name: 'Figuras retóricas I',
                techniques: [
                    { id: 21, name: 'Metáfora', rhetoric: 'Figura',
                        def: 'Identificación de un término real con uno imaginario, sin "como". Crea una nueva realidad poética.',
                        example: 'Tus ojos son dos pozos de luz.' },
                    { id: 22, name: 'Símil', rhetoric: 'Figura',
                        def: 'Comparación explícita usando "como", "cual", "tal como". Crea una imagen clara y accesible.',
                        example: 'Su voz era como el viento en los pinos.' },
                    { id: 23, name: 'Personificación', rhetoric: 'Figura',
                        def: 'Atribuir cualidades humanas a seres inanimados o abstractos. Da vida a lo inerte.',
                        example: 'El viento llora en la ventana.' },
                    { id: 24, name: 'Antítesis', rhetoric: 'Figura',
                        def: 'Contraposición de dos ideas opuestas para crear tensión y profundidad.',
                        example: 'Es un suspiro que es un grito.' },
                    { id: 25, name: 'Hipérbole', rhetoric: 'Figura',
                        def: 'Exageración deliberada para enfatizar una idea o emoción.',
                        example: 'Te esperé un siglo en el umbral.' },
                    { id: 26, name: 'Sinestesia', rhetoric: 'Figura',
                        def: 'Mezcla de sensaciones de diferentes sentidos, creando una experiencia poética total.',
                        example: 'El olor de la lluvia es un susurro azul.' },
                    { id: 27, name: 'Metonimia', rhetoric: 'Figura',
                        def: 'Designar una cosa con el nombre de otra con la que tiene relación de contigüidad.',
                        example: 'El mar se encrespó en su mirada.' },
                    { id: 28, name: 'Sinécdoque', rhetoric: 'Figura',
                        def: 'Designar el todo por la parte o la parte por el todo.',
                        example: 'Cien velas surcaban el horizonte.' },
                    { id: 29, name: 'Oxímoron', rhetoric: 'Figura',
                        def: 'Unión de términos opuestos que crea una verdad paradójica.',
                        example: 'Un silencio ensordecedor.' },
                    { id: 30, name: 'Paradoja', rhetoric: 'Figura',
                        def: 'Afirmación que parece contradictoria pero encierra una verdad profunda.',
                        example: 'Solo sé que no sé nada.' }
                ]
            }, {
                id: 'p4',
                icon: '🎭',
                name: 'Figuras retóricas II',
                techniques: [
                    { id: 31, name: 'Anáfora', rhetoric: 'Figura',
                        def: 'Repetición de una palabra al inicio de varios versos para crear ritmo y énfasis.',
                        example: 'Voy por la luz, voy por la sombra, voy por el sueño, voy por el miedo.' },
                    { id: 32, name: 'Epífora', rhetoric: 'Figura',
                        def: 'Repetición de una palabra al final de varios versos, creando un eco persistente.',
                        example: 'El día se va, la luz se va, el tiempo se va, la voz se va.' },
                    { id: 33, name: 'Polisíndeton', rhetoric: 'Figura',
                        def: 'Uso repetido de conjunciones para dar solemnidad o lentitud al verso.',
                        example: 'Y el mar y el viento y la lluvia y el sol y la luna.' },
                    { id: 34, name: 'Asíndeton', rhetoric: 'Figura',
                        def: 'Omisión de conjunciones para dar agilidad y rapidez al verso.',
                        example: 'Llegué, vi, vencí, soñé, callé.' },
                    { id: 35, name: 'Elipsis', rhetoric: 'Figura',
                        def: 'Supresión de elementos lingüísticos que se sobreentienden, creando un verso más conciso.',
                        example: 'La noche, el viento, el mar. El miedo.' },
                    { id: 36, name: 'Hipérbaton', rhetoric: 'Figura',
                        def: 'Alteración del orden sintáctico normal para dar mayor expresividad o musicalidad.',
                        example: 'Del cielo caen, lentas, las estrellas.' },
                    { id: 37, name: 'Apóstrofe', rhetoric: 'Figura',
                        def: 'Invocación directa a una persona, objeto o idea ausente.',
                        example: 'Oh, noche, tú que guardas mis secretos.' },
                    { id: 38, name: 'Exclamación', rhetoric: 'Figura',
                        def: 'Expresión de emociones intensas con signos de exclamación.',
                        example: '¡Oh, luz! ¡Oh, sombra! ¡Oh, tiempo!' },
                    { id: 39, name: 'Interrogación retórica', rhetoric: 'Figura',
                        def: 'Pregunta que no espera respuesta, sino que busca provocar reflexión.',
                        example: '¿Y qué es el tiempo sino un río?' },
                    { id: 40, name: 'Ironía', rhetoric: 'Figura',
                        def: 'Decir una cosa queriendo significar lo contrario, con un tono sutil.',
                        example: 'Qué bonito es el olvido, no duele nada.' }
                ]
            }, {
                id: 'p5',
                icon: '🏛️',
                name: 'Estrofas y estructuras',
                techniques: [
                    { id: 41, name: 'Soneto', rhetoric: 'Estrofa',
                        def: 'Poema de catorce versos endecasílabos divididos en dos cuartetos y dos tercetos. Estructura clásica.',
                        example: 'Cuarteto: En la noche, el silencio es un espejo. / Terceto: Y el tiempo pasa lento, / y el alma se deshace en el reflejo.' },
                    { id: 42, name: 'Lira', rhetoric: 'Estrofa',
                        def: 'Estrofa de cinco versos heptasílabos y endecasílabos (7a, 11b, 7a, 7c, 11b). Usada en la poesía renacentista.',
                        example: 'Si de mi alma la luz / se apaga en la mañana, / y el viento la deshace, / ¿quién guarda la esperanza / si todo el mundo yace?' },
                    { id: 43, name: 'Silva', rhetoric: 'Estrofa',
                        def: 'Combinación libre de versos heptasílabos y endecasílabos sin rima fija, con gran flexibilidad.',
                        example: 'El río que desciende, / y la luz que se pierde / en la tarde que muere.' },
                    { id: 44, name: 'Romance', rhetoric: 'Estrofa',
                        def: 'Versos octosílabos con rima asonante en los pares. De tradición popular.',

            const STORAGE_KEY = 'cuaderno_poetico_100';

            function loadState() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) return JSON.parse(raw);
                } catch (_) { /* ignore */ }
                return { entries: {} };
            }

            function saveState() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
                } catch (_) { /* ignore */ }
            }

            let appState = loadState();

            // Inicializar técnicas
            CATEGORIES.forEach(cat => {
                cat.techniques.forEach(t => {
                    if (!appState.entries[t.id]) {
                        appState.entries[t.id] = { text: '', written: false, style: 'normal' };
                    }
                });
            });
            saveState();

            // ============================================================
            //  3. VOZ (Web Speech API)
            // ============================================================

            let speechSynth = window.speechSynthesis;
            let isSpeaking = false;
            let speakingId = null;
            const floatStopBtn = document.getElementById('floatStopBtn');

            function speakText(text, id, onStart, onEnd) {
                if (isSpeaking) {
                    speechSynth.cancel();
                    isSpeaking = false;
                    floatStopBtn.classList.remove('visible');
                    if (onEnd) onEnd();
                    setTimeout(() => speakText(text, id, onStart, onEnd), 100);
                    return;
                }

                const utterance = new SpeechSynthesisUtterance(text);
                const voices = speechSynth.getVoices();
                const esVoice = voices.find(v => v.lang.startsWith('es')) || voices[0];
                if (esVoice) utterance.voice = esVoice;
                utterance.lang = 'es-ES';
                utterance.rate = 0.9;
                utterance.pitch = 1;

                utterance.onstart = function() {
                    isSpeaking = true;
                    speakingId = id;
                    floatStopBtn.classList.add('visible');
                    if (onStart) onStart();
                    document.querySelectorAll(`.btn-speech[data-id="${id}"]`).forEach(b => b.classList.add('speaking'));
                    document.querySelectorAll(`.btn-speech-small[data-id="${id}"]`).forEach(b => b.classList.add(
                    'speaking'));
                };

                utterance.onend = function() {
                    isSpeaking = false;
                    speakingId = null;
                    floatStopBtn.classList.remove('visible');
                    if (onEnd) onEnd();
                    document.querySelectorAll('.btn-speech.speaking').forEach(b => b.classList.remove('speaking'));
                    document.querySelectorAll('.btn-speech-small.speaking').forEach(b => b.classList.remove('speaking'));
                };

                utterance.onerror = function() {
                    isSpeaking = false;
                    speakingId = null;
                    floatStopBtn.classList.remove('visible');
                    if (onEnd) onEnd();
                    document.querySelectorAll('.btn-speech.speaking').forEach(b => b.classList.remove('speaking'));
                    document.querySelectorAll('.btn-speech-small.speaking').forEach(b => b.classList.remove('speaking'));
                };

                speechSynth.speak(utterance);
            }

            function stopSpeaking() {
                if (isSpeaking) {
                    speechSynth.cancel();
                    isSpeaking = false;
                    speakingId = null;
                    floatStopBtn.classList.remove('visible');
                    document.querySelectorAll('.btn-speech.speaking').forEach(b => b.classList.remove('speaking'));
                    document.querySelectorAll('.btn-speech-small.speaking').forEach(b => b.classList.remove('speaking'));
                }
            }

            floatStopBtn.addEventListener('click', stopSpeaking);

                        renderQuiz();
                    });
                });

                // Botones de escuchar (ejemplo)
                document.querySelectorAll('.btn-speech').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = parseInt(this.dataset.id);
                        const text = this.dataset.text;
                        if (!text) return;
                        speakText(text, id);
                    });
                });

                // Botones de escuchar (texto del usuario)
                document.querySelectorAll('.btn-speech-small').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = parseInt(this.dataset.id);
                        let text = this.dataset.text;
                        if (!text || text.trim() === '') {
                            const exampleBtn = document.querySelector(`.btn-speech[data-id="${id}"]`);
                            if (exampleBtn) text = exampleBtn.dataset.text || '';
                        }
                        if (!text) return;
                        speakText(text, id);
                    });
                });

                // Estilos
                document.querySelectorAll('.style-pill').forEach(pill => {
                    pill.addEventListener('click', function() {
                        const targetId = parseInt(this.dataset.target);
                        const style = this.dataset.style;
                        if (!appState.entries[targetId]) appState.entries[targetId] = { text: '',
                            written: false, style: 'normal' };
                        appState.entries[targetId].style = style;
                        saveState();
                        const preview = document.querySelector(`.practice-preview[data-id="${targetId}"]`);
                        if (preview) {
                            preview.className = `practice-preview ${getStyleClassFor(style)}`;
                        }
                        const parent = this.closest('.style-pills');
                        parent.querySelectorAll('.style-pill').forEach(p => p.classList.remove('active'));
                        this.classList.add('active');
                    });
                });

                saveState();
            }

            // ============================================================
            //  5. FUNCIONES DE ESTILO
            // ============================================================

            function getStyleClassFor(style) {
                switch (style) {
                    case 'spencerian':
                        return 'preview-spencerian';
                    case 'copperplate':
                        return 'preview-copperplate';
                    case 'chancery':
                        return 'preview-chancery';
                    case 'palmer':
                        return 'preview-palmer';
                    default:
                        return 'preview-normal';
                }
            }

            // ============================================================
            //  6. EJERCICIOS INTERACTIVOS
            // ============================================================

            const exercises = [{
                id: 1,
                prompt: 'Escribe un verso endecasílabo (11 sílabas) que exprese un sentimiento profundo. Cuenta las sílabas para asegurarte.',
                hint: 'Piensa en un momento emocional y trata de encapsularlo en un verso de once sílabas.'
            }, {
                id: 2,
                prompt: 'Crea una metáfora original que compare un sentimiento con un elemento natural.',
                hint: 'Por ejemplo: "La tristeza es un río subterráneo que fluye sin hacer ruido".'
            }, {
                id: 3,
                prompt: 'Escribe un poema de tres versos usando la técnica de la anáfora (repetición al inicio).',
                hint: 'Empieza cada verso con la misma palabra o estructura.'
            }, {
                id: 4,
                prompt: 'Practica la sinestesia: escribe un verso que mezcle dos sentidos diferentes.',
                hint: 'Por ejemplo: "El olor de la noche tiene un color violeta".'
            }, {
                id: 5,
                prompt: 'Escribe un haiku de 5-7-5 sílabas sobre el paso del tiempo.',
                hint: 'Un haiku tradicional captura un instante de la naturaleza y una emoción.'
            }];

            let currentExercise = 0;
            let exerciseFeedback = '';

            function renderExercise() {
                const container = document.getElementById('exerciseContent');
                const ex = exercises[currentExercise];
                const totalW = Object.values(appState.entries).filter(e => e.written).length;

                let html = `
                    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:0.3rem;margin-bottom:0.4rem;">
                        <span style="font-family:var(--font-hand);font-size:0.7rem;color:var(--ink-gray);">ejercicio ${currentExercise+1} de ${exercises.length}</span>
                        <span style="font-family:var(--font-sans);font-size:0.6rem;color:var(--ink-gray);">versos escritos: ${totalW}/100</span>
                    </div>
                    <div class="exercise-prompt">${ex.prompt}</div>
                    <div style="font-size:0.65rem;color:var(--ink-gray);opacity:0.5;margin-bottom:0.3rem;">💡 ${ex.hint}</div>
                    <textarea class="exercise-input" id="exerciseInput" placeholder="Escribe tu verso aquí..."></textarea>
                    <div class="exercise-actions">
                        <button class="btn-exercise" id="exercisePrevBtn">◀ anterior</button>
                        <button class="btn-exercise" id="exerciseNextBtn">siguiente ▶</button>
                        <button class="btn-exercise primary" id="exerciseCheckBtn">🔍 revisar</button>
                        <button class="btn-exercise" id="exerciseSaveBtn">💾 guardar</button>
                    </div>
                    <div class="exercise-feedback" id="exerciseFeedback">${exerciseFeedback || 'Escribe tu verso y presiona "revisar" para obtener retroalimentación.'}</div>
                `;

                container.innerHTML = html;

                document.getElementById('exercisePrevBtn').addEventListener('click', function() {
                    if (currentExercise > 0) { currentExercise--;
                        exerciseFeedback = '';
                        renderExercise(); }
                });
                document.getElementById('exerciseNextBtn').addEventListener('click', function() {
                    if (currentExercise < exercises.length - 1) { currentExercise++;
                        exerciseFeedback = '';
                        renderExercise(); }
                });

                document.getElementById('exerciseCheckBtn').addEventListener('click', function() {
                    const text = document.getElementById('exerciseInput').value.trim();
                    if (!text) {
                        exerciseFeedback = '✧ Escribe algo antes de revisar.';
                        renderExercise();
                        return;
                    }
                    const words = text.split(/\s+/);
                    const wordCount = words.length;
                    const hasImage = /\b(como|semejante|color|luz|sombra|mar|viento|fuego|agua)\b/i.test(text);
                    const hasEmotion = /\b(amor|tristeza|alegría|esperanza|miedo|silencio|soledad)\b/i.test(text);

                    let feedback = '✧ ';
                    if (wordCount < 5) feedback += 'Tu verso es breve. Prueba a extenderlo con más imágenes. ';
                    else feedback += 'Bien, has escrito con extensión. ';

                    if (hasImage) feedback += 'Usas imágenes poéticas, excelente. ';
                    else feedback += 'Añade una imagen visual o sensorial para dar profundidad. ';

                    if (hasEmotion) feedback += 'Incluyes emoción, eso da vida al verso. ';
                    else feedback += 'Prueba a añadir un sentimiento para conectar. ';

                    feedback += '✧';

                    const tempId = 999;
                    if (!appState.entries[tempId]) appState.entries[tempId] = { text: '', written: false,
                        style: 'normal' };
                    appState.entries[tempId].text = text;
                    saveState();

                    exerciseFeedback = feedback;
                    renderExercise();
                    document.getElementById('exerciseInput').value = text;
                });

                document.getElementById('exerciseSaveBtn').addEventListener('click', function() {
                    const text = document.getElementById('exerciseInput').value.trim();
                    if (!text) { exerciseFeedback = '✧ Escribe algo para guardar.';
                        renderExercise(); return; }
                    const tempId = 999;
                    if (!appState.entries[tempId]) appState.entries[tempId] = { text: '', written: false,
                        style: 'normal' };
                    appState.entries[tempId].text = text;
                    saveState();
                    exerciseFeedback = '✧ Verso guardado en tu cuaderno. ✧';
                    renderExercise();
                    document.getElementById('exerciseInput').value = text;
                });

                const saved = appState.entries[999];
                if (saved && saved.text) {
                    document.getElementById('exerciseInput').value = saved.text;
                }
            }

            // ============================================================
            //  7. QUIZ
            // ============================================================

            const quizQuestions = [{
                question: '¿Qué técnica métrica consiste en un verso de once sílabas, el más usado en la lírica española?',
                options: ['Verso alejandrino', 'Verso endecasílabo', 'Verso heptasílabo', 'Verso libre'],
                correct: 1
            }, {
                question: '¿Qué figura retórica identifica un término real con uno imaginario sin usar "como"?',
                options: ['Símil', 'Metáfora', 'Personificación', 'Antítesis'],
                correct: 1
            }, {
                question: '¿Cómo se llama la repetición de una palabra al inicio de varios versos?',
                options: ['Epífora', 'Anáfora', 'Polisíndeton', 'Asíndeton'],
                correct: 1
            }, {
                question: '¿Qué estrofa clásica consta de catorce versos endecasílabos divididos en dos cuartetos y dos tercetos?',
                options: ['Lira', 'Soneto', 'Silva', 'Romance'],
                correct: 1
            }, {
                question: '¿Qué imagen poética apela al sentido del olfato?',
                options: ['Imagen visual', 'Imagen auditiva', 'Imagen olfativa', 'Imagen táctil'],
                correct: 2
            }, {
                question: '¿Qué técnica consiste en exagerar deliberadamente para enfatizar una idea?',
                options: ['Hipérbole', 'Ironía', 'Paradoja', 'Oxímoron'],
                correct: 0
            }, {
                question: '¿Cómo se llama la unión de términos opuestos que crea una verdad paradójica?',
                options: ['Antítesis', 'Oxímoron', 'Paradoja', 'Sinestesia'],
                correct: 1
            }, {
                question: '¿Qué tipo de poema utiliza la disposición visual de las palabras como parte del sentido?',
                options: ['Poesía concreta', 'Poesía fonética', 'Poesía collage', 'Poesía minimalista'],
                correct: 0
            }, {
                question: '¿Qué técnica consiste en atribuir cualidades humanas a seres inanimados?',
                options: ['Prosopografía', 'Personificación', 'Metonimia', 'Sinécdoque'],
                correct: 1
            }, {
                question: '¿Qué estrofa de cinco versos combina heptasílabos y endecasílabos con rima 7a-11b-7a-7c-11b?',
                options: ['Lira', 'Quintilla', 'Sevillana', 'Terceto'],
                correct: 0
            }];

            let currentQuiz = 0;
            let quizFeedback = '';
            let quizAnswered = false;

            function renderQuiz() {
                const container = document.getElementById('quizContent');
                const q = quizQuestions[currentQuiz];

                let html = `
                    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:0.3rem;margin-bottom:0.4rem;">
                        <span style="font-family:var(--font-hand);font-size:0.7rem;color:var(--ink-gray);">pregunta ${currentQuiz+1} de ${quizQuestions.length}</span>
                        <span style="font-family:var(--font-sans);font-size:0.6rem;color:var(--ink-gray);">aciertos: ${getQuizScore()}</span>
                    </div>
                    <div class="quiz-question">${q.question}</div>
                    <div class="quiz-options">
                `;

                q.options.forEach((opt, idx) => {
                    const checked = quizAnswered && idx === q.correct ? 'checked' : '';
                    html += `
                        <label>
                            <input type="radio" name="quizOption" value="${idx}" ${checked} ${quizAnswered ? 'disabled' : ''} />
                            ${opt}
                        </label>
                    `;
                });

                html += `
                    </div>
                    <div class="quiz-actions">
                        <button class="btn-quiz" id="quizPrevBtn">◀ anterior</button>
                        <button class="btn-quiz" id="quizNextBtn">siguiente ▶</button>
                        <button class="btn-quiz primary" id="quizCheckBtn">${quizAnswered ? 'respondida' : 'responder'}</button>
                    </div>
                    <div class="quiz-result" id="quizFeedback">${quizFeedback || 'Selecciona una opción y presiona "responder".'}</div>
                `;

                container.innerHTML = html;

                document.getElementById('quizPrevBtn').addEventListener('click', function() {
                    if (currentQuiz > 0) { currentQuiz--;
                        quizFeedback = '';
                        quizAnswered = false;
                        renderQuiz(); }
                });
                document.getElementById('quizNextBtn').addEventListener('click', function() {
                    if (currentQuiz < quizQuestions.length - 1) { currentQuiz++;
                        quizFeedback = '';
                        quizAnswered = false;
                        renderQuiz(); }
                });

                document.getElementById('quizCheckBtn').addEventListener('click', function() {
                    const selected = document.querySelector('input[name="quizOption"]:checked');
                    if (!selected) {
                        quizFeedback = '✧ Selecciona una opción.';
                        renderQuiz();
                        return;
                    }
                    const value = parseInt(selected.value);
                    const isCorrect = value === q.correct;
                    quizAnswered = true;

                    if (isCorrect) {
                        quizFeedback =
                            `<span class="correct">✓ Correcto. ¡Bien hecho!</span> ${q.options[q.correct]}`;
                        const score = JSON.parse(localStorage.getItem('quiz_score_poetico') || '[]');
                        score.push({ q: currentQuiz, correct: true });
                        localStorage.setItem('quiz_score_poetico', JSON.stringify(score));
                    } else {
                        quizFeedback =
                            `<span class="incorrect">✗ Incorrecto.</span> La respuesta correcta es: ${q.options[q.correct]}`;
                        const score = JSON.parse(localStorage.getItem('quiz_score_poetico') || '[]');
                        score.push({ q: currentQuiz, correct: false });
                        localStorage.setItem('quiz_score_poetico', JSON.stringify(score));
                    }
                    renderQuiz();
                });

                const score = JSON.parse(localStorage.getItem('quiz_score_poetico') || '[]');
                const existing = score.find(s => s.q === currentQuiz);
                if (existing && existing.correct !== undefined) {
                    quizAnswered = true;
                    if (existing.correct) {
                        quizFeedback = `<span class="correct">✓ Ya acertaste esta pregunta.</span>`;
                    } else {
                        quizFeedback =
                            `<span class="incorrect">✗ Fallaste esta pregunta. Inténtalo de nuevo.</span>`;
                        quizAnswered = false;
                        const radio = document.querySelector('input[name="quizOption"]');
                        if (radio) radio.disabled = false;
                    }
                    renderQuiz();
                }
            }

            function getQuizScore() {
                const score = JSON.parse(localStorage.getItem('quiz_score_poetico') || '[]');
                return score.filter(s => s.correct).length;
            }

            // ============================================================
            //  8. TABS
            // ============================================================

            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    const target = this.dataset.tab;
                    document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
                    document.getElementById(target).classList.add('active');

                    if (target === 'tab-ejercicios') renderExercise();
                    if (target === 'tab-quiz') renderQuiz();
                });
            });

            // ============================================================
            //  9. RESET
            // ============================================================

            document.getElementById('resetAllBtn').addEventListener('click', function() {
                if (confirm('¿Limpiar todas las entradas del cuaderno?')) {
                    appState = { entries: {} };
                    CATEGORIES.forEach(cat => {
                        cat.techniques.forEach(t => {
                            appState.entries[t.id] = { text: '', written: false, style: 'normal' };
                        });
                    });
                    saveState();
                    localStorage.removeItem('quiz_score_poetico');
                    renderAll();
                    renderExercise();
                    renderQuiz();
                    stopSpeaking();
                }
            });

            // ============================================================
            //  10. INICIO
            // ============================================================

            renderAll();
            renderExercise();
            renderQuiz();

            console.log('🎵 LIRA cargada. 100 técnicas poéticas.');
            const totalW = Object.values(appState.entries).filter(e => e.written).length;
            console.log(`📊 ${totalW}/100 versos escritos.`);

        })();
    </script>

</body>
</html>
