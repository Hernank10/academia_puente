<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>📜 PHILOSOPHIA · 100 autores · 100 técnicas filosóficas</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Uncial+Antiqua&family=EB+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Cinzel:wght@400;600;700&family=Great+Vibes&family=Alex+Brush&family=Cedarville+Cursive&family=Dancing+Script:wght@400..700&display=swap" rel="stylesheet" />

    <style>
        /* ============================================================
           BASE · INTERACTIVO Y DINÁMICO
           ============================================================ */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --pergamino: #f2e6d0;
            --pergamino-dark: #dcc9ae;
            --pergamino-light: #faf3e6;
            --tinta: #2c1810;
            --tinta-clara: #5a3d2e;
            --tinta-gris: #8a7a6a;
            --oro: #c9a84c;
            --oro-light: #e8d5a3;
            --oro-dark: #a8892b;
            --rubi: #8b1a2b;
            --rubi-light: #b84a5a;
            --borde-deco: #b8956a;
            --sombra: rgba(44, 24, 16, 0.2);
            --font-uncial: 'Uncial Antiqua', 'MedievalSharp', cursive;
            --font-serif: 'EB Garamond', 'Times New Roman', serif;
            --font-cinzel: 'Cinzel', serif;
            --font-spencerian: 'Great Vibes', cursive;
            --font-copperplate: 'Alex Brush', cursive;
            --font-chancery: 'Cedarville Cursive', cursive;
            --font-palmer: 'Dancing Script', cursive;
        }

        body {
            font-family: var(--font-serif);
            background: #d6c8b2;
            background-image:
                radial-gradient(ellipse at 20% 30%, #e8dccc 0%, transparent 60%),
                radial-gradient(ellipse at 80% 70%, #dacdbd 0%, transparent 50%);
            min-height: 100vh;
            padding: 1rem;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            color: var(--tinta);
        }

        .codex {
            max-width: 1350px;
            width: 100%;
            background: var(--pergamino-light);
            background-image:
                linear-gradient(0deg, rgba(212, 185, 150, 0.12) 0%, transparent 15%, transparent 85%, rgba(212, 185, 150, 0.08) 100%),
                repeating-linear-gradient(0deg, transparent, transparent 29px, rgba(160, 130, 100, 0.04) 29px, rgba(160, 130, 100, 0.04) 30px);
            border-radius: 18px;
            box-shadow:
                0 8px 60px rgba(44, 24, 16, 0.25),
                inset 0 0 80px rgba(200, 170, 130, 0.10),
                0 0 0 1px var(--oro-dark),
                0 0 0 3px var(--pergamino-dark),
                0 0 0 5px var(--oro);
            padding: 2rem 2rem 1.5rem;
            position: relative;
        }

        .codex::before {
            content: '';
            position: absolute;
            inset: 8px;
            border: 1px solid rgba(201, 168, 76, 0.12);
            border-radius: 14px;
            pointer-events: none;
        }

        .codex::after {
            content: '✦ ✦ ✦';
            position: absolute;
            bottom: -14px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--oro);
            font-size: 0.9rem;
            letter-spacing: 12px;
            background: var(--pergamino-light);
            padding: 0 1.8rem;
            font-family: var(--font-uncial);
            text-shadow: 0 0 8px rgba(201, 168, 76, 0.08);
        }

        /* ============================================================
           ENCABEZADO
           ============================================================ */

        .app-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem 1.5rem;
            margin-bottom: 1.2rem;
            padding-bottom: 0.8rem;
            border-bottom: 2px solid var(--oro-light);
            position: relative;
        }

        .app-header h1 {
            font-family: var(--font-uncial);
            font-weight: 700;
            font-size: 2.4rem;
            color: var(--rubi);
            text-shadow: 0 1px 4px rgba(139, 26, 43, 0.06);
            letter-spacing: 0.04em;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .app-header h1 small {
            font-family: var(--font-serif);
            font-size: 0.7rem;
            font-weight: 400;
            color: var(--tinta-clara);
            opacity: 0.4;
            letter-spacing: 0.06em;
            line-height: 1.2;
            max-width: 200px;
        }

        .app-header .header-actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .btn-pergamino {
            font-family: var(--font-uncial);
            font-size: 0.7rem;
            padding: 0.35rem 1.4rem;
            border-radius: 40px;
            border: 1px solid var(--oro-light);
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(4px);
            color: var(--tinta-clara);
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 0.04em;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        .btn-pergamino:hover {
            background: rgba(201, 168, 76, 0.08);
            border-color: var(--oro);
            color: var(--rubi);
            box-shadow: 0 0 30px rgba(201, 168, 76, 0.04);
        }

        .btn-pergamino.primary {
            background: rgba(139, 26, 43, 0.04);
            border-color: var(--rubi-light);
            color: var(--rubi);
        }

        .btn-pergamino.primary:hover {
            background: rgba(139, 26, 43, 0.08);
            border-color: var(--rubi);
        }

        /* ============================================================
           PESTAÑAS
           ============================================================ */

        .tab-bar {
            display: flex;
            gap: 0.1rem;
            border-bottom: 2px solid var(--oro-light);
            margin-bottom: 1.5rem;
            padding-bottom: 0.1rem;
            flex-wrap: wrap;
        }

        .tab-btn {
            font-family: var(--font-uncial);
            font-size: 0.85rem;
            padding: 0.4rem 1.8rem 0.35rem;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            color: var(--tinta-gris);
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 0.04em;
        }

        .tab-btn:hover {
            color: var(--tinta-clara);
            background: rgba(201, 168, 76, 0.02);
        }

        .tab-btn.active {
            color: var(--rubi);
            border-bottom-color: var(--oro);
            background: rgba(201, 168, 76, 0.03);
        }

        .tab-btn .badge-progress {
            display: inline-block;
            font-family: var(--font-serif);
            font-size: 0.55rem;
            background: var(--oro-light);
            color: var(--tinta);
            border-radius: 30px;
            padding: 0.02rem 0.6rem;
            margin-left: 0.2rem;
            font-weight: 600;
            vertical-align: middle;
            line-height: 1.4;
        }

        .tab-pane {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .tab-pane.active {
            display: block;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(8px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============================================================
           PROGRESO
           ============================================================ */

        .progress-summary {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.5rem 1.2rem;
            background: rgba(201, 168, 76, 0.04);
            border-radius: 12px;
            border: 1px solid rgba(201, 168, 76, 0.06);
            margin-bottom: 1.2rem;
            flex-wrap: wrap;
            backdrop-filter: blur(2px);
        }

        .progress-summary .progress-bar-bg {
            flex: 1;
            min-width: 100px;
            height: 8px;
            background: rgba(184, 149, 106, 0.10);
            border-radius: 30px;
            overflow: hidden;
            border: 1px solid rgba(201, 168, 76, 0.06);
        }

        .progress-summary .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--oro-light), var(--oro), var(--oro-dark));
            border-radius: 30px;
            transition: width 0.6s ease;
        }

        .progress-summary .progress-text {
            font-family: var(--font-uncial);
            font-size: 0.8rem;
            color: var(--tinta-clara);
            white-space: nowrap;
        }

        .progress-summary .progress-text strong {
            color: var(--rubi);
            font-family: var(--font-serif);
        }

        /* ============================================================
           BÚSQUEDA Y FILTROS
           ============================================================ */

        .search-box {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .search-box input {
            flex: 1;
            min-width: 200px;
            padding: 0.4rem 1rem;
            border: 1px solid var(--oro-light);
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(4px);
            font-family: var(--font-serif);
            font-size: 0.85rem;
            color: var(--tinta);
            transition: border-color 0.3s;
            outline: none;
        }

        .search-box input:focus {
            border-color: var(--oro);
            box-shadow: 0 0 0 3px rgba(201, 168, 76, 0.05);
        }

        .search-box input::placeholder {
            color: var(--tinta-gris);
            opacity: 0.4;
            font-style: italic;
        }

        .search-box .btn-filter {
            font-family: var(--font-uncial);
            font-size: 0.6rem;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            border: 1px solid var(--oro-light);
            background: rgba(255, 255, 255, 0.10);
            color: var(--tinta-clara);
            cursor: pointer;
            transition: all 0.3s;
        }

        .search-box .btn-filter:hover {
            background: rgba(201, 168, 76, 0.05);
            border-color: var(--oro);
        }

        .search-box .btn-filter.active {
            background: rgba(201, 168, 76, 0.08);
            border-color: var(--oro);
            color: var(--rubi);
        }

        /* ============================================================
           ACORDEÓN DE AUTORES/TÉCNICAS
           ============================================================ */

        .category-accordion {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            max-height: 580px;
            overflow-y: auto;
            padding-right: 0.3rem;
        }

        .category-accordion::-webkit-scrollbar {
            width: 6px;
        }
        .category-accordion::-webkit-scrollbar-track {
            background: var(--pergamino);
            border-radius: 30px;
        }
        .category-accordion::-webkit-scrollbar-thumb {
            background: var(--oro);
            border-radius: 30px;
        }

        .category-item {
            border: 1px solid rgba(184, 149, 106, 0.12);
            border-radius: 12px;
            background: rgba(252, 246, 235, 0.15);
            overflow: hidden;
            transition: all 0.25s;
            backdrop-filter: blur(2px);
        }

        .category-item:hover {
            border-color: rgba(201, 168, 76, 0.18);
            box-shadow: 0 2px 20px rgba(201, 168, 76, 0.02);
        }

        .category-header {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.6rem 1rem;
            cursor: pointer;
            background: rgba(252, 246, 235, 0.10);
            transition: background 0.2s;
            user-select: none;
            flex-wrap: wrap;
        }

        .category-header:hover {
            background: rgba(201, 168, 76, 0.03);
        }

        .category-header .cat-icon {
            font-size: 1.3rem;
            color: var(--oro);
            width: 2.2rem;
            text-align: center;
        }

        .category-header .cat-title {
            font-family: var(--font-uncial);
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--tinta);
            flex: 1;
            letter-spacing: 0.02em;
        }

        .category-header .cat-count {
            font-size: 0.65rem;
            color: var(--tinta-gris);
            background: rgba(201, 168, 76, 0.03);
            padding: 0.02rem 0.7rem;
            border-radius: 30px;
            font-family: var(--font-serif);
            font-weight: 600;
        }

        .category-header .cat-arrow {
            color: var(--oro-dark);
            font-size: 0.7rem;
            transition: transform 0.3s;
            margin-left: 0.1rem;
        }

        .category-header .cat-arrow.open {
            transform: rotate(180deg);
        }

        .category-body {
            padding: 0 1rem 1rem;
            display: none;
            border-top: 1px solid rgba(184, 149, 106, 0.05);
            padding-top: 0.6rem;
        }

        .category-body.open {
            display: block;
        }

        /* ============================================================
           TARJETA DE AUTOR/TÉCNICA (INTERACTIVA)
           ============================================================ */

        .tech-card {
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
            padding: 0.6rem 0.8rem;
            margin-bottom: 0.3rem;
            border-radius: 10px;
            border-left: 4px solid var(--oro-light);
            background: rgba(252, 246, 235, 0.10);
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
        }

        .tech-card:hover {
            background: rgba(252, 246, 235, 0.30);
            border-left-color: var(--oro);
            transform: translateX(4px);
            box-shadow: 0 2px 16px rgba(201, 168, 76, 0.04);
        }

        .tech-card .tech-head {
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .tech-card .tech-num {
            font-family: var(--font-uncial);
            font-size: 0.6rem;
            color: var(--oro-dark);
            min-width: 2.4rem;
            font-weight: 600;
            opacity: 0.4;
        }

        .tech-card .tech-author {
            font-size: 0.7rem;
            color: var(--rubi);
            font-weight: 600;
            font-family: var(--font-cinzel);
            background: rgba(139, 26, 43, 0.04);
            padding: 0.02rem 0.6rem;
            border-radius: 30px;
            border: 1px solid rgba(139, 26, 43, 0.04);
        }

        .tech-card .tech-name {
            font-weight: 700;
            font-size: 1rem;
            color: var(--tinta);
            font-family: var(--font-serif);
        }

        .tech-card .tech-rhetoric {
            font-size: 0.55rem;
            background: rgba(201, 168, 76, 0.05);
            padding: 0.02rem 0.6rem;
            border-radius: 30px;
            color: var(--tinta-clara);
            font-style: italic;
            border: 1px solid rgba(201, 168, 76, 0.04);
        }

        .tech-card .tech-def {
            font-size: 0.8rem;
            color: var(--tinta-clara);
            line-height: 1.6;
            margin: 0.05rem 0 0.05rem;
            padding-left: 0.1rem;
        }

        .tech-card .tech-example-box {
            font-size: 0.75rem;
            color: var(--tinta-clara);
            font-style: italic;
            background: rgba(201, 168, 76, 0.02);
            padding: 0.2rem 0.7rem;
            border-radius: 8px;
            border-left: 3px solid var(--oro-light);
            margin: 0.05rem 0 0.1rem;
            line-height: 1.7;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.4rem;
        }

        .tech-card .tech-example-box .example-text {
            flex: 1;
            min-width: 140px;
        }

        .tech-card .tech-example-box .btn-speech {
            font-family: var(--font-uncial);
            font-size: 0.5rem;
            padding: 0.05rem 0.6rem;
            border-radius: 30px;
            border: 1px solid rgba(201, 168, 76, 0.10);
            background: transparent;
            color: var(--tinta-gris);
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.1rem;
            white-space: nowrap;
        }

        .tech-card .tech-example-box .btn-speech:hover {
            background: rgba(201, 168, 76, 0.04);
            border-color: var(--oro);
            color: var(--rubi);
        }

        .tech-card .tech-example-box .btn-speech.speaking {
            color: var(--rubi);
            border-color: var(--rubi-light);
            background: rgba(139, 26, 43, 0.03);
        }

        /* Área de práctica */
        .tech-card .tech-practice-area {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 0.4rem 0.8rem;
            margin-top: 0.1rem;
            padding-top: 0.3rem;
            border-top: 1px dashed rgba(184, 149, 106, 0.10);
        }

        .tech-card .tech-practice-area .practice-input-group {
            flex: 1;
            min-width: 180px;
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
        }

        .tech-card .tech-practice-area .practice-input-group textarea {
            width: 100%;
            background: rgba(252, 246, 235, 0.15);
            border: 1px solid rgba(184, 149, 106, 0.08);
            border-radius: 8px;
            padding: 0.25rem 0.6rem;
            font-family: var(--font-serif);
            font-size: 0.75rem;
            color: var(--tinta);
            resize: vertical;
            min-height: 36px;
            transition: border-color 0.3s;
            backdrop-filter: blur(2px);
        }

        .tech-card .tech-practice-area .practice-input-group textarea:focus {
            border-color: var(--oro);
            outline: none;
            box-shadow: 0 0 0 3px rgba(201, 168, 76, 0.03);
        }

        .tech-card .tech-practice-area .practice-input-group .practice-preview {
            font-size: 0.85rem;
            padding: 0.1rem 0.3rem;
            min-height: 1.6rem;
            color: var(--tinta-clara);
            border-bottom: 1px solid rgba(184, 149, 106, 0.05);
            line-height: 1.7;
            word-break: break-word;
            transition: all 0.15s;
            font-style: italic;
            opacity: 0.5;
        }

        .tech-card .tech-practice-area .practice-input-group .practice-preview:empty::before {
            content: 'tu frase filosófica aparecerá aquí...';
            color: var(--tinta-gris);
            opacity: 0.2;
            font-size: 0.65rem;
            font-style: italic;
        }

        .preview-spencerian {
            font-family: var(--font-spencerian);
            font-style: normal;
            opacity: 1;
        }
        .preview-copperplate {
            font-family: var(--font-copperplate);
            font-style: normal;
            opacity: 1;
        }
        .preview-chancery {
            font-family: var(--font-chancery);
            font-style: normal;
            opacity: 1;
        }
        .preview-palmer {
            font-family: var(--font-palmer);
            font-style: normal;
            opacity: 1;
        }
        .preview-normal {
            font-family: var(--font-serif);
            font-style: italic;
            opacity: 0.5;
        }

        .tech-card .tech-practice-area .tech-actions {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            flex-wrap: wrap;
            padding-top: 0.1rem;
        }

        .tech-card .tech-practice-area .tech-actions .btn-speech-small {
            font-family: var(--font-uncial);
            font-size: 0.45rem;
            padding: 0.04rem 0.5rem;
            border-radius: 30px;
            border: 1px solid rgba(184, 149, 106, 0.06);
            background: transparent;
            color: var(--tinta-gris);
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.05rem;
        }

        .tech-card .tech-practice-area .tech-actions .btn-speech-small:hover {
            background: rgba(201, 168, 76, 0.03);
            border-color: var(--oro);
            color: var(--rubi);
        }

        .tech-card .tech-practice-area .tech-actions .btn-speech-small.speaking {
            color: var(--rubi);
            border-color: var(--rubi-light);
        }

        .tech-card .tech-practice-area .tech-actions label {
            display: flex;
            align-items: center;
            gap: 0.15rem;
            font-size: 0.55rem;
            color: var(--tinta-gris);
            cursor: pointer;
            font-family: var(--font-serif);
        }

        .tech-card .tech-practice-area .tech-actions input[type="checkbox"] {
            appearance: none;
            width: 1rem;
            height: 1rem;
            border: 2px solid var(--oro-dark);
            border-radius: 4px;
            cursor: pointer;
            background: var(--pergamino-light);
            transition: all 0.15s;
            position: relative;
            flex-shrink: 0;
        }

        .tech-card .tech-practice-area .tech-actions input[type="checkbox"]:checked {
            background: var(--oro);
            border-color: var(--oro);
        }

        .tech-card .tech-practice-area .tech-actions input[type="checkbox"]:checked::after {
            content: '✓';
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--pergamino-light);
            font-size: 0.65rem;
            font-weight: 700;
        }

        .tech-card .tech-practice-area .tech-actions .wax-seal {
            display: inline-flex;
            align-items: center;
            gap: 0.1rem;
            font-size: 0.5rem;
            color: var(--rubi);
            font-weight: 600;
            font-family: var(--font-uncial);
            letter-spacing: 0.04em;
            opacity: 0.2;
            transition: opacity 0.3s;
        }

        .tech-card .tech-practice-area .tech-actions .wax-seal.active {
            opacity: 1;
        }

        .tech-card .tech-practice-area .tech-actions .wax-seal .seal-icon {
            font-size: 0.9rem;
            filter: drop-shadow(0 1px 4px rgba(139, 26, 43, 0.06));
        }

        /* Estilos de caligrafía */
        .style-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 0.1rem;
            margin: 0.15rem 0 0.05rem;
            padding: 0.1rem 0.3rem;
            background: rgba(252, 246, 235, 0.10);
            border-radius: 40px;
            border: 1px solid rgba(184, 149, 106, 0.03);
        }

        .style-pill {
            font-family: var(--font-uncial);
            font-size: 0.4rem;
            padding: 0.04rem 0.5rem;
            border-radius: 30px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--tinta-gris);
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 400;
            letter-spacing: 0.02em;
        }

        .style-pill:hover {
            background: rgba(201, 168, 76, 0.02);
            border-color: rgba(201, 168, 76, 0.05);
            color: var(--tinta-clara);
        }

        .style-pill.active {
            background: rgba(201, 168, 76, 0.05);
            border-color: var(--oro);
            color: var(--rubi);
        }

    <!-- ============================================================
    CODEX PHILOSOPHIA
    ============================================================ -->
    <div class="codex" id="app">

        <!-- Encabezado -->
        <header class="app-header">
            <h1>

    <script>
        (function() {
            'use strict';

            // ============================================================

            // ============================================================

            const AUTHORS = [{

                        def: 'Contemplar las ideas eternas es el camino del filósofo que busca la verdad más allá del mundo sensible.',

            // ============================================================
            //  2. ESTADO
            // ============================================================

            const STORAGE_KEY = 'philosophia_universal_100';

            function loadState() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) return JSON.parse(raw);
                } catch (_) { /* ignore */ }
                return { entries: {} };
            }

            function saveState() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
                } catch (_) { /* ignore */ }
            }

            let appState = loadState();

            // Inicializar técnicas
            AUTHORS.forEach(cat => {
                cat.techniques.forEach(t => {
                    if (!appState.entries[t.id]) {
                        appState.entries[t.id] = { text: '', written: false, style: 'normal' };
                    }
                });
            });
            saveState();

            // ============================================================
            //  3. VOZ (Web Speech API)
            // ============================================================

            let speechSynth = window.speechSynthesis;
            let isSpeaking = false;
            let speakingId = null;
            const floatStopBtn = document.getElementById('floatStopBtn');

            function speakText(text, id, onStart, onEnd) {
                if (isSpeaking) {
                    speechSynth.cancel();
                    isSpeaking = false;
                    floatStopBtn.classList.remove('visible');
                    if (onEnd) onEnd();
                    setTimeout(() => speakText(text, id, onStart, onEnd), 100);
                    return;
                }

                const utterance = new SpeechSynthesisUtterance(text);
                const voices = speechSynth.getVoices();
                const esVoice = voices.find(v => v.lang.startsWith('es')) || voices[0];
                if (esVoice) utterance.voice = esVoice;
                utterance.lang = 'es-ES';
                utterance.rate = 0.85;
                utterance.pitch = 1;

                utterance.onstart = function() {
                    isSpeaking = true;
                    speakingId = id;
                    floatStopBtn.classList.add('visible');
                    if (onStart) onStart();
                    document.querySelectorAll(`.btn-speech[data-id="${id}"]`).forEach(b => b.classList.add('speaking'));
                    document.querySelectorAll(`.btn-speech-small[data-id="${id}"]`).forEach(b => b.classList.add(
                    'speaking'));
                };

                utterance.onend = function() {
                    isSpeaking = false;
                    speakingId = null;
                    floatStopBtn.classList.remove('visible');
                    if (onEnd) onEnd();
                    document.querySelectorAll('.btn-speech.speaking').forEach(b => b.classList.remove('speaking'));
                    document.querySelectorAll('.btn-speech-small.speaking').forEach(b => b.classList.remove('speaking'));
                };

                utterance.onerror = function() {
                    isSpeaking = false;
                    speakingId = null;
                    floatStopBtn.classList.remove('visible');
                    if (onEnd) onEnd();
                    document.querySelectorAll('.btn-speech.speaking').forEach(b => b.classList.remove('speaking'));
                    document.querySelectorAll('.btn-speech-small.speaking').forEach(b => b.classList.remove('speaking'));
                };

                speechSynth.speak(utterance);
            }

            function stopSpeaking() {
                if (isSpeaking) {
                    speechSynth.cancel();
                    isSpeaking = false;
                    speakingId = null;
                    floatStopBtn.classList.remove('visible');
                    document.querySelectorAll('.btn-speech.speaking').forEach(b => b.classList.remove('speaking'));
                    document.querySelectorAll('.btn-speech-small.speaking').forEach(b => b.classList.remove('speaking'));
                }
            }

            floatStopBtn.addEventListener('click', stopSpeaking);

            // ============================================================
            //  4. RENDER con búsqueda y filtros

            const accordionContainer = document.getElementById('accordionContainer');

            let filterMode = 'all';

                let totalTechniques = 0;

                AUTHORS.forEach((cat, idx) => {
                    let catWritten = 0;
                    let catFiltered = cat.techniques.filter(t => {
                        const e = appState.entries[t.id] || { text: '', written: false };

                        const matchSearch = searchTerm === '' ||
                            t.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                            t.def.toLowerCase().includes(searchTerm.toLowerCase()) ||
                            t.example.toLowerCase().includes(searchTerm.toLowerCase()) ||
                            t.author.toLowerCase().includes(searchTerm.toLowerCase()) ||
                            t.rhetoric.toLowerCase().includes(searchTerm.toLowerCase()) ||
                            t.noun.toLowerCase().includes(searchTerm.toLowerCase()) ||
                            t.adj.toLowerCase().includes(searchTerm.toLowerCase()) ||
                            t.verb.toLowerCase().includes(searchTerm.toLowerCase());
                        if (filterMode === 'written') return matchSearch && e.written;
                        if (filterMode === 'pending') return matchSearch && !e.written;
                        return matchSearch;
                    });

                    if (catFiltered.length === 0) return;

                    const isOpen = idx === 0 ? 'open' : '';
                    const arrowClass = isOpen ? 'open' : '';

                    html += `
                        <div class="category-item" data-cat="${cat.id}">

                        html += `

                                </div>

                                <div class="tech-practice-area">
                                    <div class="practice-input-group">
                                        <textarea class="practice-text" data-id="${t.id}" placeholder="escribe tu frase filosófica...">${userText}</textarea>

                                    <div class="tech-actions">

                                            <input type="checkbox" class="written-check" data-id="${t.id}" ${isWritten ? 'checked' : ''} />

                                        </label>
                                        <span class="wax-seal ${isWritten ? 'active' : ''}">

                                    </div>
                                </div>

                                    <button class="style-pill ${style === 'copperplate' ? 'active' : ''}" data-style="copperplate" data-target="${t.id}">Copperplate <span class="pill-preview" style="font-family:'Alex Brush',cursive;">Aa</span></button>
                                    <button class="style-pill ${style === 'chancery' ? 'active' : ''}" data-style="chancery" data-target="${t.id}">Chancery <span class="pill-preview" style="font-family:'Cedarville Cursive',cursive;">Aa</span></button>
                                    <button class="style-pill ${style === 'palmer' ? 'active' : ''}" data-style="palmer" data-target="${t.id}">Palmer <span class="pill-preview" style="font-family:'Dancing Script',cursive;">Aa</span></button>
                                </div>
                            </div>
                        `;
                    });

                    html += `</div></div>`;
                });

                accordionContainer.innerHTML = html;

                // Actualizar contadores
                document.getElementById('progressNum').textContent = totalWritten;
                document.getElementById('progressBadge').textContent = `${totalWritten}/100`;
                const pct = totalTechniques > 0 ? (totalWritten / totalTechniques) * 100 : 0;
                document.getElementById('progressFill').style.width = `${pct}%`;
                document.getElementById('sealDisplay').textContent = totalWritten === totalTechniques ? '🟢' :
                    totalWritten > 0 ? '🟡' : '⚪';

                // === EVENTOS ===

                // Acordeón
                document.querySelectorAll('.category-header').forEach(header => {
                    header.addEventListener('click', function() {
                        const target = this.dataset.target;
                        const body = document.getElementById(`body-${target}`);
                        const arrow = this.querySelector('.cat-arrow');
                        if (body) {
                            body.classList.toggle('open');
                            if (arrow) arrow.classList.toggle('open');
                        }
                    });
                });

                // Click en tarjeta → abrir modal
                document.querySelectorAll('.tech-card').forEach(card => {
                    card.addEventListener('click', function(e) {
                        if (e.target.closest('button') || e.target.closest('input') || e.target.closest(
                                'label') || e.target.closest('.style-pill') || e.target.closest(
                                '.style-pills')) return;
                        const id = parseInt(this.dataset.techId);
                        openModal(id);
                    });
                });

                // Práctica (textarea)
                document.querySelectorAll('.practice-text').forEach(ta => {
                    ta.addEventListener('input', function() {
                        const id = parseInt(this.dataset.id);
                        const val = this.value;
                        if (!appState.entries[id]) appState.entries[id] = { text: '', written: false,
                            style: 'normal' };
                        appState.entries[id].text = val;
                        saveState();
                        const preview = document.querySelector(`.practice-preview[data-id="${id}"]`);
                        if (preview) {
                            preview.textContent = val || '';
                            const style = appState.entries[id].style || 'normal';
                            preview.className = `practice-preview ${getStyleClassFor(style)}`;
                        }
                        const btn = document.querySelector(`.btn-speech-small[data-id="${id}"]`);
                        if (btn) btn.dataset.text = val || '';

                });

                // Checkbox "escrito"
                document.querySelectorAll('.written-check').forEach(cb => {
                    cb.addEventListener('change', function() {
                        const id = parseInt(this.dataset.id);
                        const checked = this.checked;
                        if (!appState.entries[id]) appState.entries[id] = { text: '', written: false,
                            style: 'normal' };
                        appState.entries[id].written = checked;
                        saveState();
                        renderAll();
                        renderExercise();
                        renderQuiz();

                        speakText(text, id);

                            preview.className = `practice-preview ${getStyleClassFor(style)}`;

                        if (modalOpen && modalId === targetId) {
                            updateModalContent(targetId);
                        }
                    });
                });

                saveState();
            }

            //  5. FUNCIONES DE ESTILO
            // ============================================================

                        return 'preview-spencerian';
                    case 'copperplate':
                        return 'preview-copperplate';
                    case 'chancery':
                        return 'preview-chancery';
                    case 'palmer':
                        return 'preview-palmer';
                    default:
                        return 'preview-normal';

            //  6. MODAL INTERACTIVO

                `;

                // Eventos del modal
                const modalTextarea = document.getElementById('modalPracticeText');
                const modalPreview = document.getElementById('modalPreview');

                modalTextarea.addEventListener('input', function() {
                    const val = this.value;
                    const id = parseInt(this.dataset.id);
                    if (!appState.entries[id]) appState.entries[id] = { text: '', written: false,
                        style: 'normal' };
                    appState.entries[id].text = val;
                    saveState();
                    if (modalPreview) {
                        modalPreview.textContent = val || '';
                        const style = appState.entries[id].style || 'normal';
                        modalPreview.className = `modal-preview ${getStyleClassFor(style)}`;
                    }
                    const cardPreview = document.querySelector(`.practice-preview[data-id="${id}"]`);
                    if (cardPreview) {
                        cardPreview.textContent = val || '';
                        const style = appState.entries[id].style || 'normal';
                        cardPreview.className = `practice-preview ${getStyleClassFor(style)}`;
                    }
                    const speakBtn = document.getElementById('modalSpeakBtn');
                    if (speakBtn) speakBtn.dataset.text = val || '';
                });

                modalBody.querySelectorAll('.modal-style-pills .style-pill').forEach(pill => {
                    pill.addEventListener('click', function() {
                        const targetId = parseInt(this.dataset.target);
                        const style = this.dataset.style;
                        if (!appState.entries[targetId]) appState.entries[targetId] = { text: '',
                            written: false, style: 'normal' };
                        appState.entries[targetId].style = style;
                        saveState();
                        if (modalPreview) {
                            modalPreview.className = `modal-preview ${getStyleClassFor(style)}`;
                        }
                        const cardPreview = document.querySelector(`.practice-preview[data-id="${targetId}"]`);
                        if (cardPreview) {
                            cardPreview.className = `practice-preview ${getStyleClassFor(style)}`;
                        }
                        const parent = this.closest('.modal-style-pills');
                        parent.querySelectorAll('.style-pill').forEach(p => p.classList.remove('active'));
                        this.classList.add('active');
                        const cardPills = document.querySelector(`.style-pills[data-target="${targetId}"]`);
                        if (cardPills) {
                            cardPills.querySelectorAll('.style-pill').forEach(p => p.classList.remove('active'));
                            cardPills.querySelectorAll('.style-pill').forEach(p => {
                                if (p.dataset.style === style) p.classList.add('active');
                            });
                        }
                    });
                });

                document.getElementById('modalSpeakBtn').addEventListener('click', function() {
                    const id = parseInt(this.dataset.id || modalId);
                    const text = modalTextarea.value.trim() || findTechnique(id).example;
                    if (text) speakText(text, id);
                });

                document.getElementById('modalSaveBtn').addEventListener('click', function() {
                    const id = parseInt(modalId);
                    const val = modalTextarea.value.trim();
                    if (!appState.entries[id]) appState.entries[id] = { text: '', written: false,
                        style: 'normal' };
                    appState.entries[id].text = val;
                    saveState();
                    const cardPreview = document.querySelector(`.practice-preview[data-id="${id}"]`);
                    if (cardPreview) {
                        cardPreview.textContent = val || '';
                        const style = appState.entries[id].style || 'normal';
                        cardPreview.className = `practice-preview ${getStyleClassFor(style)}`;
                    }
                    const cardSpeakBtn = document.querySelector(`.btn-speech-small[data-id="${id}"]`);
                    if (cardSpeakBtn) cardSpeakBtn.dataset.text = val || '';
                    const btn = this;
                    const origText = btn.innerHTML;
                    btn.innerHTML = '✓ guardado';
                    btn.style.background = 'rgba(201,168,76,0.1)';
                    setTimeout(() => {
                        btn.innerHTML = origText;
                        btn.style.background = '';
                    }, 1200);
                });

                document.getElementById('modalWrittenCheck').addEventListener('change', function() {
                    const id = parseInt(modalId);
                    const checked = this.checked;
                    if (!appState.entries[id]) appState.entries[id] = { text: '', written: false,
                        style: 'normal' };
                    appState.entries[id].written = checked;
                    saveState();
                    const cardCheck = document.querySelector(`.written-check[data-id="${id}"]`);
                    if (cardCheck) cardCheck.checked = checked;
                    const seal = document.querySelector(`.wax-seal[data-tech-id="${id}"]`);
                    if (seal) {
                        const icon = seal.querySelector('.seal-icon');
                        if (icon) icon.textContent = checked ? '🔴' : '○';
                        seal.classList.toggle('active', checked);
                    }
                    modalBody.querySelectorAll('.wax-seal-modal').forEach(s => {
                        s.classList.toggle('active', checked);
                        const icon = s.querySelector('.seal-icon');
                        if (icon) icon.textContent = checked ? '🔴' : '○';
                        const label = s.textContent.trim();
                        if (label === 'sellada' || label === 'sin sello' || label === 'sellado' || label ===
                            'pendiente') {
                            s.innerHTML =
                                `<span class="seal-icon">${checked ? '🔴' : '○'}</span> ${checked ? 'sellada' : 'pendiente'}`;
                        }
                    });
                    renderAll();
                    renderExercise();
                    renderQuiz();
                });
            }

            function findTechnique(id) {
                for (const cat of AUTHORS) {
                    for (const t of cat.techniques) {
                        if (t.id === id) return t;
                    }
                }
                return null;
            }

            modalClose.addEventListener('click', function() {
                modalOverlay.classList.remove('open');
                document.body.style.overflow = '';
                modalOpen = false;
                modalId = null;
                stopSpeaking();
            });

            modalOverlay.addEventListener('click', function(e) {
                if (e.target === this) {
                    modalOverlay.classList.remove('open');
                    document.body.style.overflow = '';
                    modalOpen = false;
                    modalId = null;
                    stopSpeaking();
                }
            });

            // ============================================================
            //  7. EJERCICIOS INTERACTIVOS
            // ============================================================

            const exercises = [{
                id: 1,
                prompt: 'Escribe una frase filosófica usando el sustantivo "Idea", el adjetivo "Eterna" y el verbo "Contemplar" de Platón.',
                hint: 'Platón creía en las ideas eternas. Escribe sobre la contemplación de la verdad más allá de lo sensible.'
            }, {
                id: 2,
                prompt: 'Aplica el sustantivo "Duda", el adjetivo "Metódica" y el verbo "Practicar" de Descartes para explorar el camino hacia la certeza.',
                hint: 'Descartes usó la duda para encontrar una verdad indudable. Escribe sobre el proceso de la duda metódica.'
            }, {
                id: 3,
                prompt: 'Usa el sustantivo "Voluntad", el adjetivo "Ciega" y el verbo "Trascender" de Schopenhauer para reflexionar sobre el sufrimiento y la liberación.',
                hint: 'Schopenhauer veía la voluntad como la raíz del sufrimiento. Escribe sobre cómo trascenderla.'
            }, {
                id: 4,
                prompt: 'Escribe una frase con el sustantivo "Libertad", el adjetivo "Condenada" y el verbo "Elegir" de Sartre para describir la responsabilidad existencial.',
                hint: 'Sartre dijo que el hombre está condenado a ser libre. Escribe sobre la elección en la existencia.'
            }, {
                id: 5,
                prompt: 'Utiliza el sustantivo "Superhombre", el adjetivo "Trágico" y el verbo "Afirmar" de Nietzsche para explorar la voluntad de poder y la vida.',
                hint: 'Nietzsche propuso el superhombre como un ser que afirma la vida. Escribe sobre la afirmación trágica.'
            }];

            let currentExercise = 0;
            let exerciseFeedback = '';

            function renderExercise() {
                const container = document.getElementById('exerciseContent');
                const ex = exercises[currentExercise];
                const totalW = Object.values(appState.entries).filter(e => e.written).length;

                let html = `
                    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:0.3rem;margin-bottom:0.5rem;">
                        <span style="font-family:var(--font-uncial);font-size:0.7rem;color:var(--tinta-gris);">ejercicio ${currentExercise+1} de ${exercises.length}</span>
                        <span style="font-family:var(--font-serif);font-size:0.6rem;color:var(--tinta-gris);">frases escritas: ${totalW}/100</span>
                    </div>
                    <div class="exercise-prompt">${ex.prompt}</div>
                    <div style="font-size:0.7rem;color:var(--tinta-gris);opacity:0.4;margin-bottom:0.4rem;">💡 ${ex.hint}</div>
                    <textarea class="exercise-input" id="exerciseInput" placeholder="Escribe tu frase filosófica aquí..."></textarea>
                    <div class="exercise-actions">
                        <button class="btn-exercise" id="exercisePrevBtn">◀ anterior</button>
                        <button class="btn-exercise" id="exerciseNextBtn">siguiente ▶</button>
                        <button class="btn-exercise primary" id="exerciseCheckBtn">🔍 revisar</button>
                        <button class="btn-exercise" id="exerciseSaveBtn">💾 guardar</button>
                    </div>
                    <div class="exercise-feedback" id="exerciseFeedback">${exerciseFeedback || 'Escribe tu frase y presiona "revisar" para obtener retroalimentación.'}</div>
                `;

                container.innerHTML = html;

                document.getElementById('exercisePrevBtn').addEventListener('click', function() {
                    if (currentExercise > 0) { currentExercise--;
                        exerciseFeedback = '';
                        renderExercise(); }
                });
                document.getElementById('exerciseNextBtn').addEventListener('click', function() {
                    if (currentExercise < exercises.length - 1) { currentExercise++;
                        exerciseFeedback = '';
                        renderExercise(); }
                });

                document.getElementById('exerciseCheckBtn').addEventListener('click', function() {
                    const text = document.getElementById('exerciseInput').value.trim();
                    if (!text) {
                        exerciseFeedback = '✧ Escribe algo antes de revisar.';
                        renderExercise();
                        return;
                    }
                    const words = text.split(/\s+/);
                    const wordCount = words.length;
                    const hasNoun = /\b(idea|duda|voluntad|libertad|superhombre|sabiduría|verdad|realidad)\b/i
                        .test(text);
                    const hasAdj = /\b(eterna|metódica|ciega|condenada|trágica|práctica|lúcida|natural)\b/i
                        .test(text);
                    const hasVerb = /\b(contemplar|practicar|trascender|elegir|afirmar|conocer|buscar|analizar)\b/i
                        .test(text);
                    const isDescriptive = wordCount > 5;

                    let feedback = '✧ ';
                    if (!isDescriptive) feedback += 'Intenta extender tu descripción con más detalles. ';
                    else feedback += 'Bien, has escrito una descripción de extensión adecuada. ';

                    if (hasNoun) feedback += 'Excelente, has usado el sustantivo clave. ';
                    else feedback += 'Asegúrate de incluir el sustantivo solicitado. ';

                    if (hasAdj) feedback += 'Usas el adjetivo, bien. ';
                    else feedback += 'Incluye el adjetivo correspondiente. ';

                    if (hasVerb) feedback += 'Y el verbo, perfecto. ';
                    else feedback += 'Añade el verbo solicitado. ';

                    feedback += '✧';

                    const tempId = 999;
                    if (!appState.entries[tempId]) appState.entries[tempId] = { text: '', written: false,
                        style: 'normal' };
                    appState.entries[tempId].text = text;
                    saveState();

                    exerciseFeedback = feedback;
                    renderExercise();
                    document.getElementById('exerciseInput').value = text;
                });

                document.getElementById('exerciseSaveBtn').addEventListener('click', function() {
                    const text = document.getElementById('exerciseInput').value.trim();
                    if (!text) { exerciseFeedback = '✧ Escribe algo para guardar.';
                        renderExercise(); return; }
                    const tempId = 999;
                    if (!appState.entries[tempId]) appState.entries[tempId] = { text: '', written: false,
                        style: 'normal' };
                    appState.entries[tempId].text = text;
                    saveState();
                    exerciseFeedback = '✧ Frase guardada en tu cuaderno. ✧';
                    renderExercise();
                    document.getElementById('exerciseInput').value = text;
                });

                const saved = appState.entries[999];
                if (saved && saved.text) {
                    document.getElementById('exerciseInput').value = saved.text;
                }
            }

            // ============================================================
            //  8. QUIZ
            // ============================================================

            const quizQuestions = [{
                question: '¿Qué autor usó el sustantivo "Idea", el adjetivo "Eterna" y el verbo "Contemplar" para describir su filosofía?',
                options: ['Aristóteles', 'Platón', 'Sócrates', 'Epicuro'],
                correct: 1
            }, {
                question: '¿Qué triada filosófica (sustantivo, adjetivo, verbo) pertenece a Descartes?',
                options: ['Idea · Eterna · Contemplar', 'Duda · Metódica · Practicar', 'Voluntad · Ciega · Trascender',
                    'Libertad · Condenada · Elegir'
                ],
                correct: 1
            }, {
                question: '¿Qué autor de la filosofía moderna propuso el "Imperativo categórico" como deber moral?',
                options: ['Hume', 'Kant', 'Spinoza', 'Leibniz'],
                correct: 1
            }, {
                question: '¿Qué filósofo utilizó el sustantivo "Voluntad" con el adjetivo "Ciega" para describir el sufrimiento humano?',
                options: ['Hegel', 'Schopenhauer', 'Nietzsche', 'Kierkegaard'],
                correct: 1
            }, {
                question: '¿Qué autor es conocido por la triada "Superhombre · Trágico · Afirmar"?',
                options: ['Kierkegaard', 'Marx', 'Nietzsche', 'Hegel'],
                correct: 2
            }, {
                question: '¿Qué técnica filosófica utiliza el verbo "Elegir" con la "libertad condenada" en el existencialismo?',
                options: ['Sartre', 'Camus', 'Heidegger', 'Husserl'],
                correct: 0
            }, {
                question: '¿Qué autor propuso la "Voluntad general" como base de la democracia?',
                options: ['Rousseau', 'Locke', 'Hobbes', 'Montesquieu'],
                correct: 0
            }, {
                question: '¿Qué técnica filosófica combina el "Diálogo" y la "Polifonía" en el estudio del lenguaje?',
                options: ['Bakhtin', 'Eco', 'Chomsky', 'Saussure'],
                correct: 0
            }, {
                question: '¿Qué autor de la filosofía del siglo XX habla del "Ser como Dasein" y de "Habitar" la existencia?',
                options: ['Sartre', 'Heidegger', 'Husserl', 'Wittgenstein'],
                correct: 1
            }, {
                question: '¿Qué técnica filosófica usa el sustantivo "Actos" y el adjetivo "Hablados" para clasificar el lenguaje?',
                options: ['Austin', 'Searle', 'Grice', 'Wittgenstein'],
                correct: 1
            }];

            let currentQuiz = 0;
            let quizFeedback = '';
            let quizAnswered = false;

            function renderQuiz() {
                const container = document.getElementById('quizContent');
                const q = quizQuestions[currentQuiz];

                let html = `
                    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:0.3rem;margin-bottom:0.5rem;">
                        <span style="font-family:var(--font-uncial);font-size:0.7rem;color:var(--tinta-gris);">pregunta ${currentQuiz+1} de ${quizQuestions.length}</span>
                        <span style="font-family:var(--font-serif);font-size:0.6rem;color:var(--tinta-gris);">aciertos: ${getQuizScore()}</span>
                    </div>
                    <div class="quiz-question">${q.question}</div>
                    <div class="quiz-options">
                `;

                q.options.forEach((opt, idx) => {
                    const checked = quizAnswered && idx === q.correct ? 'checked' : '';
                    html += `
                        <label>
                            <input type="radio" name="quizOption" value="${idx}" ${checked} ${quizAnswered ? 'disabled' : ''} />
                            ${opt}
                        </label>
                    `;
                });

                html += `
                    </div>
                    <div class="quiz-actions">
                        <button class="btn-quiz" id="quizPrevBtn">◀ anterior</button>
                        <button class="btn-quiz" id="quizNextBtn">siguiente ▶</button>
                        <button class="btn-quiz primary" id="quizCheckBtn">${quizAnswered ? 'respondida' : 'responder'}</button>
                    </div>
                    <div class="quiz-result" id="quizFeedback">${quizFeedback || 'Selecciona una opción y presiona "responder".'}</div>
                `;

                container.innerHTML = html;

                document.getElementById('quizPrevBtn').addEventListener('click', function() {
                    if (currentQuiz > 0) { currentQuiz--;
                        quizFeedback = '';
                        quizAnswered = false;
                        renderQuiz(); }
                });
                document.getElementById('quizNextBtn').addEventListener('click', function() {
                    if (currentQuiz < quizQuestions.length - 1) { currentQuiz++;
                        quizFeedback = '';
                        quizAnswered = false;
                        renderQuiz(); }
                });

                document.getElementById('quizCheckBtn').addEventListener('click', function() {
                    const selected = document.querySelector('input[name="quizOption"]:checked');
                    if (!selected) {
                        quizFeedback = '✧ Selecciona una opción.';
                        renderQuiz();
                        return;
                    }
                    const value = parseInt(selected.value);
                    const isCorrect = value === q.correct;
                    quizAnswered = true;

                    if (isCorrect) {
                        quizFeedback =
                            `<span class="correct">✓ Correcto. ¡Bien hecho!</span> ${q.options[q.correct]}`;
                        const score = JSON.parse(localStorage.getItem('quiz_score_philosophia') || '[]');
                        score.push({ q: currentQuiz, correct: true });
                        localStorage.setItem('quiz_score_philosophia', JSON.stringify(score));
                    } else {
                        quizFeedback =
                            `<span class="incorrect">✗ Incorrecto.</span> La respuesta correcta es: ${q.options[q.correct]}`;
                        const score = JSON.parse(localStorage.getItem('quiz_score_philosophia') || '[]');
                        score.push({ q: currentQuiz, correct: false });
                        localStorage.setItem('quiz_score_philosophia', JSON.stringify(score));
                    }
                    renderQuiz();
                });

                const score = JSON.parse(localStorage.getItem('quiz_score_philosophia') || '[]');
                const existing = score.find(s => s.q === currentQuiz);
                if (existing && existing.correct !== undefined) {
                    quizAnswered = true;
                    if (existing.correct) {
                        quizFeedback = `<span class="correct">✓ Ya acertaste esta pregunta.</span>`;
                    } else {
                        quizFeedback =
                            `<span class="incorrect">✗ Fallaste esta pregunta. Inténtalo de nuevo.</span>`;
                        quizAnswered = false;
                        const radio = document.querySelector('input[name="quizOption"]');
                        if (radio) radio.disabled = false;
                    }
                    renderQuiz();
                }
            }

            function getQuizScore() {
                const score = JSON.parse(localStorage.getItem('quiz_score_philosophia') || '[]');
                return score.filter(s => s.correct).length;
            }

            // ============================================================
            //  9. TABS
            // ============================================================

            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    const target = this.dataset.tab;
                    document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
                    document.getElementById(target).classList.add('active');

                    if (target === 'tab-ejercicios') renderExercise();
                    if (target === 'tab-quiz') renderQuiz();
                    if (target === 'tab-tecnicas') {
                        if (modalOpen) {
                            modalOverlay.classList.remove('open');
                            document.body.style.overflow = '';
                            modalOpen = false;
                            modalId = null;
                            stopSpeaking();
                        }
                    }
                });
            });

            // ============================================================
            //  10. BÚSQUEDA Y FILTROS
            // ============================================================

            document.getElementById('searchInput').addEventListener('input', function() {
                searchTerm = this.value;
                renderAll();
            });

            document.getElementById('filterAllBtn').addEventListener('click', function() {
                filterMode = 'all';
                document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                renderAll();
            });
            document.getElementById('filterWrittenBtn').addEventListener('click', function() {
                filterMode = 'written';
                document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                renderAll();
            });
            document.getElementById('filterPendingBtn').addEventListener('click', function() {
                filterMode = 'pending';
                document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                renderAll();
            });
            document.getElementById('filterAllBtn').classList.add('active');

            // ============================================================
            //  11. RESET
            // ============================================================

            document.getElementById('resetAllBtn').addEventListener('click', function() {
                if (confirm('¿Limpiar todas las entradas del cuaderno?')) {
                    appState = { entries: {} };
                    AUTHORS.forEach(cat => {
                        cat.techniques.forEach(t => {
                            appState.entries[t.id] = { text: '', written: false, style: 'normal' };
                        });
                    });
                    saveState();
                    localStorage.removeItem('quiz_score_philosophia');
                    renderAll();
                    renderExercise();
                    renderQuiz();
                    stopSpeaking();
                    if (modalOpen) {
                        modalOverlay.classList.remove('open');
                        document.body.style.overflow = '';
                        modalOpen = false;
                        modalId = null;
                    }
                }
            });

            // ============================================================
            //  12. INICIO
            // ============================================================

            renderAll();
            renderExercise();
            renderQuiz();

            console.log('📜 PHILOSOPHIA cargada. 100 autores · 100 técnicas filosóficas.');
            const totalW = Object.values(appState.entries).filter(e => e.written).length;
            console.log(`📊 ${totalW}/100 técnicas filosóficas escritas.`);

        })();
    </script>

</body>
</html>
