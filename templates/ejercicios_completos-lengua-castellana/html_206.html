<!-- ============================================================
     COMPONENTE: EJERCICIO INTERACTIVO CON VALIDACIÓN
     ============================================================ -->
<div class="ejercicio-container" id="ejercicio-${t.id}">
    <div class="ejercicio-header">
        <strong>✍️ Ejercicio:</strong> ${t.ejercicio}
        <span class="badge bg-info">${t.tipo_ejercicio || 'texto'}</span>
    </div>
    
    <!-- Campo de respuesta según tipo -->
    <div class="ejercicio-campo">
        ${t.tipo_ejercicio === 'opcion_multiple' ? `
            <div class="opciones-multiple" id="opciones-${t.id}">
                ${opciones.map(o => `
                    <div class="form-check">
                        <input class="form-check-input" type="radio" 
                               name="opcion_${t.id}" value="${o.id}" id="opcion_${o.id}">
                        <label class="form-check-label" for="opcion_${o.id}">
                            ${o.opcion}
                        </label>
                    </div>
                `).join('')}
            </div>
        ` : `
            <textarea class="form-control" id="respuesta-${t.id}" 
                      placeholder="Escribe tu respuesta aquí..." rows="3"></textarea>
        `}
    </div>
    
    <!-- Botones de acción -->
    <div class="ejercicio-acciones">
        <button class="btn btn-neon-lleno" onclick="validarEjercicio(${t.id})">
            <i class="bi bi-check-circle"></i> Validar respuesta
        </button>
        <button class="btn btn-outline-gold ms-2" onclick="mostrarPista(${t.id})">
            <i class="bi bi-lightbulb"></i> Pista
        </button>
    </div>
    
    <!-- Feedback de validación -->
    <div class="ejercicio-feedback mt-2" id="feedback-${t.id}" style="display:none;">
        <div class="feedback-content p-2 rounded">
            <span class="feedback-icon"></span>
            <span class="feedback-mensaje"></span>
            <span class="feedback-puntaje"></span>
        </div>
    </div>
</div>
