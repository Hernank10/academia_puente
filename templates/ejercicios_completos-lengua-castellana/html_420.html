<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>📓 DIARIO·CODEX · 100 técnicas para escribir tu vida</title>

    <!-- Google Fonts para caligrafía -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Alex+Brush&family=Cedarville+Cursive&family=Dancing+Script:wght@400..700&family=Orbitron:wght@400;600;700;900&family=Share+Tech+Mono&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet" />

    <style>
        /* ============================================================
           BASE · ESTÉTICA FUTURISTA
           ============================================================ */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --bg-deep: #0a0a12;
            --bg-panel: #111822;
            --bg-card: #161e2b;
            --border-glow: #00f0ff;
            --border-glow-dim: rgba(0, 240, 255, 0.06);
            --text-primary: #e0f0ff;
            --text-secondary: #8ab4d6;
            --text-dim: #4a6a8a;
            --accent-cyan: #00f0ff;
            --accent-magenta: #ff2d95;
            --accent-purple: #b967ff;
            --accent-gold: #ffd700;
            --accent-orange: #ff6a00;
            --shadow-glow: 0 0 30px rgba(0, 240, 255, 0.03);
            --font-tech: 'Orbitron', 'Share Tech Mono', monospace;
            --font-sans: 'Rajdhani', 'Segoe UI', sans-serif;
            --font-spencerian: 'Great Vibes', cursive;
            --font-copperplate: 'Alex Brush', cursive;
            --font-chancery: 'Cedarville Cursive', cursive;
            --font-palmer: 'Dancing Script', cursive;
        }

        body {
            font-family: var(--font-sans);
            background: var(--bg-deep);
            background-image:
                radial-gradient(ellipse at 20% 30%, #0f1a2e 0%, transparent 60%),
                radial-gradient(ellipse at 80% 70%, #1a0a1e 0%, transparent 50%),
                repeating-linear-gradient(45deg, rgba(0, 240, 255, 0.012) 0px, rgba(0, 240, 255, 0.012) 1px, transparent 1px, transparent 8px);
            min-height: 100vh;
            padding: 0.6rem;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            color: var(--text-primary);
        }

        .codex-futuro {
            max-width: 1300px;
            width: 100%;
            background: var(--bg-panel);
            border: 1px solid var(--border-glow-dim);
            border-radius: 16px;
            box-shadow: 0 0 60px rgba(0, 240, 255, 0.02);
            padding: 1.2rem 1.2rem 0.8rem;
            position: relative;
            backdrop-filter: blur(2px);
        }

        .codex-futuro::before {
            content: '';
            position: absolute;
            inset: -1px;
            border-radius: 16px;
            padding: 1px;
            background: linear-gradient(135deg, var(--accent-cyan), transparent 50%, var(--accent-magenta));
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
            opacity: 0.15;
        }

        .codex-futuro::after {
            content: '✧ ✧ ✧';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--accent-cyan);
            font-size: 0.5rem;
            letter-spacing: 8px;
            background: var(--bg-panel);
            padding: 0 0.6rem;
            font-family: var(--font-tech);
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.08);
            opacity: 0.3;
        }

        /* ============================================================
           ENCABEZADO
           ============================================================ */

        .app-header-futuro {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.3rem 0.8rem;
            margin-bottom: 0.5rem;
            padding-bottom: 0.4rem;
            border-bottom: 1px solid var(--border-glow-dim);
        }

        .app-header-futuro h1 {
            font-family: var(--font-tech);
            font-weight: 700;
            font-size: 1.1rem;
            color: var(--accent-cyan);
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.05);
            letter-spacing: 0.04em;
            display: flex;
            align-items: center;
            gap: 0.3rem;
        }

        .app-header-futuro h1 small {
            font-weight: 400;
            font-size: 0.45rem;
            color: var(--text-dim);
            letter-spacing: 0.08em;
            opacity: 0.4;
        }

        .app-header-futuro .header-actions {
            display: flex;
            gap: 0.3rem;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn-neon {
            font-family: var(--font-tech);
            font-size: 0.45rem;
            padding: 0.2rem 0.7rem;
            border-radius: 30px;
            border: 1px solid var(--border-glow-dim);
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.25s;
            letter-spacing: 0.04em;
            text-transform: uppercase;
            display: inline-flex;
            align-items: center;
            gap: 0.15rem;
        }

        .btn-neon:hover {
            background: rgba(0, 240, 255, 0.03);
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }

        .btn-neon.primary {
            background: rgba(0, 240, 255, 0.03);
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
        }

        .btn-neon.magenta {
            border-color: rgba(255, 45, 149, 0.08);
            color: var(--accent-magenta);
        }
        .btn-neon.magenta:hover {
            background: rgba(255, 45, 149, 0.03);
            border-color: var(--accent-magenta);
        }

        /* ============================================================
           CONTROLES DE VOZ (arriba)
           ============================================================ */

        .voice-controls {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.3rem 0.6rem;
            padding: 0.2rem 0.5rem;
            background: rgba(0, 240, 255, 0.02);
            border-radius: 30px;
            border: 1px solid rgba(0, 240, 255, 0.02);
            margin-bottom: 0.8rem;
        }

        .voice-controls label {
            font-family: var(--font-tech);
            font-size: 0.4rem;
            color: var(--text-dim);
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .voice-controls select,
        .voice-controls input[type="range"] {
            font-family: var(--font-sans);
            font-size: 0.5rem;
            padding: 0.05rem 0.3rem;
            border-radius: 30px;
            border: 1px solid rgba(0, 240, 255, 0.03);
            background: rgba(10, 10, 18, 0.3);
            color: var(--text-primary);
            transition: border-color 0.2s;
        }

        .voice-controls select:focus,
        .voice-controls input[type="range"]:focus {
            border-color: var(--accent-cyan);
            outline: none;
        }

        .voice-controls input[type="range"] {
            width: 60px;
            padding: 0;
            accent-color: var(--accent-cyan);
            background: transparent;
        }

        .voice-controls .speed-label {
            font-size: 0.4rem;
            color: var(--text-dim);
            min-width: 1.8rem;
            text-align: center;
        }

        /* ============================================================
           PROGRESO
           ============================================================ */

        .progress-summary-futuro {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.2rem 0.6rem;
            background: rgba(0, 240, 255, 0.01);
            border-radius: 8px;
            border: 1px solid rgba(0, 240, 255, 0.01);
            margin-bottom: 0.8rem;
            flex-wrap: wrap;
        }

        .progress-summary-futuro .progress-bar-bg {
            flex: 1;
            min-width: 50px;
            height: 4px;
            background: rgba(0, 240, 255, 0.03);
            border-radius: 30px;
            overflow: hidden;
            border: 1px solid rgba(0, 240, 255, 0.01);
        }

        .progress-summary-futuro .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-cyan), var(--accent-magenta));
            border-radius: 30px;
            transition: width 0.4s ease;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.03);
        }

        .progress-summary-futuro .progress-text {
            font-family: var(--font-tech);
            font-size: 0.5rem;
            color: var(--text-secondary);
            white-space: nowrap;
            letter-spacing: 0.04em;
        }

        .progress-summary-futuro .progress-text strong {
            color: var(--accent-cyan);
            font-family: var(--font-sans);
        }

        /* ============================================================
           ACORDEÓN DE TÉCNICAS
           ============================================================ */

        .category-accordion-futuro {
            display: flex;
            flex-direction: column;
            gap: 0.25rem;
            max-height: 560px;
            overflow-y: auto;
            padding-right: 0.2rem;
        }

        .category-accordion-futuro::-webkit-scrollbar {
            width: 3px;
        }
        .category-accordion-futuro::-webkit-scrollbar-track {
            background: var(--bg-deep);
            border-radius: 30px;
        }
        .category-accordion-futuro::-webkit-scrollbar-thumb {
            background: var(--accent-cyan);
            border-radius: 30px;
        }

        .category-item-futuro {
            border: 1px solid rgba(0, 240, 255, 0.03);
            border-radius: 6px;
            background: rgba(22, 30, 43, 0.2);
            overflow: hidden;
            transition: all 0.2s;
        }

        .category-item-futuro:hover {
            border-color: rgba(0, 240, 255, 0.05);
        }

        .category-header-futuro {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            padding: 0.3rem 0.5rem;
            cursor: pointer;
            background: rgba(22, 30, 43, 0.15);
            transition: background 0.2s;
            user-select: none;
            flex-wrap: wrap;
        }

        .category-header-futuro:hover {
            background: rgba(0, 240, 255, 0.01);
        }

        .category-header-futuro .cat-icon {
            font-size: 0.7rem;
            color: var(--accent-cyan);
            width: 1.2rem;
            text-align: center;
            opacity: 0.4;
        }

        .category-header-futuro .cat-title {
            font-family: var(--font-tech);
            font-weight: 600;
            font-size: 0.55rem;
            color: var(--text-secondary);
            flex: 1;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .category-header-futuro .cat-count {
            font-size: 0.4rem;
            color: var(--text-dim);
            background: rgba(0, 240, 255, 0.01);
            padding: 0.01rem 0.35rem;
            border-radius: 30px;
            font-family: var(--font-sans);
            font-weight: 600;
        }

        .category-header-futuro .cat-arrow {
            color: var(--text-dim);
            font-size: 0.45rem;
            transition: transform 0.25s;
            margin-left: 0.05rem;
        }

        .category-header-futuro .cat-arrow.open {
            transform: rotate(180deg);
            color: var(--accent-cyan);
        }

        .category-body-futuro {
            padding: 0 0.4rem 0.4rem;
            display: none;
            border-top: 1px solid rgba(0, 240, 255, 0.01);
            padding-top: 0.25rem;
        }

        .category-body-futuro.open {
            display: block;
        }

        /* ============================================================
           TARJETA DE TÉCNICA (con voz y caligrafía)
           ============================================================ */

        .tech-card-futuro {
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
            padding: 0.25rem 0.4rem;
            margin-bottom: 0.15rem;
            border-radius: 4px;
            border-left: 2px solid var(--accent-cyan);
            background: rgba(22, 30, 43, 0.12);
            transition: background 0.2s;
        }

        .tech-card-futuro:hover {
            background: rgba(0, 240, 255, 0.01);
        }

        .tech-card-futuro .tech-head {
            display: flex;
            align-items: baseline;
            gap: 0.25rem;
            flex-wrap: wrap;
        }

        .tech-card-futuro .tech-num {
            font-family: var(--font-tech);
            font-size: 0.4rem;
            color: var(--accent-cyan);
            min-width: 1.6rem;
            font-weight: 600;
            opacity: 0.25;
        }

        .tech-card-futuro .tech-name {
            font-weight: 600;
            font-size: 0.65rem;
            color: var(--text-primary);
            font-family: var(--font-sans);
        }

        .tech-card-futuro .tech-rhetoric {
            font-size: 0.4rem;
            background: rgba(255, 45, 149, 0.03);
            padding: 0.01rem 0.35rem;
            border-radius: 30px;
            color: var(--accent-magenta);
            font-style: italic;
            border: 1px solid rgba(255, 45, 149, 0.02);
        }

        .tech-card-futuro .tech-example-box {
            font-size: 0.55rem;
            color: var(--text-secondary);
            background: rgba(0, 240, 255, 0.01);
            padding: 0.15rem 0.4rem;
            border-radius: 3px;
            border-left: 1px solid rgba(0, 240, 255, 0.03);
            margin: 0.05rem 0 0.08rem;
            line-height: 1.5;
            font-style: italic;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.3rem;
        }

        .tech-card-futuro .tech-example-box .example-text {
            flex: 1;
            min-width: 120px;
        }

        .tech-card-futuro .tech-example-box .btn-speech {
            font-family: var(--font-tech);
            font-size: 0.4rem;
            padding: 0.05rem 0.4rem;
            border-radius: 30px;
            border: 1px solid rgba(0, 240, 255, 0.04);
            background: transparent;
            color: var(--text-dim);
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.1rem;
            white-space: nowrap;
        }

        .tech-card-futuro .tech-example-box .btn-speech:hover {
            background: rgba(0, 240, 255, 0.02);
            border-color: rgba(0, 240, 255, 0.06);
            color: var(--accent-cyan);
        }

        .tech-card-futuro .tech-example-box .btn-speech.speaking {
            color: var(--accent-magenta);
            border-color: rgba(255, 45, 149, 0.1);
            background: rgba(255, 45, 149, 0.02);
        }

        .tech-card-futuro .tech-def {
            font-size: 0.5rem;
            color: var(--text-secondary);
            line-height: 1.4;
            margin: 0.02rem 0 0.02rem;
            padding-left: 0.05rem;
            opacity: 0.6;
        }

        .tech-card-futuro .tech-practice-area {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 0.2rem 0.4rem;
            margin-top: 0.1rem;
            padding-top: 0.15rem;
            border-top: 1px solid rgba(0, 240, 255, 0.01);
        }

        .tech-card-futuro .tech-practice-area .practice-input-group {
            flex: 1;
            min-width: 140px;
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
        }

        .tech-card-futuro .tech-practice-area .practice-input-group textarea {
            width: 100%;
            background: rgba(10, 10, 18, 0.25);
            border: 1px solid rgba(0, 240, 255, 0.02);
            border-radius: 3px;
            padding: 0.15rem 0.35rem;
            font-family: var(--font-sans);
            font-size: 0.5rem;
            color: var(--text-primary);
            resize: vertical;
            min-height: 28px;
            transition: border-color 0.2s;
        }

        .tech-card-futuro .tech-practice-area .practice-input-group textarea:focus {
            border-color: var(--accent-cyan);
            outline: none;
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.01);
        }

        .tech-card-futuro .tech-practice-area .practice-input-group .practice-preview {
            font-size: 0.7rem;
            padding: 0.1rem 0.3rem;
            min-height: 1.4rem;
            color: var(--accent-cyan);
            border-bottom: 1px solid rgba(0, 240, 255, 0.02);
            line-height: 1.6;
            word-break: break-word;
            transition: all 0.15s;
            opacity: 0.7;
        }

        .tech-card-futuro .tech-practice-area .practice-input-group .practice-preview:empty::before {
            content: 'tu texto aparecerá aquí...';
            color: var(--text-dim);
            opacity: 0.2;
            font-size: 0.5rem;
            font-style: italic;
        }

        .tech-card-futuro .tech-practice-area .tech-actions {
            display: flex;
            align-items: center;
            gap: 0.2rem;
            flex-wrap: wrap;
            padding-top: 0.1rem;
        }

        .tech-card-futuro .tech-practice-area .tech-actions .btn-speech-small {
            font-family: var(--font-tech);
            font-size: 0.35rem;
            padding: 0.04rem 0.3rem;
            border-radius: 30px;
            border: 1px solid rgba(0, 240, 255, 0.02);
            background: transparent;
            color: var(--text-dim);
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.05rem;
        }

        .tech-card-futuro .tech-practice-area .tech-actions .btn-speech-small:hover {
            background: rgba(0, 240, 255, 0.01);
            border-color: rgba(0, 240, 255, 0.04);
            color: var(--text-secondary);
        }

        .tech-card-futuro .tech-practice-area .tech-actions label {
            display: flex;
            align-items: center;
            gap: 0.1rem;
            font-size: 0.4rem;
            color: var(--text-dim);
            cursor: pointer;
            font-family: var(--font-sans);
        }

        .tech-card-futuro .tech-practice-area .tech-actions input[type="checkbox"] {
            appearance: none;
            width: 0.7rem;
            height: 0.7rem;
            border: 1px solid var(--text-dim);
            border-radius: 2px;
            cursor: pointer;
            background: transparent;
            transition: all 0.15s;
            position: relative;
            flex-shrink: 0;
        }

        .tech-card-futuro .tech-practice-area .tech-actions input[type="checkbox"]:checked {
            background: var(--accent-cyan);
            border-color: var(--accent-cyan);
            box-shadow: 0 0 20px rgba(0, 240, 255, 0.03);
        }

        .tech-card-futuro .tech-practice-area .tech-actions input[type="checkbox"]:checked::after {
            content: '✓';
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--bg-deep);
            font-size: 0.4rem;
            font-weight: 700;
        }

        .tech-card-futuro .tech-practice-area .tech-actions .wax-seal {
            display: inline-flex;
            align-items: center;
            gap: 0.05rem;
            font-size: 0.4rem;
            color: var(--accent-magenta);
            font-weight: 600;
            font-family: var(--font-tech);
            letter-spacing: 0.04em;
            opacity: 0.15;
            transition: opacity 0.3s;
        }

        .tech-card-futuro .tech-practice-area .tech-actions .wax-seal.active {
            opacity: 1;
            color: var(--accent-cyan);
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.02);
        }

        .tech-card-futuro .tech-practice-area .tech-actions .wax-seal .seal-icon {
            font-size: 0.5rem;
        }

        /* ============================================================
           PASTILLAS DE ESTILO (caligrafía)
           ============================================================ */

        .style-pills-futuro {
            display: flex;
            flex-wrap: wrap;
            gap: 0.1rem;
            margin: 0.2rem 0 0.1rem;
            padding: 0.1rem 0.2rem;
            background: rgba(22, 30, 43, 0.1);
            border-radius: 30px;
            border: 1px solid rgba(0, 240, 255, 0.01);
        }

        .style-pill-futuro {
            font-family: var(--font-tech);
            font-size: 0.35rem;
            padding: 0.05rem 0.4rem;
            border-radius: 30px;
            border: 1px solid rgba(0, 240, 255, 0.01);
            background: transparent;
            color: var(--text-dim);
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 400;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .style-pill-futuro:hover {
            background: rgba(0, 240, 255, 0.01);
            border-color: rgba(0, 240, 255, 0.02);
            color: var(--text-secondary);
        }

        .style-pill-futuro.active {
            background: rgba(0, 240, 255, 0.02);
            border-color: var(--accent-cyan);
            color: var(--accent-cyan);
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.01);
        }

        .style-pill-futuro .pill-preview {
            display: inline-block;
            font-size: 0.55rem;
            margin-left: 0.05rem;
            opacity: 0.2;
        }

        .style-pill-futuro.active .pill-preview {
            opacity: 1;
        }

        /* Estilos de caligrafía para la previsualización */
        .preview-spencerian {
            font-family: var(--font-spencerian);
        }
        .preview-copperplate {
            font-family: var(--font-copperplate);
        }
        .preview-chancery {
            font-family: var(--font-chancery);
        }
        .preview-palmer {
            font-family: var(--font-palmer);
        }
        .preview-normal {
            font-family: var(--font-sans);
            font-style: normal;
        }

        /* ============================================================
           BOTÓN FLOTANTE DE STOP
           ============================================================ */

        .float-stop-btn {
            position: fixed;
            bottom: 1.2rem;
            right: 1.2rem;
            z-index: 999;
            width: 3.2rem;
            height: 3.2rem;
            border-radius: 50%;
            background: var(--accent-magenta);
            border: 2px solid rgba(255, 45, 149, 0.3);
            color: #fff;
            font-size: 0.7rem;
            font-family: var(--font-tech);
            cursor: pointer;
            box-shadow: 0 0 40px rgba(255, 45, 149, 0.15), 0 0 80px rgba(255, 45, 149, 0.05);
            transition: all 0.3s;
            display: none;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            line-height: 1.2;
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .float-stop-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 60px rgba(255, 45, 149, 0.2);
        }

        .float-stop-btn.visible {
            display: flex;
        }

        .float-stop-btn .stop-icon {
            font-size: 1rem;
        }
        .float-stop-btn .stop-label {
            font-size: 0.3rem;
            opacity: 0.6;
        }

            // ============================================================
            //  2. ESTADO
            // ============================================================

            const STORAGE_KEY = 'diario_codex_100';

            function loadState() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) return JSON.parse(raw);
                } catch (_) { /* ignore */ }
                return { entries: {} }; // { id: { text, written } }
            }

            function saveState() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
                } catch (_) { /* ignore */ }
            }

            let appState = loadState();

            // Inicializar técnicas
            CATEGORIES.forEach(cat => {
                cat.techniques.forEach(t => {
                    if (!appState.entries[t.id]) {
                        appState.entries[t.id] = { text: '', written: false };
                    }
                });
            });
            saveState();

            // ============================================================
            //  3. VOZ (Web Speech API)
            // ============================================================

            let speechSynth = window.speechSynthesis;
            let currentUtterance = null;
            let isSpeaking = false;
            let speakingId = null;

            const voiceSelect = document.getElementById('voiceSelect');
            const speedRange = document.getElementById('speedRange');
            const speedLabel = document.getElementById('speedLabel');
            const floatStopBtn = document.getElementById('floatStopBtn');

            let voices = [];

            function loadVoices() {
                voices = speechSynth.getVoices();
                const esVoices = voices.filter(v => v.lang.startsWith('es'));
                const available = esVoices.length > 0 ? esVoices : voices;
                voiceSelect.innerHTML = '';
                available.forEach(v => {
                    const opt = document.createElement('option');
                    opt.value = v.name;
                    opt.textContent = `${v.name} (${v.lang})`;
                    voiceSelect.appendChild(opt);
                });
                if (available.length > 0) voiceSelect.value = available[0].name;
            }

            // Cargar voces al inicio y cuando cambien
            if (speechSynth.onvoiceschanged !== undefined) {
                speechSynth.onvoiceschanged = loadVoices;
            }
            setTimeout(loadVoices, 200);

            function speakText(text, id, onStart, onEnd) {
                if (isSpeaking) {
                    speechSynth.cancel();
                    isSpeaking = false;
                    floatStopBtn.classList.remove('visible');
                    if (onEnd) onEnd();
                    setTimeout(() => speakText(text, id, onStart, onEnd), 100);
                    return;
                }

                const utterance = new SpeechSynthesisUtterance(text);
                const selectedVoice = voiceSelect.value;
                const voice = voices.find(v => v.name === selectedVoice) || voices[0];
                if (voice) utterance.voice = voice;
                utterance.lang = 'es-ES';
                utterance.rate = parseFloat(speedRange.value);
                utterance.pitch = 1;

                utterance.onstart = function() {
                    isSpeaking = true;
                    speakingId = id;
                    floatStopBtn.classList.add('visible');
                    if (onStart) onStart();
                    // Actualizar botones de la técnica
                    document.querySelectorAll(`.btn-speech[data-id="${id}"]`).forEach(b => b.classList.add('speaking'));
                    document.querySelectorAll(`.btn-speech-small[data-id="${id}"]`).forEach(b => b.classList.add(
                    'speaking'));
                };

                utterance.onend = function() {
                    isSpeaking = false;
                    speakingId = null;
                    floatStopBtn.classList.remove('visible');
                    if (onEnd) onEnd();
                    document.querySelectorAll('.btn-speech.speaking').forEach(b => b.classList.remove('speaking'));
                    document.querySelectorAll('.btn-speech-small.speaking').forEach(b => b.classList.remove('speaking'));
                };

                utterance.onerror = function() {
                    isSpeaking = false;
                    speakingId = null;
                    floatStopBtn.classList.remove('visible');
                    if (onEnd) onEnd();
                    document.querySelectorAll('.btn-speech.speaking').forEach(b => b.classList.remove('speaking'));
                    document.querySelectorAll('.btn-speech-small.speaking').forEach(b => b.classList.remove('speaking'));
                };

                currentUtterance = utterance;
                speechSynth.speak(utterance);
            }

            function stopSpeaking() {
                if (isSpeaking) {
                    speechSynth.cancel();
                    isSpeaking = false;
                    speakingId = null;
                    floatStopBtn.classList.remove('visible');
                    document.querySelectorAll('.btn-speech.speaking').forEach(b => b.classList.remove('speaking'));
                    document.querySelectorAll('.btn-speech-small.speaking').forEach(b => b.classList.remove('speaking'));
                }
            }

            floatStopBtn.addEventListener('click', stopSpeaking);

            // Actualizar label de velocidad
            speedRange.addEventListener('input', function() {
                speedLabel.textContent = this.value;
            });

            // ============================================================
            //  4. RENDER
            // ============================================================

            const accordionContainer = document.getElementById('accordionContainer');

            function renderAll() {
                let html = '';
                let totalWritten = 0;
                let totalTechniques = 0;

                    let catWritten = 0;

                        const e = appState.entries[t.id] || { text: '', written: false };

                    const arrowClass = isOpen ? 'open' : '';

                    html += `
                        <div class="category-item-futuro" data-cat="${cat.id}">

                        // Estilo de caligrafía para la previsualización

                        html += `

                                        <span class="wax-seal ${isWritten ? 'active' : ''}">
                                            <span class="seal-icon">${isWritten ? '📓' : '◯'}</span>
                                        </span>
                                    </div>
                                </div>

                                <!-- Estilos de caligrafía para esta tarjeta -->
                                <div class="style-pills-futuro" data-target="${t.id}">
                                    <button class="style-pill-futuro" data-style="normal" data-target="${t.id}">normal</button>
                                    <button class="style-pill-futuro" data-style="spencerian" data-target="${t.id}">Spencerian <span class="pill-preview" style="font-family:'Great Vibes',cursive;">Aa</span></button>
                                    <button class="style-pill-futuro" data-style="copperplate" data-target="${t.id}">Copperplate <span class="pill-preview" style="font-family:'Alex Brush',cursive;">Aa</span></button>
                                    <button class="style-pill-futuro" data-style="chancery" data-target="${t.id}">Chancery <span class="pill-preview" style="font-family:'Cedarville Cursive',cursive;">Aa</span></button>
                                    <button class="style-pill-futuro" data-style="palmer" data-target="${t.id}">Palmer <span class="pill-preview" style="font-family:'Dancing Script',cursive;">Aa</span></button>
                                </div>
                            </div>
                        `;
                    });

                    html += `</div></div>`;
                });

                accordionContainer.innerHTML = html;

                // Actualizar contadores
                let totalW = 0;
                CATEGORIES.forEach(cat => {
                    cat.techniques.forEach(t => {
                        const e = appState.entries[t.id] || { text: '', written: false };
                        if (e.written) totalW++;
                    });
                });
                document.getElementById('progressNum').textContent = totalW;
                const pct = totalTechniques > 0 ? (totalW / totalTechniques) * 100 : 0;
                document.getElementById('progressFill').style.width = `${pct}%`;
                document.getElementById('sealDisplay').textContent = totalW === totalTechniques ? '⚡' :
                    totalW > 0 ? '◈' : '○';

                // === EVENTOS ===

                // Acordeón
                document.querySelectorAll('.category-header-futuro').forEach(header => {
                    header.addEventListener('click', function() {
                        const target = this.dataset.target;
                        const body = document.getElementById(`body-${target}`);
                        const arrow = this.querySelector('.cat-arrow');
                        if (body) {
                            body.classList.toggle('open');
                            if (arrow) arrow.classList.toggle('open');
                        }
                    });
                });

                // Práctica (textarea)
                document.querySelectorAll('.practice-text').forEach(ta => {
                    ta.addEventListener('input', function() {
                        const id = parseInt(this.dataset.id);
                        const val = this.value;
                        if (!appState.entries[id]) appState.entries[id] = { text: '', written: false };
                        appState.entries[id].text = val;
                        saveState();
                        // Actualizar previsualización
                        const preview = document.querySelector(`.practice-preview[data-id="${id}"]`);
                        if (preview) {
                            preview.textContent = val || '';
                            // Reaplicar estilo
                            const style = getCurrentStyleFor(id);
                            preview.className = `practice-preview ${style}`;
                        }
                        // Actualizar el botón de escuchar
                        const btn = document.querySelector(`.btn-speech-small[data-id="${id}"]`);
                        if (btn) btn.dataset.text = val || '';
                    });
                });

                // Checkbox "escrita"
                document.querySelectorAll('.written-check').forEach(cb => {
                    cb.addEventListener('change', function() {
                        const id = parseInt(this.dataset.id);

                        appState.entries[id].written = checked;
                        saveState();
                        renderAll(); // re-render para actualizar sellos y contadores
                    });
                });

                // Botones de escuchar (ejemplo original)
                document.querySelectorAll('.btn-speech').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = parseInt(this.dataset.id);
                        const text = this.dataset.text;
                        if (!text) return;
                        speakText(text, id);
                    });
                });

                // Botones de escuchar (texto del usuario)
                document.querySelectorAll('.btn-speech-small').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = parseInt(this.dataset.id);
                        let text = this.dataset.text;
                        if (!text || text.trim() === '') {
                            // Si no hay texto, usar el ejemplo
                            const exampleBtn = document.querySelector(`.btn-speech[data-id="${id}"]`);

                        speakText(text, id);

                // Estilos de caligrafía (pastillas dentro de cada tarjeta)

                        if (!appState.entries[targetId]) appState.entries[targetId] = { text: '',

                document.querySelectorAll('.practice-preview').forEach(preview => {
                    const id = parseInt(preview.dataset.id);
                    const entry = appState.entries[id];

                        const styleClass = getStyleClassFor(entry.style);

                        const parent = preview.closest('.tech-card-futuro').querySelector('.style-pills-futuro');
                        if (parent) {
                            parent.querySelectorAll('.style-pill-futuro').forEach(p => {
                                p.classList.toggle('active', p.dataset.style === entry.style);
                            });
                        }
                    } else {
                        // Estilo normal por defecto
                        preview.className = 'practice-preview preview-normal';
                        const parent = preview.closest('.tech-card-futuro').querySelector('.style-pills-futuro');
                        if (parent) {
                            parent.querySelectorAll('.style-pill-futuro').forEach(p => {
                                p.classList.toggle('active', p.dataset.style === 'normal');
                            });
                        }
                    }
                });

                saveState();
            }

            // ============================================================
            //  5. FUNCIONES DE ESTILO
            // ============================================================

            let globalStyle = 'normal';

            function getStyleClass() {
                return getStyleClassFor(globalStyle);
            }

            function getStyleClassFor(style) {
                switch (style) {
                    case 'spencerian':
                        return 'preview-spencerian';
                    case 'copperplate':
                        return 'preview-copperplate';
                    case 'chancery':
                        return 'preview-chancery';
                    case 'palmer':
                        return 'preview-palmer';
                    default:
                        return 'preview-normal';
                }
            }

            function getCurrentStyleFor(id) {
                const entry = appState.entries[id];
                if (entry && entry.style) {
                    return getStyleClassFor(entry.style);
                }
                return 'preview-normal';
            }

            // ============================================================
            //  6. RESET
            // ============================================================

            document.getElementById('resetAllBtn').addEventListener('click', function() {
                if (confirm('¿Resetear todas las entradas del diario?')) {
                    appState = { entries: {} };
                    CATEGORIES.forEach(cat => {
                        cat.techniques.forEach(t => {
                            appState.entries[t.id] = { text: '', written: false };
                        });
                    });
                    saveState();
                    renderAll();
                    stopSpeaking();
                }
            });

            // ============================================================
            //  7. INICIO
            // ============================================================

            renderAll();

            console.log('📓 DIARIO·CODEX cargado. 100 técnicas de diario personal.');
            const totalW = Object.values(appState.entries).filter(e => e.written).length;
            console.log(`📊 ${totalW}/100 entradas escritas.`);

        })();
    </script>

</body>
