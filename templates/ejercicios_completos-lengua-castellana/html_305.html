<div class="admin-gamificacion">
    <div class="row">
        <div class="col-md-6">
            <div class="admin-card">
                <h5><i class="bi bi-trophy"></i> Gestionar Niveles</h5>
                <div class="table-responsive">
                    <table class="table">
                        <thead>
                            <tr><th>Nivel</th><th>Título</th><th>Puntos</th><th>Acciones</th></tr>
                        </thead>
                        <tbody id="tabla-niveles">

                        </tbody>
                    </table>
                </div>
                <button class="btn btn-gold" onclick="crearNivel()"><i class="bi bi-plus-circle"></i> Nuevo nivel</button>
            </div>
        </div>
        <div class="col-md-6">
            <div class="admin-card">
                <h5><i class="bi bi-award"></i> Gestionar Logros</h5>

                    <table class="table">
                        <thead>
                            <tr><th>Nombre</th><th>Recompensa</th><th>Acciones</th></tr>
                        </thead>
                        <tbody id="tabla-logros">
                            <!-- Generado por JS -->
                        </tbody>
                    </table>
                </div>
                <button class="btn btn-gold" onclick="crearLogro()"><i class="bi bi-plus-circle"></i> Nuevo logro</button>
            </div>
        </div>
