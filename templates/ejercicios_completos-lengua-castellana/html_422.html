                        style: 'normal' };
                    appState.entries[id].written = checked;
                    saveState();
                    // Actualizar tarjeta
                    const cardCheck = document.querySelector(`.written-check[data-id="${id}"]`);
                    if (cardCheck) cardCheck.checked = checked;
                    const seal = document.querySelector(`.wax-seal[data-tech-id="${id}"]`);
                    if (seal) {
                        const icon = seal.querySelector('.seal-icon');
                        if (icon) icon.textContent = checked ? '🔴' : '○';
                        seal.classList.toggle('active', checked);
                    }
                    // Actualizar sellos en modal
                    modalBody.querySelectorAll('.wax-seal-modal').forEach(s => {
                        s.classList.toggle('active', checked);
                        const icon = s.querySelector('.seal-icon');
                        if (icon) icon.textContent = checked ? '🔴' : '○';
                        const label = s.textContent.trim();
                        if (label === 'sellada' || label === 'sin sello' || label === 'sellado' || label ===
                            'pendiente') {
                            s.innerHTML =
                                `<span class="seal-icon">${checked ? '🔴' : '○'}</span> ${checked ? 'sellada' : 'pendiente'}`;
                        }
                    });
                    // Actualizar contadores
                    renderAll();
                    renderExercise();
                    renderQuiz();
                });
            }

            function findTechnique(id) {
                for (const cat of CATEGORIES) {
                    for (const t of cat.techniques) {
                        if (t.id === id) return t;
                    }
                }
                return null;
            }

            // Cerrar modal
            modalClose.addEventListener('click', function() {
                modalOverlay.classList.remove('open');
                document.body.style.overflow = '';
                modalOpen = false;
                modalId = null;
                stopSpeaking();
            });

            modalOverlay.addEventListener('click', function(e) {
                if (e.target === this) {
                    modalOverlay.classList.remove('open');
                    document.body.style.overflow = '';
                    modalOpen = false;
                    modalId = null;
                    stopSpeaking();
                }
            });

            // ============================================================
            //  7. EJERCICIOS INTERACTIVOS
            // ============================================================

            const exercises = [{
                id: 1,
                prompt: 'Escribe un cuento que comience "in media res", en medio de la acción. No des explicaciones previas; sumerge al lector directamente en la escena.',
                hint: 'Empieza con una acción, un diálogo o una situación intrigante. El lector descubrirá el contexto a medida que avance.'
            }, {
                id: 2,
                prompt: 'Crea un personaje redondo a través del diálogo. Escribe un breve diálogo entre dos personajes que revele sus personalidades y su relación.',
                hint: 'No describas a los personajes; deja que sus palabras y su forma de hablar los muestren.'
            }, {
                id: 3,
                prompt: 'Usa el escenario como personaje. Escribe un cuento donde el entorno no sea solo un telón de fondo, sino que influya en la trama y los personajes.',
                hint: 'El lugar donde ocurre la historia debe tener una "personalidad" propia y afectar lo que sucede.'
            }, {
                id: 4,
                prompt: 'Escribe un cuento con un final abierto, donde el lector se quede con preguntas y posibilidades. No lo cierres todo; deja espacio a la interpretación.',
                hint: 'La última línea debe sugerir más de lo que dice. El lector debe sentir que la historia continúa más allá de la página.'
            }, {
                id: 5,
                prompt: 'Escribe un microcuento de menos de 100 palabras. Sé extremadamente económico con el lenguaje; cada palabra debe contar.',
                hint: 'Elimina todo lo superfluo. Enfócate en un momento, una imagen, una emoción o un giro sorpresa.'
            }];

            let currentExercise = 0;
            let exerciseFeedback = '';

            function renderExercise() {
                const container = document.getElementById('exerciseContent');
                const ex = exercises[currentExercise];
                const totalW = Object.values(appState.entries).filter(e => e.written).length;

                let html = `
                    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:0.3rem;margin-bottom:0.5rem;">
                        <span style="font-family:var(--font-uncial);font-size:0.7rem;color:var(--tinta-gris);">ejercicio ${currentExercise+1} de ${exercises.length}</span>
                        <span style="font-family:var(--font-serif);font-size:0.6rem;color:var(--tinta-gris);">cuentos escritos: ${totalW}/100</span>
                    </div>
                    <div class="exercise-prompt">${ex.prompt}</div>
                    <div style="font-size:0.7rem;color:var(--tinta-gris);opacity:0.4;margin-bottom:0.4rem;">💡 ${ex.hint}</div>
                    <textarea class="exercise-input" id="exerciseInput" placeholder="Escribe tu cuento aquí..."></textarea>
                    <div class="exercise-actions">
                        <button class="btn-exercise" id="exercisePrevBtn">◀ anterior</button>
                        <button class="btn-exercise" id="exerciseNextBtn">siguiente ▶</button>
                        <button class="btn-exercise primary" id="exerciseCheckBtn">🔍 revisar</button>
                        <button class="btn-exercise" id="exerciseSaveBtn">💾 guardar</button>
                    </div>
                    <div class="exercise-feedback" id="exerciseFeedback">${exerciseFeedback || 'Escribe tu cuento y presiona "revisar" para obtener retroalimentación.'}</div>
                `;

                container.innerHTML = html;

                document.getElementById('exercisePrevBtn').addEventListener('click', function() {
                    if (currentExercise > 0) { currentExercise--;
                        exerciseFeedback = '';
                        renderExercise(); }
                });
                document.getElementById('exerciseNextBtn').addEventListener('click', function() {
                    if (currentExercise < exercises.length - 1) { currentExercise++;
                        exerciseFeedback = '';
                        renderExercise(); }
                });

                document.getElementById('exerciseCheckBtn').addEventListener('click', function() {
                    const text = document.getElementById('exerciseInput').value.trim();
                    if (!text) {
                        exerciseFeedback = '✧ Escribe algo antes de revisar.';
                        renderExercise();
                        return;
                    }
                    const words = text.split(/\s+/);
                    const wordCount = words.length;
                    const hasDialogue = /[""]/.test(text);
                    const hasAction = /\b(correr|saltar|caminar|mirar|decir|preguntar|responder|gritar)\b/i.test(text);
                    const hasEmotion = /\b(amor|tristeza|alegría|miedo|silencio|soledad|pasión|dolor)\b/i.test(text);
                    const isBrief = wordCount <= 100;

                    let feedback = '✧ ';
                    if (isBrief) feedback += 'Bien, tu cuento es breve, propio del género. ';
                    else feedback += 'El cuento corto se caracteriza por la brevedad. Intenta condensar tu historia. ';

                    if (hasDialogue) feedback += 'Incluyes diálogo, eso dinamiza la narración. ';
                    else feedback += 'Prueba a añadir diálogo para dar vida a los personajes. ';

                    if (hasAction) feedback += 'Hay acción, eso mantiene el interés. ';
                    else feedback += 'Añade alguna acción para mover la historia. ';

                    if (hasEmotion) feedback += 'Incluyes emociones, eso conecta con el lector. ';
                    else feedback += 'Añade algún sentimiento para profundizar en la historia. ';

                    feedback += '✧';

                    const tempId = 999;
                    if (!appState.entries[tempId]) appState.entries[tempId] = { text: '', written: false,
                        style: 'normal' };
                    appState.entries[tempId].text = text;
                    saveState();

                    exerciseFeedback = feedback;
                    renderExercise();
                    document.getElementById('exerciseInput').value = text;
                });

                document.getElementById('exerciseSaveBtn').addEventListener('click', function() {
                    const text = document.getElementById('exerciseInput').value.trim();
                    if (!text) { exerciseFeedback = '✧ Escribe algo para guardar.';
                        renderExercise(); return; }
                    const tempId = 999;
                    if (!appState.entries[tempId]) appState.entries[tempId] = { text: '', written: false,
                        style: 'normal' };
                    appState.entries[tempId].text = text;
                    saveState();
                    exerciseFeedback = '✧ Cuento guardado en tu cuaderno. ✧';
                    renderExercise();
                    document.getElementById('exerciseInput').value = text;
                });

                const saved = appState.entries[999];
                if (saved && saved.text) {
                    document.getElementById('exerciseInput').value = saved.text;
                }
            }

            // ============================================================
            //  8. QUIZ
            // ============================================================

            const quizQuestions = [{
                question: '¿Qué técnica consiste en comenzar la historia en medio de la acción, sin introducción previa?',
                options: ['Flashback', 'In media res', 'Marco narrativo', 'Anacronía'],
                correct: 1
            }, {
                question: '¿Cómo se llama un personaje complejo, con contradicciones y evolución a lo largo del cuento?',
                options: ['Personaje plano', 'Personaje redondo', 'Personaje arquetípico', 'Personaje secundario'],
                correct: 1
            }, {
                question: '¿Qué técnica consiste en tratar el escenario como un personaje más, con su propia personalidad?',
                options: ['Escenario atmosférico', 'Escenario como personaje', 'Escenario mínimo', 'Escenario onírico'],
                correct: 1
            }, {
                question: '¿Qué tipo de conflicto enfrenta el protagonista consigo mismo?',
                options: ['Conflicto externo', 'Conflicto interno', 'Conflicto de valores', 'Conflicto social'],
                correct: 1
            }, {
                question: '¿Qué estilo de escritura se caracteriza por usar un lenguaje económico y preciso?',
                options: ['Estilo lírico', 'Estilo minimalista', 'Estilo realista', 'Estilo fantástico'],
                correct: 1
            }, {
                question: '¿Qué técnica temporal consiste en un salto al pasado que revela información crucial?',
                options: ['Flashback', 'Prolepsis', 'Elipsis', 'Sumario'],
                correct: 0
            }, {
                question: '¿Qué género de cuento introduce elementos mágicos en un mundo realista sin ser cuestionados?',
                options: ['Ciencia ficción', 'Realismo mágico', 'Fantasía', 'Terror'],
                correct: 1
            }, {
                question: '¿Qué técnica narrativa consiste en "mostrar, no decir" las emociones de los personajes?',
                options: ['Descripción directa', 'Mostrar, no decir', 'Verbos fuertes', 'Economía narrativa'],
                correct: 1
            }, {
                question: '¿Qué estructura narrativa comienza y termina en el mismo punto, creando una sensación de ciclo?',
                options: ['Estructura de tres actos', 'Estructura circular', 'Marco narrativo', 'Final abierto'],
                correct: 1
            }, {
                question: '¿Qué técnica consiste en contar una historia en menos de 100 palabras?',
                options: ['Microficción', 'Cuento de hadas', 'Cuento de personajes', 'Cuento de viajes'],
                correct: 0
            }];

            let currentQuiz = 0;
            let quizFeedback = '';
            let quizAnswered = false;

            function renderQuiz() {
                const container = document.getElementById('quizContent');
                const q = quizQuestions[currentQuiz];

                let html = `
                    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:0.3rem;margin-bottom:0.5rem;">
                        <span style="font-family:var(--font-uncial);font-size:0.7rem;color:var(--tinta-gris);">pregunta ${currentQuiz+1} de ${quizQuestions.length}</span>
                        <span style="font-family:var(--font-serif);font-size:0.6rem;color:var(--tinta-gris);">aciertos: ${getQuizScore()}</span>
                    </div>
                    <div class="quiz-question">${q.question}</div>
                    <div class="quiz-options">
                `;

                q.options.forEach((opt, idx) => {
                    const checked = quizAnswered && idx === q.correct ? 'checked' : '';
                    html += `
                        <label>
                            <input type="radio" name="quizOption" value="${idx}" ${checked} ${quizAnswered ? 'disabled' : ''} />
                            ${opt}
                        </label>
                    `;
                });

                html += `
                    </div>
                    <div class="quiz-actions">
                        <button class="btn-quiz" id="quizPrevBtn">◀ anterior</button>
                        <button class="btn-quiz" id="quizNextBtn">siguiente ▶</button>
                        <button class="btn-quiz primary" id="quizCheckBtn">${quizAnswered ? 'respondida' : 'responder'}</button>
                    </div>
                    <div class="quiz-result" id="quizFeedback">${quizFeedback || 'Selecciona una opción y presiona "responder".'}</div>
                `;

                container.innerHTML = html;

                document.getElementById('quizPrevBtn').addEventListener('click', function() {
                    if (currentQuiz > 0) { currentQuiz--;
                        quizFeedback = '';
                        quizAnswered = false;
                        renderQuiz(); }
                });
                document.getElementById('quizNextBtn').addEventListener('click', function() {
                    if (currentQuiz < quizQuestions.length - 1) { currentQuiz++;
                        quizFeedback = '';
                        quizAnswered = false;
                        renderQuiz(); }
                });

                document.getElementById('quizCheckBtn').addEventListener('click', function() {
                    const selected = document.querySelector('input[name="quizOption"]:checked');
                    if (!selected) {
                        quizFeedback = '✧ Selecciona una opción.';
                        renderQuiz();
                        return;
                    }
                    const value = parseInt(selected.value);
                    const isCorrect = value === q.correct;
                    quizAnswered = true;

                    if (isCorrect) {
                        quizFeedback =
                            `<span class="correct">✓ Correcto. ¡Bien hecho!</span> ${q.options[q.correct]}`;
                        const score = JSON.parse(localStorage.getItem('quiz_score_fabula') || '[]');
                        score.push({ q: currentQuiz, correct: true });
                        localStorage.setItem('quiz_score_fabula', JSON.stringify(score));
                    } else {
                        quizFeedback =
                            `<span class="incorrect">✗ Incorrecto.</span> La respuesta correcta es: ${q.options[q.correct]}`;
                        const score = JSON.parse(localStorage.getItem('quiz_score_fabula') || '[]');
                        score.push({ q: currentQuiz, correct: false });
                        localStorage.setItem('quiz_score_fabula', JSON.stringify(score));
                    }
                    renderQuiz();
                });

                const score = JSON.parse(localStorage.getItem('quiz_score_fabula') || '[]');
                const existing = score.find(s => s.q === currentQuiz);
                if (existing && existing.correct !== undefined) {
                    quizAnswered = true;
                    if (existing.correct) {
                        quizFeedback = `<span class="correct">✓ Ya acertaste esta pregunta.</span>`;
                    } else {
                        quizFeedback =
                            `<span class="incorrect">✗ Fallaste esta pregunta. Inténtalo de nuevo.</span>`;
                        quizAnswered = false;
                        const radio = document.querySelector('input[name="quizOption"]');
                        if (radio) radio.disabled = false;
                    }
                    renderQuiz();
                }
            }

            function getQuizScore() {
                const score = JSON.parse(localStorage.getItem('quiz_score_fabula') || '[]');
                return score.filter(s => s.correct).length;
            }

            // ============================================================
            //  9. TABS
            // ============================================================

            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    const target = this.dataset.tab;
                    document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
                    document.getElementById(target).classList.add('active');

                    if (target === 'tab-ejercicios') renderExercise();
                    if (target === 'tab-quiz') renderQuiz();
                    if (target === 'tab-tecnicas') {
                        // Cerrar modal si está abierto
                        if (modalOpen) {
                            modalOverlay.classList.remove('open');
                            document.body.style.overflow = '';
                            modalOpen = false;
                            modalId = null;
                            stopSpeaking();
                        }
                    }
                });
            });

            // ============================================================
            //  10. BÚSQUEDA Y FILTROS
            // ============================================================

            document.getElementById('searchInput').addEventListener('input', function() {
                searchTerm = this.value;
                renderAll();
            });

            document.getElementById('filterAllBtn').addEventListener('click', function() {
                filterMode = 'all';
                document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                renderAll();
            });
            document.getElementById('filterWrittenBtn').addEventListener('click', function() {
                filterMode = 'written';
                document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                renderAll();
            });
            document.getElementById('filterPendingBtn').addEventListener('click', function() {
                filterMode = 'pending';
                document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                renderAll();
            });
            document.getElementById('filterAllBtn').classList.add('active');

            // ============================================================
            //  11. RESET
            // ============================================================

            document.getElementById('resetAllBtn').addEventListener('click', function() {
                if (confirm('¿Limpiar todas las entradas del cuaderno?')) {
                    appState = { entries: {} };
                    CATEGORIES.forEach(cat => {
                        cat.techniques.forEach(t => {
                            appState.entries[t.id] = { text: '', written: false, style: 'normal' };
                        });
                    });
                    saveState();
                    localStorage.removeItem('quiz_score_fabula');
                    renderAll();
                    renderExercise();
                    renderQuiz();
                    stopSpeaking();
                    if (modalOpen) {
                        modalOverlay.classList.remove('open');
                        document.body.style.overflow = '';
                        modalOpen = false;
                        modalId = null;
                    }
                }
            });

            // ============================================================
            //  12. INICIO
            // ============================================================

            renderAll();
            renderExercise();
            renderQuiz();

            console.log('📖 FABULA cargada. 100 técnicas de cuento corto.');
            const totalW = Object.values(appState.entries).filter(e => e.written).length;
            console.log(`📊 ${totalW}/100 cuentos escritos.`);

        })();
    </script>

</body>
</html>
