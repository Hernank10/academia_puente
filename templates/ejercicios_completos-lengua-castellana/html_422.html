<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>📖 FABULA · 100 técnicas de cuento corto</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Uncial+Antiqua&family=EB+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Cinzel:wght@400;600;700&family=Great+Vibes&family=Alex+Brush&family=Cedarville+Cursive&family=Dancing+Script:wght@400..700&display=swap" rel="stylesheet" />

    <style>
        /* ============================================================
           BASE · INTERACTIVO Y DINÁMICO
           ============================================================ */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --pergamino: #f2e6d0;
            --pergamino-dark: #dcc9ae;
            --pergamino-light: #faf3e6;
            --tinta: #2c1810;
            --tinta-clara: #5a3d2e;
            --tinta-gris: #8a7a6a;
            --oro: #c9a84c;
            --oro-light: #e8d5a3;
            --oro-dark: #a8892b;
            --rubi: #8b1a2b;
            --rubi-light: #b84a5a;
            --borde-deco: #b8956a;
            --sombra: rgba(44, 24, 16, 0.2);
            --font-uncial: 'Uncial Antiqua', 'MedievalSharp', cursive;
            --font-serif: 'EB Garamond', 'Times New Roman', serif;
            --font-cinzel: 'Cinzel', serif;
            --font-spencerian: 'Great Vibes', cursive;
            --font-copperplate: 'Alex Brush', cursive;
            --font-chancery: 'Cedarville Cursive', cursive;
            --font-palmer: 'Dancing Script', cursive;
        }

        body {
            font-family: var(--font-serif);
            background: #d6c8b2;
            background-image:
                radial-gradient(ellipse at 20% 30%, #e8dccc 0%, transparent 60%),
                radial-gradient(ellipse at 80% 70%, #dacdbd 0%, transparent 50%);
            min-height: 100vh;
            padding: 1rem;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            color: var(--tinta);
        }

        .codex {
            max-width: 1350px;
            width: 100%;
            background: var(--pergamino-light);
            background-image:
                linear-gradient(0deg, rgba(212, 185, 150, 0.12) 0%, transparent 15%, transparent 85%, rgba(212, 185, 150, 0.08) 100%),
                repeating-linear-gradient(0deg, transparent, transparent 29px, rgba(160, 130, 100, 0.04) 29px, rgba(160, 130, 100, 0.04) 30px);
            border-radius: 18px;
            box-shadow:
                0 8px 60px rgba(44, 24, 16, 0.25),
                inset 0 0 80px rgba(200, 170, 130, 0.10),
                0 0 0 1px var(--oro-dark),
                0 0 0 3px var(--pergamino-dark),
                0 0 0 5px var(--oro);
            padding: 2rem 2rem 1.5rem;
            position: relative;
        }

        .codex::before {
            content: '';
            position: absolute;
            inset: 8px;
            border: 1px solid rgba(201, 168, 76, 0.12);
            border-radius: 14px;
            pointer-events: none;
        }

        .codex::after {
            content: '✦ ✦ ✦';
            position: absolute;
            bottom: -14px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--oro);
            font-size: 0.9rem;
            letter-spacing: 12px;
            background: var(--pergamino-light);
            padding: 0 1.8rem;
            font-family: var(--font-uncial);
            text-shadow: 0 0 8px rgba(201, 168, 76, 0.08);
        }

        /* ============================================================
           ENCABEZADO
           ============================================================ */

        .app-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem 1.5rem;
            margin-bottom: 1.2rem;
            padding-bottom: 0.8rem;
            border-bottom: 2px solid var(--oro-light);
            position: relative;
        }

        .app-header h1 {
            font-family: var(--font-uncial);
            font-weight: 700;
            font-size: 2.4rem;
            color: var(--rubi);
            text-shadow: 0 1px 4px rgba(139, 26, 43, 0.06);
            letter-spacing: 0.04em;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .app-header h1 small {
            font-family: var(--font-serif);
            font-size: 0.7rem;
            font-weight: 400;
            color: var(--tinta-clara);
            opacity: 0.4;
            letter-spacing: 0.06em;
            line-height: 1.2;
            max-width: 200px;
        }

        .app-header .header-actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .btn-pergamino {
            font-family: var(--font-uncial);
            font-size: 0.7rem;
            padding: 0.35rem 1.4rem;
            border-radius: 40px;
            border: 1px solid var(--oro-light);
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(4px);
            color: var(--tinta-clara);
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 0.04em;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        .btn-pergamino:hover {
            background: rgba(201, 168, 76, 0.08);
            border-color: var(--oro);
            color: var(--rubi);
            box-shadow: 0 0 30px rgba(201, 168, 76, 0.04);
        }

        .btn-pergamino.primary {
            background: rgba(139, 26, 43, 0.04);
            border-color: var(--rubi-light);
            color: var(--rubi);
        }

        .btn-pergamino.primary:hover {
            background: rgba(139, 26, 43, 0.08);
            border-color: var(--rubi);
        }

        /* ============================================================
           PESTAÑAS
           ============================================================ */

        .tab-bar {
            display: flex;
            gap: 0.1rem;
            border-bottom: 2px solid var(--oro-light);
            margin-bottom: 1.5rem;
            padding-bottom: 0.1rem;
            flex-wrap: wrap;
        }

        .tab-btn {
            font-family: var(--font-uncial);
            font-size: 0.85rem;
            padding: 0.4rem 1.8rem 0.35rem;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            color: var(--tinta-gris);
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 0.04em;
        }

        .tab-btn:hover {
            color: var(--tinta-clara);
            background: rgba(201, 168, 76, 0.02);
        }

        .tab-btn.active {
            color: var(--rubi);
            border-bottom-color: var(--oro);
            background: rgba(201, 168, 76, 0.03);
        }

        .tab-btn .badge-progress {
            display: inline-block;
            font-family: var(--font-serif);
            font-size: 0.55rem;
            background: var(--oro-light);
            color: var(--tinta);
            border-radius: 30px;
            padding: 0.02rem 0.6rem;
            margin-left: 0.2rem;
            font-weight: 600;
            vertical-align: middle;
            line-height: 1.4;
        }

        .tab-pane {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .tab-pane.active {
            display: block;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(8px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============================================================
           PROGRESO
           ============================================================ */

        .progress-summary {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.5rem 1.2rem;
            background: rgba(201, 168, 76, 0.04);
            border-radius: 12px;
            border: 1px solid rgba(201, 168, 76, 0.06);
            margin-bottom: 1.2rem;
            flex-wrap: wrap;
            backdrop-filter: blur(2px);
        }

        .progress-summary .progress-bar-bg {
            flex: 1;
            min-width: 100px;
            height: 8px;
            background: rgba(184, 149, 106, 0.10);
            border-radius: 30px;
            overflow: hidden;
            border: 1px solid rgba(201, 168, 76, 0.06);
        }

        .progress-summary .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--oro-light), var(--oro), var(--oro-dark));
            border-radius: 30px;
            transition: width 0.6s ease;
        }

        .progress-summary .progress-text {
            font-family: var(--font-uncial);
            font-size: 0.8rem;
            color: var(--tinta-clara);
            white-space: nowrap;
        }

        .progress-summary .progress-text strong {
            color: var(--rubi);
            font-family: var(--font-serif);
        }

        /* ============================================================
           BÚSQUEDA Y FILTROS
           ============================================================ */

        .search-box {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .search-box input {
            flex: 1;
            min-width: 200px;
            padding: 0.4rem 1rem;
            border: 1px solid var(--oro-light);
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(4px);
            font-family: var(--font-serif);
            font-size: 0.85rem;
            color: var(--tinta);
            transition: border-color 0.3s;
            outline: none;
        }

        .search-box input:focus {
            border-color: var(--oro);
            box-shadow: 0 0 0 3px rgba(201, 168, 76, 0.05);
        }

        .search-box input::placeholder {
            color: var(--tinta-gris);
            opacity: 0.4;
            font-style: italic;
        }

        .search-box .btn-filter {
            font-family: var(--font-uncial);
            font-size: 0.6rem;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            border: 1px solid var(--oro-light);
            background: rgba(255, 255, 255, 0.10);
            color: var(--tinta-clara);
            cursor: pointer;
            transition: all 0.3s;
        }

        .search-box .btn-filter:hover {
            background: rgba(201, 168, 76, 0.05);
            border-color: var(--oro);
        }

        .search-box .btn-filter.active {
            background: rgba(201, 168, 76, 0.08);
            border-color: var(--oro);
            color: var(--rubi);
        }

        /* ============================================================
           ACORDEÓN DE TÉCNICAS
           ============================================================ */

        .category-accordion {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            max-height: 580px;
            overflow-y: auto;
            padding-right: 0.3rem;
        }

        .category-accordion::-webkit-scrollbar {
            width: 6px;
        }
        .category-accordion::-webkit-scrollbar-track {
            background: var(--pergamino);
            border-radius: 30px;
        }
        .category-accordion::-webkit-scrollbar-thumb {
            background: var(--oro);
            border-radius: 30px;
        }

        .category-item {
            border: 1px solid rgba(184, 149, 106, 0.12);
            border-radius: 12px;
            background: rgba(252, 246, 235, 0.15);
            overflow: hidden;
            transition: all 0.25s;
            backdrop-filter: blur(2px);
        }

        .category-item:hover {
            border-color: rgba(201, 168, 76, 0.18);
            box-shadow: 0 2px 20px rgba(201, 168, 76, 0.02);
        }

        .category-header {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.6rem 1rem;
            cursor: pointer;
            background: rgba(252, 246, 235, 0.10);
            transition: background 0.2s;
            user-select: none;
            flex-wrap: wrap;
        }

        .category-header:hover {
            background: rgba(201, 168, 76, 0.03);
        }

        .category-header .cat-icon {
            font-size: 1.3rem;
            color: var(--oro);
            width: 2.2rem;
            text-align: center;
        }

        .category-header .cat-title {
            font-family: var(--font-uncial);
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--tinta);
            flex: 1;
            letter-spacing: 0.02em;
        }

        .category-header .cat-count {
            font-size: 0.65rem;
            color: var(--tinta-gris);
            background: rgba(201, 168, 76, 0.03);
            padding: 0.02rem 0.7rem;
            border-radius: 30px;
            font-family: var(--font-serif);
            font-weight: 600;
        }

        .category-header .cat-arrow {
            color: var(--oro-dark);
            font-size: 0.7rem;
            transition: transform 0.3s;
            margin-left: 0.1rem;
        }

        .category-header .cat-arrow.open {
            transform: rotate(180deg);
        }

        .category-body {
            padding: 0 1rem 1rem;
            display: none;
            border-top: 1px solid rgba(184, 149, 106, 0.05);
            padding-top: 0.6rem;
        }

        .category-body.open {
            display: block;
        }

        /* ============================================================
           TARJETA DE TÉCNICA (INTERACTIVA)
           ============================================================ */

        .tech-card {
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
            padding: 0.6rem 0.8rem;
            margin-bottom: 0.3rem;
            border-radius: 10px;
            border-left: 4px solid var(--oro-light);
            background: rgba(252, 246, 235, 0.10);
            transition: all 0.3s;
            cursor: pointer;
            position: relative;
        }

        .tech-card:hover {
            background: rgba(252, 246, 235, 0.30);
            border-left-color: var(--oro);
            transform: translateX(4px);
            box-shadow: 0 2px 16px rgba(201, 168, 76, 0.04);
        }

        .tech-card .tech-head {
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .tech-card .tech-num {
            font-family: var(--font-uncial);
            font-size: 0.6rem;
            color: var(--oro-dark);
            min-width: 2.4rem;
            font-weight: 600;
            opacity: 0.4;
        }

        .tech-card .tech-name {
            font-weight: 700;
            font-size: 1rem;
            color: var(--tinta);
            font-family: var(--font-serif);
        }

        .tech-card .tech-rhetoric {
            font-size: 0.55rem;
            background: rgba(201, 168, 76, 0.05);
            padding: 0.02rem 0.6rem;
            border-radius: 30px;
            color: var(--tinta-clara);
            font-style: italic;
            border: 1px solid rgba(201, 168, 76, 0.04);
        }

        .tech-card .tech-def {
            font-size: 0.8rem;
            color: var(--tinta-clara);
            line-height: 1.6;
            margin: 0.05rem 0 0.05rem;
            padding-left: 0.1rem;
        }

        .tech-card .tech-example-box {
            font-size: 0.75rem;
            color: var(--tinta-clara);
            font-style: italic;
            background: rgba(201, 168, 76, 0.02);
            padding: 0.2rem 0.7rem;
            border-radius: 8px;
            border-left: 3px solid var(--oro-light);
            margin: 0.05rem 0 0.1rem;
            line-height: 1.7;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.4rem;
        }

        .tech-card .tech-example-box .example-text {
            flex: 1;
            min-width: 140px;
        }

        .tech-card .tech-example-box .btn-speech {
            font-family: var(--font-uncial);
            font-size: 0.5rem;
            padding: 0.05rem 0.6rem;
            border-radius: 30px;
            border: 1px solid rgba(201, 168, 76, 0.10);
            background: transparent;
            color: var(--tinta-gris);
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.1rem;
            white-space: nowrap;
        }

        .tech-card .tech-example-box .btn-speech:hover {
            background: rgba(201, 168, 76, 0.04);
            border-color: var(--oro);
            color: var(--rubi);
        }

        .tech-card .tech-example-box .btn-speech.speaking {
            color: var(--rubi);
            border-color: var(--rubi-light);
            background: rgba(139, 26, 43, 0.03);
        }

        /* Área de práctica */
        .tech-card .tech-practice-area {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 0.4rem 0.8rem;
            margin-top: 0.1rem;
            padding-top: 0.3rem;
            border-top: 1px dashed rgba(184, 149, 106, 0.10);
        }

        .tech-card .tech-practice-area .practice-input-group {
            flex: 1;
            min-width: 180px;
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
        }

        .tech-card .tech-practice-area .practice-input-group textarea {
            width: 100%;
            background: rgba(252, 246, 235, 0.15);
            border: 1px solid rgba(184, 149, 106, 0.08);
            border-radius: 8px;
            padding: 0.25rem 0.6rem;
            font-family: var(--font-serif);
            font-size: 0.75rem;
            color: var(--tinta);
            resize: vertical;
            min-height: 36px;
            transition: border-color 0.3s;
            backdrop-filter: blur(2px);
        }

        .tech-card .tech-practice-area .practice-input-group textarea:focus {
            border-color: var(--oro);
            outline: none;
            box-shadow: 0 0 0 3px rgba(201, 168, 76, 0.03);
        }

        .tech-card .tech-practice-area .practice-input-group .practice-preview {
            font-size: 0.85rem;
            padding: 0.1rem 0.3rem;
            min-height: 1.6rem;
            color: var(--tinta-clara);
            border-bottom: 1px solid rgba(184, 149, 106, 0.05);
            line-height: 1.7;
            word-break: break-word;
            transition: all 0.15s;
            font-style: italic;
            opacity: 0.5;
        }

        .tech-card .tech-practice-area .practice-input-group .practice-preview:empty::before {
            content: 'tu cuento aparecerá aquí...';
            color: var(--tinta-gris);
            opacity: 0.2;
            font-size: 0.65rem;
            font-style: italic;
        }

        .preview-spencerian {
            font-family: var(--font-spencerian);
            font-style: normal;
            opacity: 1;
        }
        .preview-copperplate {
            font-family: var(--font-copperplate);
            font-style: normal;
            opacity: 1;
        }
        .preview-chancery {
            font-family: var(--font-chancery);
            font-style: normal;
            opacity: 1;
        }
        .preview-palmer {
            font-family: var(--font-palmer);
            font-style: normal;
            opacity: 1;
        }
        .preview-normal {
            font-family: var(--font-serif);
            font-style: italic;
            opacity: 0.5;
        }

        .tech-card .tech-practice-area .tech-actions {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            flex-wrap: wrap;
            padding-top: 0.1rem;
        }

        .tech-card .tech-practice-area .tech-actions .btn-speech-small {
            font-family: var(--font-uncial);
            font-size: 0.45rem;
            padding: 0.04rem 0.5rem;
            border-radius: 30px;
            border: 1px solid rgba(184, 149, 106, 0.06);
            background: transparent;
            color: var(--tinta-gris);
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.05rem;
        }

        .tech-card .tech-practice-area .tech-actions .btn-speech-small:hover {
            background: rgba(201, 168, 76, 0.03);
            border-color: var(--oro);
            color: var(--rubi);
        }

        .tech-card .tech-practice-area .tech-actions .btn-speech-small.speaking {
            color: var(--rubi);
            border-color: var(--rubi-light);
        }

        .tech-card .tech-practice-area .tech-actions label {
            display: flex;
            align-items: center;
            gap: 0.15rem;
            font-size: 0.55rem;
            color: var(--tinta-gris);
            cursor: pointer;
            font-family: var(--font-serif);
        }

        .tech-card .tech-practice-area .tech-actions input[type="checkbox"] {
            appearance: none;
            width: 1rem;
            height: 1rem;
            border: 2px solid var(--oro-dark);
            border-radius: 4px;
            cursor: pointer;
            background: var(--pergamino-light);
            transition: all 0.15s;
            position: relative;
            flex-shrink: 0;
        }

        .tech-card .tech-practice-area .tech-actions input[type="checkbox"]:checked {
            background: var(--oro);
            border-color: var(--oro);
        }

        .tech-card .tech-practice-area .tech-actions input[type="checkbox"]:checked::after {
            content: '✓';
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--pergamino-light);
            font-size: 0.65rem;
            font-weight: 700;
        }

        .tech-card .tech-practice-area .tech-actions .wax-seal {
            display: inline-flex;
            align-items: center;
            gap: 0.1rem;
            font-size: 0.5rem;
            color: var(--rubi);
            font-weight: 600;
            font-family: var(--font-uncial);
            letter-spacing: 0.04em;
            opacity: 0.2;
            transition: opacity 0.3s;
        }

        .tech-card .tech-practice-area .tech-actions .wax-seal.active {
            opacity: 1;
        }

        .tech-card .tech-practice-area .tech-actions .wax-seal .seal-icon {
            font-size: 0.9rem;
            filter: drop-shadow(0 1px 4px rgba(139, 26, 43, 0.06));
        }

        /* Estilos de caligrafía */
        .style-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 0.1rem;
            margin: 0.15rem 0 0.05rem;
            padding: 0.1rem 0.3rem;
            background: rgba(252, 246, 235, 0.10);
            border-radius: 40px;
            border: 1px solid rgba(184, 149, 106, 0.03);
        }

        .style-pill {
            font-family: var(--font-uncial);
            font-size: 0.4rem;
            padding: 0.04rem 0.5rem;
            border-radius: 30px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--tinta-gris);
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 400;
            letter-spacing: 0.02em;
        }

        .style-pill:hover {
            background: rgba(201, 168, 76, 0.02);
            border-color: rgba(201, 168, 76, 0.05);
            color: var(--tinta-clara);
        }

        .style-pill.active {
            background: rgba(201, 168, 76, 0.05);
            border-color: var(--oro);
            color: var(--rubi);
        }

        .style-pill .pill-preview {
            display: inline-block;
            font-size: 0.65rem;
            margin-left: 0.05rem;
            opacity: 0.25;
        }

        .style-pill.active .pill-preview {
            opacity: 1;
        }

        /* ============================================================
           EJERCICIOS Y QUIZ
           ============================================================ */

        .exercise-section,
        .quiz-section {
            background: rgba(252, 246, 235, 0.15);

    <script>
        (function() {
            'use strict';

            // ============================================================
            //  1. DATOS: 100 TÉCNICAS DE CUENTO CORTO
            // ============================================================

            const CATEGORIES = [{
                id: 'c1',
                icon: '📖',
                name: 'Estructura y forma',
                techniques: [
                    { id: 1, name: 'In media res', rhetoric: 'Estructura',
                        def: 'Comenzar la historia en medio de la acción, sin introducción previa, para capturar la atención del lector inmediatamente.',
                        example: 'El disparo resonó en el callejón mientras él corría, sin saber si la bala le había alcanzado.' },
                    { id: 2, name: 'Estructura circular', rhetoric: 'Estructura',
                        def: 'La historia comienza y termina en el mismo punto, creando una sensación de destino o de ciclo.',
                        example: 'El viajero llegó al pueblo al atardecer, y al atardecer, con el mismo polvo en los zapatos, decidió quedarse.' },
                    { id: 3, name: 'Marco narrativo', rhetoric: 'Estructura',
                        def: 'Una historia dentro de otra historia. El narrador principal introduce un relato secundario que contiene el núcleo de la narración.',
                        example: 'El viejo marinero, sentado en el muelle, comenzó a contar la historia de la isla que nadie podía encontrar.' },
                    { id: 4, name: 'Final abierto', rhetoric: 'Estructura',
                        def: 'El cuento termina sin resolver completamente el conflicto, dejando al lector con preguntas y posibilidades.',
                        example: 'Y el viento se llevó sus palabras, mientras ella miraba el horizonte sin saber si volvería a verlo.' },
                    { id: 5, name: 'Estructura de tres actos', rhetoric: 'Estructura',
                        def: 'El cuento se organiza en tres partes: planteamiento, nudo y desenlace. La estructura clásica del conflicto narrativo.',
                        example: 'El descubrimiento del secreto, la lucha por mantenerlo y, finalmente, la revelación que todo lo cambia.' },
                    { id: 6, name: 'Flashback', rhetoric: 'Temporal',
                        def: 'Un salto al pasado que revela información crucial para entender el presente de los personajes.',
                        example: 'La carta en el cajón lo transportó a aquel verano de 1985, cuando todo había empezado sin que él lo supiera.' },
                    { id: 7, name: 'Anacronía', rhetoric: 'Temporal',
                        def: 'Alteración del orden cronológico de los eventos, creando un efecto de misterio o de revelación gradual.',
                        example: 'El poema estaba fechado en 1923, pero ella lo había escrito aquella misma mañana.' },
                    { id: 8, name: 'Inicio con diálogo', rhetoric: 'Apertura',
                        def: 'Comenzar el cuento con una línea de diálogo que sumerge al lector directamente en la escena.',
                        example: '"No deberías haber venido", dijo ella, con los dedos aún temblorosos sobre el sobre.' },
                    { id: 9, name: 'Inicio con descripción', rhetoric: 'Apertura',
                        def: 'Abrir con una descripción detallada del escenario o de un personaje para establecer el tono y la atmósfera.',
                        example: 'La casa tenía una puerta que nunca se abría y una ventana que siempre miraba al mar.' },
                    { id: 10, name: 'Final con giro', rhetoric: 'Cierre',

                        example: 'Y entonces, al levantar la foto, descubrió que el hombre del espejo era él mismo, veinte años después.' }

            }, {
                id: 'c2',
                icon: '👤',
                name: 'Personajes',
                techniques: [
                    { id: 11, name: 'Personaje arquetípico', rhetoric: 'Caracterización',
                        def: 'Crear un personaje que encarna un arquetipo universal (el héroe, el mentor, el trickster, etc.) para que resuene con el lector.',

                    { id: 12, name: 'Personaje redondo', rhetoric: 'Caracterización',

                        example: 'El alcalde era un hombre justo, pero también un cobarde; amaba a su pueblo, pero temía a su propia sombra.' },
                    { id: 13, name: 'Personaje plano', rhetoric: 'Caracterización',

                    { id: 14, name: 'El narrador protagonista', rhetoric: 'Voz',

                    { id: 15, name: 'El narrador testigo', rhetoric: 'Voz',
                        def: 'El narrador es un personaje secundario que observa y cuenta la historia del protagonista.',

                    { id: 16, name: 'Narrador omnisciente', rhetoric: 'Voz',
                        def: 'El narrador lo sabe todo sobre los personajes y eventos, incluyendo sus pensamientos y sentimientos.',
                        example: 'Nadie en el pueblo sabía que el forastero había llegado para vengarse, pero el narrador lo sabía todo.' },
                    { id: 17, name: 'Narrador objetivo', rhetoric: 'Voz',
                        def: 'El narrador cuenta los eventos sin acceder a los pensamientos de los personajes, como una cámara.',

                    { id: 18, name: 'Diálogo como caracterización', rhetoric: 'Diálogo',
                        def: 'Revelar la personalidad de los personajes a través de sus palabras, su tono y su estilo de hablar.',

                    { id: 19, name: 'Acción como caracterización', rhetoric: 'Acción',

                    { id: 20, name: 'El personaje sin nombre', rhetoric: 'Anonimato',

                        example: 'El hombre del abrigo gris caminaba sin rumbo, mientras la mujer del paraguas rojo lo seguía a distancia.' }
                ]
            }, {
                id: 'c3',
                icon: '🌍',
                name: 'Ambientación y escenario',
                techniques: [
                    { id: 21, name: 'Ambientación atmosférica', rhetoric: 'Escenario',
                        def: 'Usar el entorno para establecer el tono emocional de la historia: misterio, alegría, tensión, melancolía.',
                        example: 'La niebla se arrastraba por el callejón como un fantasma que no encontraba su hogar.' },
                    { id: 22, name: 'Escenario como personaje', rhetoric: 'Escenario',
                        def: 'Tratar el escenario como un personaje más, con su propia personalidad y su influencia en la trama.',

                    { id: 23, name: 'Escenario mínimo', rhetoric: 'Economía',
                        def: 'Usar el mínimo de descripción escénica, dejando que el lector imagine el entorno para mantener el enfoque en los personajes.',

                    { id: 24, name: 'Contraste de escenarios', rhetoric: 'Contraste',
                        def: 'Crear un contraste entre diferentes espacios para reflejar el conflicto interno de los personajes.',

                    { id: 25, name: 'Escenario sensorial', rhetoric: 'Sensorial',
                        def: 'Apelar a los sentidos del lector para crear una experiencia inmersiva: olores, sonidos, texturas.',

                    { id: 26, name: 'El viaje como escenario', rhetoric: 'Itinerante',

                    { id: 27, name: 'Espacio interior', rhetoric: 'Psicológico',

                    { id: 28, name: 'Escenario urbano', rhetoric: 'Urbano',

                    { id: 30, name: 'Escenario onírico', rhetoric: 'Onírico',
                        def: 'Crear un escenario que parece un sueño, donde las reglas de la realidad no se aplican y todo es posible.',
                        example: 'El bosque era un laberinto de árboles que se movían, y las sombras bailaban al ritmo de una música invisible.' }
                ]
            }, {
                id: 'c4',
                icon: '🎯',
                name: 'Conflicto y trama',
                techniques: [
                    { id: 31, name: 'Conflicto externo', rhetoric: 'Conflicto',
                        def: 'El protagonista se enfrenta a fuerzas externas: otro personaje, la naturaleza, la sociedad, etc.',
                        example: 'El hombre y el mar. Una batalla silenciosa entre la voluntad y la furia del océano.' },
                    { id: 32, name: 'Conflicto interno', rhetoric: 'Conflicto',
                        def: 'El protagonista se enfrenta a sí mismo: sus miedos, sus deseos, sus contradicciones.',

                    { id: 33, name: 'Conflicto de valores', rhetoric: 'Conflicto',

                    { id: 34, name: 'Trama de búsqueda', rhetoric: 'Trama',

                    { id: 35, name: 'Trama de misterio', rhetoric: 'Trama',

                    { id: 36, name: 'Trama de transformación', rhetoric: 'Trama',

                    { id: 38, name: 'Trama de venganza', rhetoric: 'Trama',

                    { id: 39, name: 'Trama de amor prohibido', rhetoric: 'Trama',

                    { id: 40, name: 'Trama de supervivencia', rhetoric: 'Trama',

                ]
            }, {
                id: 'c5',
                icon: '✍️',
                name: 'Estilo y recursos',
                techniques: [
                    { id: 41, name: 'Estilo minimalista', rhetoric: 'Estilo',
                        def: 'Usar un lenguaje económico y preciso, eliminando todo lo superfluo para llegar al corazón de la historia.',
                        example: 'Era un día cualquiera. El café. El periódico. La carta que lo cambió todo.' },
                    { id: 42, name: 'Estilo lírico', rhetoric: 'Estilo',
                        def: 'Usar un lenguaje poético, con imágenes y metáforas que crean una atmósfera evocadora.',
                        example: 'El tiempo era una brisa que movía los recuerdos, y la vida, un susurro en el viento.' },
                    { id: 43, name: 'Estilo realista', rhetoric: 'Estilo',
                        def: 'Representar la realidad de manera verosímil, con detalles cotidianos y un lenguaje natural.',

                    { id: 44, name: 'Estilo fantástico', rhetoric: 'Estilo',
                        def: 'Introducir elementos sobrenaturales o imposibles en un mundo que, por lo demás, parece real.',

                    { id: 45, name: 'Estilo experimental', rhetoric: 'Estilo',
                        def: 'Romper las convenciones narrativas, jugando con la estructura, el lenguaje o el punto de vista.',

                    { id: 46, name: 'Uso de la metáfora', rhetoric: 'Recurso',

                    { id: 47, name: 'Uso del símil', rhetoric: 'Recurso',
                        def: 'Comparar dos elementos usando "como" para crear una imagen vívida y accesible.',
                        example: 'Las lágrimas corrían por su rostro como la lluvia sobre el cristal.' },
                    { id: 48, name: 'Uso de la personificación', rhetoric: 'Recurso',

                    { id: 49, name: 'Uso de la ironía', rhetoric: 'Recurso',
                        def: 'Decir una cosa y significar otra, creando un contraste entre lo que se dice y lo que se quiere decir.',
                        example: 'Claro que era feliz, pensó mientras miraba el mar desde el acantilado.' },
                    { id: 50, name: 'Uso del humor', rhetoric: 'Recurso',
                        def: 'Introducir el humor para aliviar la tensión, crear personajes entrañables o criticar la sociedad.',
                        example: 'El gato observaba la escena con una expresión que solo podía describirse como "yo ya te lo dije".' }
                ]
            }, {
                id: 'c6',
                icon: '⏳',
                name: 'Tiempo y ritmo',
                techniques: [
                    { id: 51, name: 'Ritmo rápido', rhetoric: 'Ritmo',
                        def: 'Usar oraciones cortas, diálogos rápidos y acción continua para crear una sensación de urgencia.',
                        example: 'Corrió. Saltó. El tren pasó. Un segundo más y no estaría aquí.' },
                    { id: 52, name: 'Ritmo lento', rhetoric: 'Ritmo',
                        def: 'Usar descripciones detalladas, oraciones largas y pausas para crear una atmósfera de reflexión o melancolía.',
                        example: 'El atardecer se deslizaba sobre el valle, llevándose la luz, dejando solo sombras.' },
                    { id: 53, name: 'Elipsis', rhetoric: 'Tiempo',
                        def: 'Saltar espacios de tiempo que no son relevantes para la historia, manteniendo el enfoque en los momentos clave.',

                    { id: 54, name: 'Sumario', rhetoric: 'Tiempo',
                        def: 'Resumir un período de tiempo en unas pocas líneas para avanzar la historia rápidamente.',
                        example: 'Tres meses después, el tren llegó a la estación y el viaje había terminado.' },
                    { id: 55, name: 'Escena', rhetoric: 'Tiempo',
                        def: 'Mostrar un momento en detalle, como si el tiempo se detuviera, para profundizar en una emoción o una acción.',
                        example: 'El segundo en que sus ojos se encontraron duró una eternidad.' },
                    { id: 56, name: 'Prolepsis', rhetoric: 'Tiempo',
                        def: 'Un salto al futuro para mostrar lo que va a ocurrir, creando expectativa o tensión.',

                    { id: 57, name: 'Ritmo de diálogo', rhetoric: 'Ritmo',
                        def: 'Alternar diálogo y narración para crear un ritmo dinámico que mantenga el interés del lector.',
                        example: '—¿Qué haces aquí? —preguntó él. —Lo mismo que tú —respondió ella, mirando al horizonte.' },
                    { id: 58, name: 'Pausa narrativa', rhetoric: 'Ritmo',
                        def: 'Detener la acción para describir un personaje, un objeto o un paisaje, creando un respiro en la narración.',
                        example: 'Se detuvo a mirar el mar, y en ese instante, el tiempo pareció detenerse con él.' },
                    { id: 59, name: 'Compresión temporal', rhetoric: 'Tiempo',
                        def: 'Comprimir un largo período de tiempo en una sola frase o párrafo, dando una sensación de paso del tiempo.',
                        example: 'La vida pasó por la ventana, mientras ella miraba el mundo desde su sillón.' },
                    { id: 60, name: 'Simultaneidad', rhetoric: 'Tiempo',
                        def: 'Mostrar eventos que ocurren al mismo tiempo, alternando entre ellos para crear tensión o contraste.',
                        example: 'Mientras él caminaba hacia el altar, ella corría por el andén del tren.' }
                ]
            }, {
                id: 'c7',
                icon: '🎨',
                name: 'Técnicas avanzadas',
                techniques: [
                    { id: 61, name: 'Realismo mágico', rhetoric: 'Género',

                    { id: 62, name: 'Microficción', rhetoric: 'Género',
                        def: 'Contar una historia en menos de 100 palabras, con la máxima economía y precisión.',

                    { id: 63, name: 'Cuento epistolar', rhetoric: 'Forma',
                        def: 'Contar la historia a través de cartas, diarios o documentos, creando una sensación de intimidad.',

                    { id: 64, name: 'Cuento con metaliteratura', rhetoric: 'Forma',
                        def: 'El cuento reflexiona sobre su propia condición de ficción, rompiendo la cuarta pared.',

                    { id: 65, name: 'Cuento con moraleja', rhetoric: 'Forma',

                    { id: 67, name: 'Cuento de amor', rhetoric: 'Género',

                    { id: 68, name: 'Cuento de aventura', rhetoric: 'Género',

                    { id: 69, name: 'Cuento de ciencia ficción', rhetoric: 'Género',

                    { id: 70, name: 'Cuento de fantasía', rhetoric: 'Género',
                        def: 'Crear mundos imaginarios con criaturas mágicas, héroes y batallas épicas.',
                        example: 'El dragón de la montaña guardaba el secreto del fuego eterno, y solo el joven héroe podía reclamarlo.' }
                ]
            }, {
                id: 'c8',

                name: 'Géneros y estilos de cuento',
                techniques: [
                    { id: 71, name: 'Cuento de hadas', rhetoric: 'Género',

                    { id: 72, name: 'Cuento de costumbres', rhetoric: 'Género',

                    { id: 73, name: 'Cuento policial', rhetoric: 'Género',

                    { id: 74, name: 'Cuento de personajes', rhetoric: 'Género',

                    { id: 75, name: 'Cuento de ideas', rhetoric: 'Género',

                    { id: 76, name: 'Cuento de animales', rhetoric: 'Género',

                    { id: 77, name: 'Cuento de humor', rhetoric: 'Género',
                        def: 'Usar el humor y la comedia para entretener, a menudo con personajes y situaciones absurdas.',

                    { id: 78, name: 'Cuento de amor imposible', rhetoric: 'Género',

                    { id: 80, name: 'Cuento de iniciación', rhetoric: 'Género',
                        def: 'Una historia sobre el paso de la infancia a la edad adulta, donde el protagonista aprende una lección sobre la vida.',
                        example: 'Aquella noche, el niño entendió que los monstruos no estaban debajo de la cama, sino dentro de las personas.' }
                ]
            }, {
                id: 'c9',
                icon: '🔍',
                name: 'Técnicas de escritura',
                techniques: [
                    { id: 81, name: 'Mostrar, no decir', rhetoric: 'Técnica',
                        def: 'En lugar de decirle al lector lo que un personaje siente, mostrarlo a través de acciones, diálogos y descripciones.',
                        example: 'En lugar de "estaba triste", mostrar: "Sus dedos rozaron la fotografía y se quedaron quietos, como si el tiempo se hubiera detenido".' },
                    { id: 82, name: 'Verbos fuertes', rhetoric: 'Técnica',
                        def: 'Usar verbos precisos y activos para dar energía y claridad a la narración.',

                    { id: 83, name: 'Evitar adjetivos vacíos', rhetoric: 'Técnica',
                        def: 'Usar adjetivos concretos y específicos en lugar de adjetivos vagos o genéricos.',
                        example: 'La niebla era "espesa y fría" en lugar de "era bonita".' },
                    { id: 84, name: 'Variedad sintáctica', rhetoric: 'Técnica',
                        def: 'Variar la longitud y la estructura de las frases para crear un ritmo natural y evitar la monotonía.',

                    { id: 85, name: 'Sugerir, no explicar', rhetoric: 'Técnica',

                    { id: 86, name: 'Comenzar con tensión', rhetoric: 'Técnica',

                    { id: 87, name: 'Terminar con resonancia', rhetoric: 'Técnica',
                        def: 'Cerrar el cuento con una imagen, una frase o una pregunta que quede resonando en la mente del lector.',

                    { id: 88, name: 'Uso del detalle significativo', rhetoric: 'Técnica',

                    { id: 89, name: 'Economía narrativa', rhetoric: 'Técnica',
                        def: 'Eliminar todo lo que no es esencial para la historia, manteniendo solo lo que avanza la trama o el personaje.',
                        example: 'El viaje era largo, pero no necesitaba contarlo; bastaba con saber que había llegado.' },

            // ============================================================
            //  2. ESTADO
            // ============================================================

            const STORAGE_KEY = 'fabula_cuento_100';

            function loadState() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) return JSON.parse(raw);
                } catch (_) { /* ignore */ }
                return { entries: {} };
            }

            function saveState() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
                } catch (_) { /* ignore */ }
            }

            let appState = loadState();

            // Inicializar técnicas
            CATEGORIES.forEach(cat => {
                cat.techniques.forEach(t => {
                    if (!appState.entries[t.id]) {
                        appState.entries[t.id] = { text: '', written: false, style: 'normal' };
                    }
                });
            });
            saveState();

            // ============================================================
            //  3. VOZ (Web Speech API)
            // ============================================================

            let speechSynth = window.speechSynthesis;
            let isSpeaking = false;
            let speakingId = null;
            const floatStopBtn = document.getElementById('floatStopBtn');

            function speakText(text, id, onStart, onEnd) {
                if (isSpeaking) {
                    speechSynth.cancel();
                    isSpeaking = false;
                    floatStopBtn.classList.remove('visible');
                    if (onEnd) onEnd();
                    setTimeout(() => speakText(text, id, onStart, onEnd), 100);
                    return;
                }

                const utterance = new SpeechSynthesisUtterance(text);
                const voices = speechSynth.getVoices();
                const esVoice = voices.find(v => v.lang.startsWith('es')) || voices[0];
                if (esVoice) utterance.voice = esVoice;
                utterance.lang = 'es-ES';
                utterance.rate = 0.85;
                utterance.pitch = 1;

                utterance.onstart = function() {
                    isSpeaking = true;
                    speakingId = id;
                    floatStopBtn.classList.add('visible');
                    if (onStart) onStart();
                    document.querySelectorAll(`.btn-speech[data-id="${id}"]`).forEach(b => b.classList.add('speaking'));
                    document.querySelectorAll(`.btn-speech-small[data-id="${id}"]`).forEach(b => b.classList.add(
                    'speaking'));
                };

                utterance.onend = function() {
                    isSpeaking = false;
                    speakingId = null;
                    floatStopBtn.classList.remove('visible');
                    if (onEnd) onEnd();
                    document.querySelectorAll('.btn-speech.speaking').forEach(b => b.classList.remove('speaking'));
                    document.querySelectorAll('.btn-speech-small.speaking').forEach(b => b.classList.remove('speaking'));
                };

                utterance.onerror = function() {
                    isSpeaking = false;
                    speakingId = null;
                    floatStopBtn.classList.remove('visible');
                    if (onEnd) onEnd();
                    document.querySelectorAll('.btn-speech.speaking').forEach(b => b.classList.remove('speaking'));
                    document.querySelectorAll('.btn-speech-small.speaking').forEach(b => b.classList.remove('speaking'));
                };

                speechSynth.speak(utterance);
            }

            function stopSpeaking() {
                if (isSpeaking) {
                    speechSynth.cancel();
                    isSpeaking = false;
                    speakingId = null;
                    floatStopBtn.classList.remove('visible');
                    document.querySelectorAll('.btn-speech.speaking').forEach(b => b.classList.remove('speaking'));
                    document.querySelectorAll('.btn-speech-small.speaking').forEach(b => b.classList.remove('speaking'));
                }
            }

            floatStopBtn.addEventListener('click', stopSpeaking);

            // ============================================================
            //  4. RENDER con búsqueda y filtros
            // ============================================================

            const accordionContainer = document.getElementById('accordionContainer');
            let searchTerm = '';
            let filterMode = 'all';

            function renderAll() {
                let html = '';
                let totalWritten = 0;
                let totalTechniques = 0;

                CATEGORIES.forEach((cat, idx) => {
                    let catWritten = 0;
                    let catFiltered = cat.techniques.filter(t => {
                        const e = appState.entries[t.id] || { text: '', written: false };
                        if (e.written) catWritten++;
                        const matchSearch = searchTerm === '' ||
                            t.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                            t.def.toLowerCase().includes(searchTerm.toLowerCase()) ||
                            t.example.toLowerCase().includes(searchTerm.toLowerCase()) ||
                            t.rhetoric.toLowerCase().includes(searchTerm.toLowerCase());
                        if (filterMode === 'written') return matchSearch && e.written;
                        if (filterMode === 'pending') return matchSearch && !e.written;
                        return matchSearch;
                    });

                    if (catFiltered.length === 0) return;

                    const isOpen = idx === 0 ? 'open' : '';
                    const arrowClass = isOpen ? 'open' : '';

                    html += `
                        <div class="category-item" data-cat="${cat.id}">
                            <div class="category-header" data-target="${cat.id}">

                                <span class="cat-title">${cat.name}</span>

                                <span class="cat-arrow ${arrowClass}">▾</span>
                            </div>
                            <div class="category-body ${isOpen}" id="body-${cat.id}">
                    `;

                    catFiltered.forEach(t => {
                        const e = appState.entries[t.id] || { text: '', written: false, style: 'normal' };
                        const isWritten = e.written || false;
                        const userText = e.text || '';
                        const style = e.style || 'normal';
                        const styleClass = getStyleClassFor(style);
                        totalTechniques++;
                        if (isWritten) totalWritten++;

                        html += `
                            <div class="tech-card" data-tech-id="${t.id}">

                                    <span class="tech-num">#${String(t.id).padStart(3, '0')}</span>

                                    <span class="tech-rhetoric">${t.rhetoric}</span>
                                    <span class="wax-seal ${isWritten ? 'active' : ''}" style="margin-left:auto;">
                                        <span class="seal-icon">${isWritten ? '🔴' : '○'}</span>
                                        ${isWritten ? 'sellada' : 'pendiente'}
                                    </span>
                                </div>

                                <div class="tech-def">${t.def}</div>

                                <div class="tech-example-box">
                                    <span class="example-text">“${t.example}”</span>
                                    <button class="btn-speech" data-id="${t.id}" data-text="${t.example.replace(/"/g, '')}">🔊</button>
                                </div>

                                <div class="tech-practice-area">
                                    <div class="practice-input-group">
                                        <textarea class="practice-text" data-id="${t.id}" placeholder="escribe tu cuento...">${userText}</textarea>
                                        <div class="practice-preview ${styleClass}" data-id="${t.id}">${userText || ''}</div>
                                    </div>
                                    <div class="tech-actions">
                                        <button class="btn-speech-small" data-id="${t.id}" data-text="${userText || t.example}" title="Escuchar mi cuento">🔊</button>
                                        <label>
                                            <input type="checkbox" class="written-check" data-id="${t.id}" ${isWritten ? 'checked' : ''} />
                                            escrito
                                        </label>
                                        <span class="wax-seal ${isWritten ? 'active' : ''}">
                                            <span class="seal-icon">${isWritten ? '🔴' : '○'}</span>
                                        </span>
                                    </div>
                                </div>

                                <div class="style-pills" data-target="${t.id}">
                                    <button class="style-pill ${style === 'normal' ? 'active' : ''}" data-style="normal" data-target="${t.id}">normal</button>
                                    <button class="style-pill ${style === 'spencerian' ? 'active' : ''}" data-style="spencerian" data-target="${t.id}">Spencerian <span class="pill-preview" style="font-family:'Great Vibes',cursive;">Aa</span></button>
                                    <button class="style-pill ${style === 'copperplate' ? 'active' : ''}" data-style="copperplate" data-target="${t.id}">Copperplate <span class="pill-preview" style="font-family:'Alex Brush',cursive;">Aa</span></button>
                                    <button class="style-pill ${style === 'chancery' ? 'active' : ''}" data-style="chancery" data-target="${t.id}">Chancery <span class="pill-preview" style="font-family:'Cedarville Cursive',cursive;">Aa</span></button>
                                    <button class="style-pill ${style === 'palmer' ? 'active' : ''}" data-style="palmer" data-target="${t.id}">Palmer <span class="pill-preview" style="font-family:'Dancing Script',cursive;">Aa</span></button>
                                </div>
                            </div>
                        `;
                    });

                    html += `</div></div>`;
                });

                accordionContainer.innerHTML = html;

                // Actualizar contadores
                document.getElementById('progressNum').textContent = totalWritten;
                document.getElementById('progressBadge').textContent = `${totalWritten}/100`;
                const pct = totalTechniques > 0 ? (totalWritten / totalTechniques) * 100 : 0;
                document.getElementById('progressFill').style.width = `${pct}%`;
                document.getElementById('sealDisplay').textContent = totalWritten === totalTechniques ? '🟢' :
                    totalWritten > 0 ? '🟡' : '⚪';

                // === EVENTOS ===

                // Acordeón
                document.querySelectorAll('.category-header').forEach(header => {
                    header.addEventListener('click', function() {
                        const target = this.dataset.target;
                        const body = document.getElementById(`body-${target}`);
                        const arrow = this.querySelector('.cat-arrow');
                        if (body) {
                            body.classList.toggle('open');
                            if (arrow) arrow.classList.toggle('open');
                        }
                    });
                });

                // Click en tarjeta → abrir modal
                document.querySelectorAll('.tech-card').forEach(card => {
                    card.addEventListener('click', function(e) {
                        // Si el clic fue en un botón o checkbox, no abrir modal
                        if (e.target.closest('button') || e.target.closest('input') || e.target.closest(
                                'label') || e.target.closest('.style-pill') || e.target.closest(
                                '.style-pills')) return;
                        const id = parseInt(this.dataset.techId);
                        openModal(id);
                    });
                });

                // Práctica (textarea)
                document.querySelectorAll('.practice-text').forEach(ta => {
                    ta.addEventListener('input', function() {
                        const id = parseInt(this.dataset.id);
                        const val = this.value;
                        if (!appState.entries[id]) appState.entries[id] = { text: '', written: false,
                            style: 'normal' };
                        appState.entries[id].text = val;
                        saveState();
                        const preview = document.querySelector(`.practice-preview[data-id="${id}"]`);
                        if (preview) {
                            preview.textContent = val || '';
                            const style = appState.entries[id].style || 'normal';
                            preview.className = `practice-preview ${getStyleClassFor(style)}`;
                        }
                        const btn = document.querySelector(`.btn-speech-small[data-id="${id}"]`);
                        if (btn) btn.dataset.text = val || '';
                    });
                });

                // Checkbox "escrito"
                document.querySelectorAll('.written-check').forEach(cb => {
                    cb.addEventListener('change', function() {
                        const id = parseInt(this.dataset.id);
                        const checked = this.checked;
                        if (!appState.entries[id]) appState.entries[id] = { text: '', written: false,
                            style: 'normal' };
                        appState.entries[id].written = checked;
                        saveState();
                        renderAll();
                        renderExercise();
                        renderQuiz();
                        // Actualizar modal si está abierto
                        if (modalOpen && modalId === id) {
                            updateModalContent(id);
                        }
                    });
                });

                // Botones de escuchar (ejemplo)
                document.querySelectorAll('.btn-speech').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = parseInt(this.dataset.id);
                        const text = this.dataset.text;
                        if (!text) return;
                        speakText(text, id);
                    });
                });

                // Botones de escuchar (texto del usuario)
                document.querySelectorAll('.btn-speech-small').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = parseInt(this.dataset.id);
                        let text = this.dataset.text;
                        if (!text || text.trim() === '') {
                            const exampleBtn = document.querySelector(`.btn-speech[data-id="${id}"]`);

                        speakText(text, id);

                document.querySelectorAll('.style-pill').forEach(pill => {

                        e.stopPropagation();

                        if (!appState.entries[targetId]) appState.entries[targetId] = { text: '',
                            written: false, style: 'normal' };
                        appState.entries[targetId].style = style;
                        saveState();
                        const preview = document.querySelector(`.practice-preview[data-id="${targetId}"]`);
                        if (preview) {
                            preview.className = `practice-preview ${getStyleClassFor(style)}`;
                        }
                        const parent = this.closest('.style-pills');
                        parent.querySelectorAll('.style-pill').forEach(p => p.classList.remove('active'));
                        this.classList.add('active');
                        // Actualizar modal si está abierto y coincide
                        if (modalOpen && modalId === targetId) {
                            updateModalContent(targetId);
                        }
                    });
                });

                saveState();
            }

            // ============================================================
            //  5. FUNCIONES DE ESTILO
            // ============================================================

            function getStyleClassFor(style) {
                switch (style) {
                    case 'spencerian':
                        return 'preview-spencerian';
                    case 'copperplate':
                        return 'preview-copperplate';
                    case 'chancery':
                        return 'preview-chancery';
                    case 'palmer':
                        return 'preview-palmer';
                    default:
                        return 'preview-normal';
                }
            }

            // ============================================================
            //  6. MODAL INTERACTIVO
            // ============================================================

            const modalOverlay = document.getElementById('modalOverlay');
            const modalClose = document.getElementById('modalClose');
            const modalBody = document.getElementById('modalBody');
            let modalOpen = false;
            let modalId = null;

                modalId = id;
                modalOpen = true;
                updateModalContent(id);
                modalOverlay.classList.add('open');
                document.body.style.overflow = 'hidden';

                const e = appState.entries[id] || { text: '', written: false, style: 'normal' };

                const userText = e.text || '';
                const style = e.style || 'normal';
                const styleClass = getStyleClassFor(style);

                modalBody.innerHTML = `
                    <div class="modal-head">

                        <span class="wax-seal-modal ${isWritten ? 'active' : ''}" style="margin-left:auto;">

                            ${isWritten ? 'sellada' : 'pendiente'}
                        </span>
                    </div>

                    <div class="modal-practice-area">

                            <button class="style-pill ${style === 'copperplate' ? 'active' : ''}" data-style="copperplate" data-target="${tech.id}">Copperplate <span class="pill-preview" style="font-family:'Alex Brush',cursive;">Aa</span></button>
                            <button class="style-pill ${style === 'chancery' ? 'active' : ''}" data-style="chancery" data-target="${tech.id}">Chancery <span class="pill-preview" style="font-family:'Cedarville Cursive',cursive;">Aa</span></button>
                            <button class="style-pill ${style === 'palmer' ? 'active' : ''}" data-style="palmer" data-target="${tech.id}">Palmer <span class="pill-preview" style="font-family:'Dancing Script',cursive;">Aa</span></button>
                        </div>
                        <div class="modal-preview ${styleClass}" id="modalPreview">${userText || ''}</div>

                            <input type="checkbox" id="modalWrittenCheck" ${isWritten ? 'checked' : ''} />
                            escrito
                        </label>
                        <span class="wax-seal-modal ${isWritten ? 'active' : ''}">
                            <span class="seal-icon">${isWritten ? '🔴' : '○'}</span>
                            ${isWritten ? 'sellado' : 'sin sello'}
                        </span>
                    </div>
                `;

                // Eventos del modal
                const modalTextarea = document.getElementById('modalPracticeText');
                const modalPreview = document.getElementById('modalPreview');

                // Textarea → actualizar previsualización y estado
                modalTextarea.addEventListener('input', function() {
                    const val = this.value;

                        style: 'normal' };

                    saveState();
                    if (modalPreview) {
                        modalPreview.textContent = val || '';
                        const style = appState.entries[id].style || 'normal';

                    }
                    // Actualizar tarjeta en el listado
                    const cardPreview = document.querySelector(`.practice-preview[data-id="${id}"]`);

                        cardPreview.textContent = val || '';

                    if (speakBtn) speakBtn.dataset.text = val || '';

                    pill.addEventListener('click', function() {

                        style: 'normal' };
                    appState.entries[id].text = val;

                    const cardPreview = document.querySelector(`.practice-preview[data-id="${id}"]`);
