<!-- ============================================================
     COMPONENTE: GAMIFICACIÓN (Barra lateral mejorada)
     ============================================================ -->
<div class="sidebar-progress" id="gamificacion-panel">
    <div class="d-flex justify-content-between">
        <span class="label"><i class="bi bi-trophy"></i> Nivel</span>
        <span class="porcentaje" id="nivel-usuario">🌱 Novato</span>
    </div>
    <div class="text-center my-2">
        <span style="font-size:2.5rem;" id="nivel-icono">🌱</span>
        <div class="small text-muted" id="nivel-titulo">Novato</div>
    </div>
    <div class="d-flex justify-content-between">
        <span class="label">Puntos</span>
        <span class="porcentaje" id="puntos-usuario">0</span>
    </div>
    <div class="d-flex justify-content-between">
        <span class="label">🔥 Racha</span>
        <span class="porcentaje" id="racha-usuario">0 días</span>
    </div>
    <div class="d-flex justify-content-between">
        <span class="label">📚 Completadas</span>
        <span class="porcentaje" id="tecnicas-usuario">0 / 100</span>
    </div>
    <div class="progress mt-2">
        <div class="progress-bar" id="nivel-progreso" style="width:0%"></div>
    </div>
    <div class="small text-muted text-center mt-1" id="progreso-nivel">
        0 / 100 puntos para siguiente nivel
    </div>
    <!-- Logros recientes -->
    <div id="logros-recientes" class="mt-2"></div>
</div>
