<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📜 CÓDICE EPISTOLAR · 100 técnicas de carta manuscrita</title>

    <!-- Google Fonts para estilo medieval -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Uncial+Antiqua&family=EB+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Cinzel:wght@400;600;700&family=Great+Vibes&family=Alex+Brush&family=Cedarville+Cursive&family=Dancing+Script:wght@400..700&display=swap" rel="stylesheet" />

    <style>
        /* ============================================================
           BASE · ESTILO PERGAMINO Y ESCRITURA MEDIEVAL
           ============================================================ */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --pergamino: #f2e6d0;
            --pergamino-dark: #dcc9ae;
            --pergamino-light: #faf3e6;
            --pergamino-marca: #c9b18a;
            --tinta: #2c1810;
            --tinta-clara: #5a3d2e;
            --tinta-gris: #8a7a6a;
            --oro: #c9a84c;
            --oro-light: #e8d5a3;
            --oro-dark: #a8892b;
            --rubi: #8b1a2b;
            --rubi-light: #b84a5a;
            --borde-deco: #b8956a;
            --sombra: rgba(44, 24, 16, 0.2);
            --font-uncial: 'Uncial Antiqua', 'MedievalSharp', cursive;
            --font-serif: 'EB Garamond', 'Times New Roman', serif;
            --font-cinzel: 'Cinzel', serif;
            --font-spencerian: 'Great Vibes', cursive;
            --font-copperplate: 'Alex Brush', cursive;
            --font-chancery: 'Cedarville Cursive', cursive;
            --font-palmer: 'Dancing Script', cursive;
        }

        body {
            font-family: var(--font-serif);
            background: #d6c8b2;
            background-image:
                radial-gradient(ellipse at 20% 30%, #e8dccc 0%, transparent 60%),
                radial-gradient(ellipse at 80% 70%, #dacdbd 0%, transparent 50%),
                repeating-linear-gradient(45deg, rgba(44, 24, 16, 0.02) 0px, rgba(44, 24, 16, 0.02) 2px, transparent 2px, transparent 10px);
            min-height: 100vh;
            padding: 0.8rem;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            color: var(--tinta);
        }

        /* ── Contenedor principal ── */
        .codex {
            max-width: 1200px;
            width: 100%;
            background: var(--pergamino-light);
            background-image:
                linear-gradient(0deg, rgba(212, 185, 150, 0.12) 0%, transparent 15%, transparent 85%, rgba(212, 185, 150, 0.08) 100%),
                repeating-linear-gradient(0deg, transparent, transparent 29px, rgba(160, 130, 100, 0.04) 29px, rgba(160, 130, 100, 0.04) 30px);
            border-radius: 12px;
            box-shadow:
                0 4px 40px rgba(44, 24, 16, 0.25),
                inset 0 0 80px rgba(200, 170, 130, 0.12),
                0 0 0 1px var(--oro-dark),
                0 0 0 3px var(--pergamino-dark),
                0 0 0 4px var(--oro);
            padding: 1.8rem 1.8rem 1.2rem;
            position: relative;
        }

        .codex::before {
            content: '';
            position: absolute;
            inset: 6px;
            border: 1px solid rgba(201, 168, 76, 0.2);
            border-radius: 8px;
            pointer-events: none;
        }

        .codex::after {
            content: '✧ ✧ ✧';
            position: absolute;
            bottom: -12px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--oro);
            font-size: 0.8rem;
            letter-spacing: 8px;
            background: var(--pergamino-light);
            padding: 0 1.2rem;
            font-family: var(--font-uncial);
            text-shadow: 0 0 6px rgba(201, 168, 76, 0.15);
        }

        /* ============================================================
           ENCABEZADO
           ============================================================ */

        .app-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem 1rem;
            margin-bottom: 1rem;
            padding-bottom: 0.6rem;
            border-bottom: 2px solid var(--oro-light);
            position: relative;
        }

        .app-header h1 {
            font-family: var(--font-uncial);
            font-weight: 700;
            font-size: 1.8rem;
            color: var(--rubi);
            text-shadow: 0 1px 4px rgba(139, 26, 43, 0.08);
            letter-spacing: 0.04em;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .app-header h1 small {
            font-family: var(--font-serif);
            font-size: 0.7rem;
            font-weight: 400;
            color: var(--tinta-clara);
            opacity: 0.5;
            letter-spacing: 0.06em;
        }

        .app-header .header-actions {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        .btn-pergamino {
            font-family: var(--font-uncial);
            font-size: 0.7rem;
            padding: 0.3rem 1.2rem;
            border-radius: 30px;
            border: 1px solid var(--oro-light);
            background: transparent;
            color: var(--tinta-clara);
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 0.04em;
        }

        .btn-pergamino:hover {
            background: rgba(201, 168, 76, 0.08);
            border-color: var(--oro);
            color: var(--rubi);
            box-shadow: 0 0 20px rgba(201, 168, 76, 0.05);
        }

        .btn-pergamino.primary {
            background: rgba(139, 26, 43, 0.04);
            border-color: var(--rubi-light);
            color: var(--rubi);
        }

        .btn-pergamino.primary:hover {
            background: rgba(139, 26, 43, 0.08);
            border-color: var(--rubi);
        }

        .btn-pergamino.gold {
            background: rgba(201, 168, 76, 0.08);
            border-color: var(--oro);
            color: var(--oro-dark);
        }

        .btn-pergamino.gold:hover {
            background: rgba(201, 168, 76, 0.15);
        }

        /* ============================================================
           PESTAÑAS
           ============================================================ */

        .tab-bar {
            display: flex;
            gap: 0.1rem;
            border-bottom: 2px solid var(--oro-light);
            margin-bottom: 1.2rem;
            padding-bottom: 0.1rem;
        }

        .tab-btn {
            font-family: var(--font-uncial);
            font-size: 0.8rem;
            padding: 0.4rem 1.6rem 0.35rem;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            color: var(--tinta-gris);
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 0.04em;
        }

        .tab-btn:hover {
            color: var(--tinta-clara);
            background: rgba(201, 168, 76, 0.03);
        }

        .tab-btn.active {
            color: var(--rubi);
            border-bottom-color: var(--oro);
            background: rgba(201, 168, 76, 0.03);
        }

        .tab-btn .badge-progress {
            display: inline-block;
            font-family: var(--font-serif);
            font-size: 0.55rem;
            background: var(--oro-light);
            color: var(--tinta);
            border-radius: 30px;
            padding: 0.02rem 0.5rem;
            margin-left: 0.2rem;
            font-weight: 600;
            vertical-align: middle;
            line-height: 1.4;
        }

        .tab-pane {
            display: none;
            animation: fadeIn 0.35s ease;
        }

        .tab-pane.active {
            display: block;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(6px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============================================================
           PROGRESO
           ============================================================ */

        .progress-summary {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.4rem 1rem;
            background: rgba(201, 168, 76, 0.04);
            border-radius: 8px;
            border: 1px solid rgba(201, 168, 76, 0.08);
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .progress-summary .progress-bar-bg {
            flex: 1;
            min-width: 80px;
            height: 8px;
            background: rgba(184, 149, 106, 0.12);
            border-radius: 30px;
            overflow: hidden;
            border: 1px solid rgba(201, 168, 76, 0.06);
        }

        .progress-summary .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--oro-light), var(--oro), var(--oro-dark));
            border-radius: 30px;
            transition: width 0.5s ease;
        }

        .progress-summary .progress-text {
            font-family: var(--font-uncial);
            font-size: 0.75rem;
            color: var(--tinta-clara);
            white-space: nowrap;
        }

        .progress-summary .progress-text strong {
            color: var(--rubi);
            font-family: var(--font-serif);
        }

        /* ============================================================
           ACORDEÓN DE TÉCNICAS
           ============================================================ */

        .category-accordion {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            max-height: 540px;
            overflow-y: auto;
            padding-right: 0.3rem;
        }

        .category-accordion::-webkit-scrollbar {
            width: 5px;
        }
        .category-accordion::-webkit-scrollbar-track {
            background: var(--pergamino);
            border-radius: 30px;
        }
        .category-accordion::-webkit-scrollbar-thumb {
            background: var(--oro);
            border-radius: 30px;
        }

        .category-item {
            border: 1px solid rgba(184, 149, 106, 0.2);
            border-radius: 8px;
            background: rgba(252, 246, 235, 0.3);
            overflow: hidden;
            transition: all 0.25s;
        }

        .category-item:hover {
            border-color: rgba(201, 168, 76, 0.25);
            box-shadow: 0 2px 12px rgba(201, 168, 76, 0.04);
        }

        .category-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.8rem;
            cursor: pointer;
            background: rgba(252, 246, 235, 0.2);
            transition: background 0.2s;
            user-select: none;
            flex-wrap: wrap;
        }

        .category-header:hover {
            background: rgba(201, 168, 76, 0.03);
        }

        .category-header .cat-icon {
            font-size: 1.2rem;
            color: var(--oro);
            width: 2rem;
            text-align: center;
        }

        .category-header .cat-title {
            font-family: var(--font-uncial);
            font-weight: 600;
            font-size: 0.8rem;
            color: var(--tinta);
            flex: 1;
            letter-spacing: 0.02em;
        }

        .category-header .cat-count {
            font-size: 0.6rem;
            color: var(--tinta-gris);
            background: rgba(201, 168, 76, 0.06);
            padding: 0.02rem 0.6rem;
            border-radius: 30px;
            font-family: var(--font-serif);
            font-weight: 600;
        }

        .category-header .cat-arrow {
            color: var(--oro-dark);
            font-size: 0.6rem;
            transition: transform 0.3s;
            margin-left: 0.1rem;
        }

        .category-header .cat-arrow.open {
            transform: rotate(180deg);
        }

        .category-body {
            padding: 0 0.8rem 0.8rem;
            display: none;
            border-top: 1px solid rgba(184, 149, 106, 0.1);
            padding-top: 0.5rem;
        }

        .category-body.open {
            display: block;
        }

        /* ============================================================
           TARJETA DE TÉCNICA
           ============================================================ */

        .tech-card {
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
            padding: 0.4rem 0.6rem;
            margin-bottom: 0.25rem;
            border-radius: 6px;
            border-left: 3px solid var(--oro-light);
            background: rgba(252, 246, 235, 0.2);
            transition: background 0.2s;
        }

        .tech-card:hover {
            background: rgba(252, 246, 235, 0.6);
        }

        .tech-card .tech-head {
            display: flex;
            align-items: baseline;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        .tech-card .tech-num {
            font-family: var(--font-uncial);
            font-size: 0.55rem;
            color: var(--oro-dark);
            min-width: 2.2rem;
            font-weight: 600;
        }

        .tech-card .tech-name {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--tinta);
            font-family: var(--font-serif);
        }

        .tech-card .tech-rhetoric {
            font-size: 0.55rem;
            background: rgba(201, 168, 76, 0.08);
            padding: 0.02rem 0.5rem;
            border-radius: 30px;
            color: var(--rubi);
            font-style: italic;
            font-weight: 500;
            border: 1px solid rgba(201, 168, 76, 0.06);
        }

        .tech-card .tech-def {
            font-size: 0.8rem;
            color: var(--tinta-clara);
            line-height: 1.5;
            margin: 0.05rem 0 0.05rem;
            padding-left: 0.1rem;
        }

        .tech-card .tech-example-box {
            font-size: 0.75rem;
            color: var(--tinta-clara);
            font-style: italic;
            background: rgba(201, 168, 76, 0.03);
            padding: 0.15rem 0.6rem;
            border-radius: 4px;
            border-left: 2px solid var(--oro-light);
            margin: 0.05rem 0 0.1rem;
            line-height: 1.6;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.3rem;
        }

        .tech-card .tech-example-box .example-text {
            flex: 1;
            min-width: 120px;
        }

        .tech-card .tech-example-box .btn-speech {
            font-family: var(--font-uncial);
            font-size: 0.5rem;
            padding: 0.05rem 0.5rem;
            border-radius: 30px;
            border: 1px solid rgba(201, 168, 76, 0.15);
            background: transparent;
            color: var(--tinta-gris);
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.1rem;
            white-space: nowrap;
        }

        .tech-card .tech-example-box .btn-speech:hover {
            background: rgba(201, 168, 76, 0.06);
            border-color: var(--oro);
            color: var(--rubi);
        }

        .tech-card .tech-example-box .btn-speech.speaking {
            color: var(--rubi);
            border-color: var(--rubi-light);
            background: rgba(139, 26, 43, 0.04);
        }

        .tech-card .tech-practice-area {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 0.3rem 0.6rem;
            margin-top: 0.1rem;
            padding-top: 0.2rem;
            border-top: 1px dashed rgba(184, 149, 106, 0.15);
        }

        .tech-card .tech-practice-area .practice-input-group {
            flex: 1;
            min-width: 160px;
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
        }

        .tech-card .tech-practice-area .practice-input-group textarea {
            width: 100%;
            background: rgba(252, 246, 235, 0.4);
            border: 1px solid rgba(184, 149, 106, 0.15);
            border-radius: 4px;
            padding: 0.2rem 0.5rem;
            font-family: var(--font-serif);
            font-size: 0.75rem;
            color: var(--tinta);
            resize: vertical;
            min-height: 32px;
            transition: border-color 0.3s;
        }

        .tech-card .tech-practice-area .practice-input-group textarea:focus {
            border-color: var(--oro);
            outline: none;
            box-shadow: 0 0 0 2px rgba(201, 168, 76, 0.06);
        }

        .tech-card .tech-practice-area .practice-input-group .practice-preview {
            font-size: 0.8rem;
            padding: 0.1rem 0.3rem;
            min-height: 1.4rem;
            color: var(--tinta-clara);
            border-bottom: 1px solid rgba(184, 149, 106, 0.08);
            line-height: 1.6;
            word-break: break-word;
            transition: all 0.15s;
            opacity: 0.6;
            font-style: italic;
        }

        .tech-card .tech-practice-area .practice-input-group .practice-preview:empty::before {
            content: 'tu carta aparecerá aquí...';
            color: var(--tinta-gris);
            opacity: 0.2;
            font-size: 0.6rem;
            font-style: italic;
        }

        /* Estilos de caligrafía para previsualización */
        .preview-spencerian {
            font-family: var(--font-spencerian);
            font-style: normal;
            opacity: 1;
        }
        .preview-copperplate {
            font-family: var(--font-copperplate);
            font-style: normal;
            opacity: 1;
        }
        .preview-chancery {
            font-family: var(--font-chancery);
            font-style: normal;
            opacity: 1;
        }
        .preview-palmer {
            font-family: var(--font-palmer);
            font-style: normal;
            opacity: 1;
        }
        .preview-normal {
            font-family: var(--font-serif);
            font-style: italic;
            opacity: 0.6;
        }

        .tech-card .tech-practice-area .tech-actions {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            flex-wrap: wrap;
            padding-top: 0.1rem;
        }

        .tech-card .tech-practice-area .tech-actions .btn-speech-small {
            font-family: var(--font-uncial);
            font-size: 0.45rem;
            padding: 0.04rem 0.4rem;
            border-radius: 30px;
            border: 1px solid rgba(184, 149, 106, 0.1);
            background: transparent;
            color: var(--tinta-gris);
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.05rem;
        }

        .tech-card .tech-practice-area .tech-actions .btn-speech-small:hover {
            background: rgba(201, 168, 76, 0.04);
            border-color: var(--oro);
            color: var(--rubi);
        }

        .tech-card .tech-practice-area .tech-actions .btn-speech-small.speaking {
            color: var(--rubi);
            border-color: var(--rubi-light);
        }

        .tech-card .tech-practice-area .tech-actions label {
            display: flex;
            align-items: center;
            gap: 0.15rem;
            font-size: 0.55rem;
            color: var(--tinta-gris);
            cursor: pointer;
            font-family: var(--font-serif);
        }

        .tech-card .tech-practice-area .tech-actions input[type="checkbox"] {
            appearance: none;
            width: 0.9rem;
            height: 0.9rem;
            border: 2px solid var(--oro-dark);
            border-radius: 3px;
            cursor: pointer;
            background: var(--pergamino-light);
            transition: all 0.15s;
            position: relative;
            flex-shrink: 0;
        }

        .tech-card .tech-practice-area .tech-actions input[type="checkbox"]:checked {
            background: var(--oro);
            border-color: var(--oro);
        }

        .tech-card .tech-practice-area .tech-actions input[type="checkbox"]:checked::after {
            content: '✓';
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--pergamino-light);
            font-size: 0.6rem;
            font-weight: 700;
        }

        .tech-card .tech-practice-area .tech-actions .wax-seal {
            display: inline-flex;
            align-items: center;
            gap: 0.1rem;
            font-size: 0.5rem;
            color: var(--rubi);
            font-weight: 600;
            font-family: var(--font-uncial);
            letter-spacing: 0.04em;
            opacity: 0.3;
            transition: opacity 0.3s;
        }

        .tech-card .tech-practice-area .tech-actions .wax-seal.active {
            opacity: 1;
            color: var(--rubi);
        }

        .tech-card .tech-practice-area .tech-actions .wax-seal .seal-icon {
            font-size: 0.8rem;
            filter: drop-shadow(0 1px 3px rgba(139, 26, 43, 0.1));
        }

        /* ============================================================
           PASTILLAS DE ESTILO (caligrafía)
           ============================================================ */

        .style-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 0.1rem;
            margin: 0.15rem 0 0.05rem;
            padding: 0.1rem 0.2rem;
            background: rgba(252, 246, 235, 0.2);
            border-radius: 30px;
            border: 1px solid rgba(184, 149, 106, 0.06);
        }

        .style-pill {
            font-family: var(--font-uncial);
            font-size: 0.4rem;
            padding: 0.04rem 0.4rem;
            border-radius: 30px;
            border: 1px solid rgba(184, 149, 106, 0.06);
            background: transparent;
            color: var(--tinta-gris);
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 400;
            letter-spacing: 0.02em;
        }

        .style-pill:hover {
            background: rgba(201, 168, 76, 0.03);
            border-color: rgba(201, 168, 76, 0.1);
            color: var(--tinta-clara);
        }

        .style-pill.active {
            background: rgba(201, 168, 76, 0.06);
            border-color: var(--oro);
            color: var(--rubi);
        }

        .style-pill .pill-preview {
            display: inline-block;
            font-size: 0.6rem;
            margin-left: 0.05rem;
            opacity: 0.3;
        }

        .style-pill.active .pill-preview {
            opacity: 1;
        }

        /* ============================================================
           EJERCICIOS INTERACTIVOS
           ============================================================ */

        .exercise-section {
            background: rgba(252, 246, 235, 0.3);
            border: 1px solid rgba(201, 168, 76, 0.1);
            border-radius: 8px;
            padding: 1rem 1.2rem;
            margin-top: 1rem;
        }

        .exercise-section h3 {
            font-family: var(--font-uncial);
            font-size: 0.9rem;
            color: var(--rubi);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .exercise-section .exercise-prompt {
            font-size: 0.85rem;
            color: var(--tinta-clara);
            margin-bottom: 0.4rem;
            line-height: 1.6;
        }

        .exercise-section .exercise-input {
            width: 100%;
            background: rgba(252, 246, 235, 0.4);
            border: 1px solid rgba(184, 149, 106, 0.15);
            border-radius: 4px;
            padding: 0.4rem 0.6rem;
            font-family: var(--font-serif);
            font-size: 0.8rem;
            color: var(--tinta);
            resize: vertical;
            min-height: 60px;
            transition: border-color 0.3s;
        }

        .exercise-section .exercise-input:focus {
            border-color: var(--oro);
            outline: none;
            box-shadow: 0 0 0 2px rgba(201, 168, 76, 0.06);
        }

        .exercise-section .exercise-actions {
            display: flex;
            gap: 0.4rem;
            margin-top: 0.4rem;
            flex-wrap: wrap;
        }

        .exercise-section .exercise-actions .btn-exercise {
            font-family: var(--font-uncial);
            font-size: 0.6rem;
            padding: 0.2rem 1rem;

    <script>
        (function() {
            'use strict';

            // ============================================================
            //  1. DATOS: 100 TÉCNICAS DEL GÉNERO EPISTOLAR
            // ============================================================

            const CATEGORIES = [{
                id: 'e1',
                icon: '✧',
                name: 'Apertura · el saludo',
                techniques: [
                    { id: 1, name: 'El saludo clásico', rhetoric: 'Fórmula de cortesía',
                        def: 'Iniciar la carta con una fórmula de cortesía tradicional que establece el tono.',
                        example: 'Muy señor mío: reciba el saludo de quien le guarda afecto y lealtad.' },
                    { id: 2, name: 'El saludo íntimo', rhetoric: 'Confidencial',
                        def: 'Usar un saludo cercano que refleje la relación personal con el destinatario.',
                        example: 'Querido amigo, cuánto tiempo sin saber de ti. Aquí, el viento sigue trayendo noticias del mar.' },
                    { id: 3, name: 'El saludo geográfico', rhetoric: 'Topográfico',
                        def: 'Abrir con una referencia al lugar desde donde se escribe.',
                        example: 'Desde este rincón de la biblioteca, donde el polvo de los libros se mezcla con el olor a incienso, te escribo.' },
                    { id: 4, name: 'El saludo temporal', rhetoric: 'Cronológico',
                        def: 'Iniciar con una referencia al momento del día o la estación.',
                        example: 'Al atardecer, cuando las sombras se alargan y el silencio se vuelve cómplice, tomo la pluma para escribirte.' },
                    { id: 5, name: 'El saludo por el clima', rhetoric: 'Sensorial',
                        def: 'Hablar del tiempo como preludio de la conversación.',
                        example: 'La lluvia golpea la ventana mientras te escribo. El olor a tierra mojada me trae recuerdos de nuestros paseos.' },
                    { id: 6, name: 'El saludo con pregunta', rhetoric: 'Interrogativo',
                        def: 'Abrir con una pregunta que invite al diálogo y a la reflexión.',
                        example: '¿Cómo se vive en el otro lado del mundo cuando aquí el tiempo parece detenerse?' },
                    { id: 7, name: 'El saludo por el objeto', rhetoric: 'Metonímico',
                        def: 'Comenzar mencionando un objeto que conecta al escritor con el lector.',
                        example: 'El tintero de plata que me regalaste sigue lleno de tinta; cada vez que lo veo, pienso en ti.' },
                    { id: 8, name: 'El saludo por el destinatario', rhetoric: 'Apóstrofe',
                        def: 'Dirigirse directamente al destinatario con una invocación personal.',
                        example: 'A ti, que has recorrido los caminos del mundo y vuelves siempre al mismo puerto, te escribo estas líneas.' },
                    { id: 9, name: 'El saludo por el estado de ánimo', rhetoric: 'Confesional',
                        def: 'Abrir declarando el estado de ánimo del escritor.',
                        example: 'Con el alma inquieta y la pluma temblorosa, me siento a escribirte esta carta.' },
                    { id: 10, name: 'El saludo por el silencio', rhetoric: 'Elíptico',
                        def: 'Comenzar reconociendo el tiempo transcurrido sin escribir.',
                        example: 'Han pasado meses desde mi última carta. El silencio se ha vuelto demasiado largo, y necesito romperlo.' }
                ]
            }, {
                id: 'e2',
                icon: '✧',
                name: 'Cuerpo · la narración',
                techniques: [
                    { id: 11, name: 'La anécdota cotidiana', rhetoric: 'Narrativa',
                        def: 'Contar una pequeña historia de la vida diaria que ilustra un sentimiento.',
                        example: 'Ayer, mientras compraba pan, vi a un anciano que alimentaba a las palomas. Me recordó la última vez que estuvimos juntos.' },
                    { id: 12, name: 'La reflexión filosófica', rhetoric: 'Meditativa',
                        def: 'Compartir una reflexión profunda sobre la vida, el amor o el destino.',
                        example: 'He llegado a pensar que el tiempo no es una línea recta, sino un círculo. Todo vuelve, y nosotros somos los testigos.' },
                    { id: 13, name: 'La descripción del paisaje', rhetoric: 'Topográfica',
                        def: 'Describir un lugar con detalle, compartiendo la experiencia sensorial.',
                        example: 'El jardín está cubierto de niebla. Los árboles son fantasmas grises, y las flores, manchas de color en la penumbra.' },
                    { id: 14, name: 'La confesión íntima', rhetoric: 'Confesional',
                        def: 'Revelar un pensamiento o sentimiento que no se ha compartido antes.',
                        example: 'Hay una verdad que nunca te he dicho: aquel verano, cuando el mar nos separó, yo ya sabía que te amaba.' },
                    { id: 15, name: 'La pregunta retórica', rhetoric: 'Interrogativa',
                        def: 'Incluir preguntas que invitan a la reflexión más que a la respuesta.',
                        example: '¿Qué es la vida sino una carta que escribimos con cada día, cada gesto, cada palabra?' },
                    { id: 16, name: 'La cita literaria', rhetoric: 'Citación',
                        def: 'Incluir una cita de un libro o autor que resuena con el momento.',
                        example: 'Como dijo Shakespeare: "El amor no mira con los ojos, sino con el alma". Y yo, alma mía, te veo.' },
                    { id: 17, name: 'La noticia del día', rhetoric: 'Informativa',
                        def: 'Compartir una noticia relevante para el destinatario.',
                        example: 'Te escribo para contarte que he recibido la oferta de trabajo en la ciudad. Es la oportunidad que esperaba.' },
                    { id: 18, name: 'El recuerdo compartido', rhetoric: 'Memorialista',
                        def: 'Evocar un recuerdo que ambos comparten y que los une.',
                        example: '¿Recuerdas aquella tarde en la plaza, cuando el sol se ponía y las campanas doblaban a la hora? Yo sí. La recuerdo como si fuera hoy.' },
                    { id: 19, name: 'La reflexión sobre el tiempo', rhetoric: 'Temporal',
                        def: 'Meditar sobre el paso del tiempo y su efecto en la relación.',
                        example: 'El tiempo, ese forjador de ausencias, no ha hecho sino agrandar la distancia que nos separa. Pero la palabra lo acorta.' },
                    { id: 20, name: 'El deseo expresado', rhetoric: 'Deseante',
                        def: 'Expresar un deseo concreto para el destinatario o para el futuro.',
                        example: 'Deseo que el viento te lleve mis palabras y que el mar te devuelva la paz que un día te robé.' }
                ]
            }, {
                id: 'e3',
                icon: '✧',
                name: 'Cuerpo · la emoción',
                techniques: [
                    { id: 21, name: 'La declaración de amor', rhetoric: 'Apasionada',
                        def: 'Expresar el amor con palabras que transmitan intensidad y sinceridad.',
                        example: 'Te amo como el navegante ama la estrella que lo guía: sin saber si existe, pero confiando en su luz.' },
                    { id: 22, name: 'La confesión del miedo', rhetoric: 'Vulnerable',
                        def: 'Revelar un miedo que habita en el corazón del escritor.',
                        example: 'Temo que esta carta sea la última, que el silencio se trague mis palabras y que te olvides de mi voz.' },
                    { id: 23, name: 'La expresión de la gratitud', rhetoric: 'Agradecida',
                        def: 'Agradecer a la otra persona por su presencia o sus actos.',
                        example: 'Gracias por la luz que has sembrado en mis días oscuros. No hay palabra que pague ese regalo.' },
                    { id: 24, name: 'El lamento por la distancia', rhetoric: 'Elegíaca',
                        def: 'Expresar la tristeza por la separación y el deseo de reencuentro.',
                        example: 'La distancia es un puente demasiado largo, y yo, desde esta orilla, solo puedo enviarte palabras de humo.' },
                    { id: 25, name: 'La esperanza compartida', rhetoric: 'Optimista',
                        def: 'Compartir una esperanza que sostiene al escritor.',
                        example: 'Espero que estas palabras te encuentren bien, que la vida te sonría y que el viento te traiga mis abrazos.' },
                    { id: 26, name: 'La ironía elegante', rhetoric: 'Irónica',
                        def: 'Usar la ironía con sutileza para expresar un sentimiento complejo.',
                        example: 'Claro que todo está bien. Las cartas son solo eso, papel y tinta, y la vida sigue su curso ajeno a nosotros.' },
                    { id: 27, name: 'La metáfora del viaje', rhetoric: 'Metafórica',
                        def: 'Comparar la vida o la relación con un viaje, una travesía.',
                        example: 'La vida es un océano de tinta, y cada carta una isla donde nos encontramos y nos perdemos.' },
                    { id: 28, name: 'La memoria del tacto', rhetoric: 'Táctil',
                        def: 'Evocar una sensación física compartida en el pasado.',
                        example: 'Aún siento el calor de tu mano en la mía, aquella noche que el frío nos unió más que las palabras.' },
                    { id: 29, name: 'La promesa', rhetoric: 'Comprometida',
                        def: 'Hacer una promesa que da fuerza a la relación epistolar.',
                        example: 'Te prometo que, aunque los años pasen y las cartas se desvanezcan, mi recuerdo de ti será eterno.' },
                    { id: 30, name: 'La despedida emocional', rhetoric: 'Catártica',
                        def: 'Expresar la emoción de tener que despedirse por escrito.',
                        example: 'Y al cerrar esta carta, siento el peso de la despedida como una piedra en el pecho. Pero las palabras, como las olas, vuelven.' }
                ]
            }, {
                id: 'e4',
                icon: '✧',
                name: 'Cuerpo · la observación',
                techniques: [
                    { id: 31, name: 'La descripción de una persona', rhetoric: 'Prosopográfica',
                        def: 'Describir a alguien que el escritor ha visto o recuerda.',
                        example: 'Tu sombra en la ventana, esa silueta que tanto conozco, es como la de un árbol que espera la primavera.' },
                    { id: 32, name: 'La observación de la naturaleza', rhetoric: 'Paisajística',
                        def: 'Describir un elemento natural como reflejo del estado de ánimo.',
                        example: 'El río corre impasible, como si el mundo no se detuviera por nadie. Y yo, desde la orilla, te escribo.' },
                    { id: 33, name: 'El detalle del objeto', rhetoric: 'Descriptiva',
                        def: 'Describir un objeto con tal detalle que cobre vida.',
                        example: 'La pluma con la que escribo tiene una grieta en el mango, como una herida que no cicatriza. Así es mi amor por ti.' },
                    { id: 34, name: 'La observación del sonido', rhetoric: 'Sonora',
                        def: 'Describir un sonido que acompaña el momento de la escritura.',
                        example: 'El tic-tac del reloj marca el ritmo de mis pensamientos. Cada segundo que pasa es una palabra que no te he dicho.' },
                    { id: 35, name: 'La observación del silencio', rhetoric: 'Elíptica',
                        def: 'Describir el silencio como un elemento presente en la carta.',
                        example: 'El silencio entre mis palabras es el espacio donde habita mi amor por ti.' },
                    { id: 36, name: 'La observación del gesto', rhetoric: 'Coreográfica',
                        def: 'Describir un gesto que revela el estado de ánimo del otro.',
                        example: 'Al leer tu carta, imaginé tu mano temblorosa, la manera en que tu mirada se pierde en el horizonte.' },

            //  2. ESTADO

            const STORAGE_KEY = 'codice_epistolar_100';

            function loadState() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) return JSON.parse(raw);
                } catch (_) { /* ignore */ }
                return { entries: {} };
            }

            function saveState() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
                } catch (_) { /* ignore */ }
            }

            let appState = loadState();

            // Inicializar técnicas
            CATEGORIES.forEach(cat => {
                cat.techniques.forEach(t => {
                    if (!appState.entries[t.id]) {
                        appState.entries[t.id] = { text: '', written: false, style: 'normal' };
                    }
                });
            });
            saveState();

            // ============================================================
            //  3. VOZ (Web Speech API)
            // ============================================================

            let speechSynth = window.speechSynthesis;
            let isSpeaking = false;
            let speakingId = null;
            const floatStopBtn = document.getElementById('floatStopBtn');

            function speakText(text, id, onStart, onEnd) {
                if (isSpeaking) {
                    speechSynth.cancel();
                    isSpeaking = false;
                    floatStopBtn.classList.remove('visible');
                    if (onEnd) onEnd();
                    setTimeout(() => speakText(text, id, onStart, onEnd), 100);
                    return;
                }

                const utterance = new SpeechSynthesisUtterance(text);
                const voices = speechSynth.getVoices();
                const esVoice = voices.find(v => v.lang.startsWith('es')) || voices[0];
                if (esVoice) utterance.voice = esVoice;
                utterance.lang = 'es-ES';
                utterance.rate = 0.9;
                utterance.pitch = 1;

                utterance.onstart = function() {
                    isSpeaking = true;
                    speakingId = id;
                    floatStopBtn.classList.add('visible');
                    if (onStart) onStart();
                    document.querySelectorAll(`.btn-speech[data-id="${id}"]`).forEach(b => b.classList.add('speaking'));
                    document.querySelectorAll(`.btn-speech-small[data-id="${id}"]`).forEach(b => b.classList.add(
                    'speaking'));
                };

                utterance.onend = function() {
                    isSpeaking = false;
                    speakingId = null;
                    floatStopBtn.classList.remove('visible');
                    if (onEnd) onEnd();
                    document.querySelectorAll('.btn-speech.speaking').forEach(b => b.classList.remove('speaking'));
                    document.querySelectorAll('.btn-speech-small.speaking').forEach(b => b.classList.remove('speaking'));
                };

                utterance.onerror = function() {
                    isSpeaking = false;
                    speakingId = null;
                    floatStopBtn.classList.remove('visible');
                    if (onEnd) onEnd();
                    document.querySelectorAll('.btn-speech.speaking').forEach(b => b.classList.remove('speaking'));
                    document.querySelectorAll('.btn-speech-small.speaking').forEach(b => b.classList.remove('speaking'));
                };

                speechSynth.speak(utterance);
            }

            function stopSpeaking() {
                if (isSpeaking) {
                    speechSynth.cancel();
                    isSpeaking = false;
                    speakingId = null;
                    floatStopBtn.classList.remove('visible');
                    document.querySelectorAll('.btn-speech.speaking').forEach(b => b.classList.remove('speaking'));
                    document.querySelectorAll('.btn-speech-small.speaking').forEach(b => b.classList.remove('speaking'));
                }
            }

            floatStopBtn.addEventListener('click', stopSpeaking);

                document.getElementById('progressNum').textContent = totalW;
                document.getElementById('progressBadge').textContent = `${totalW}/100`;
                const pct = totalTechniques > 0 ? (totalW / totalTechniques) * 100 : 0;
                document.getElementById('progressFill').style.width = `${pct}%`;
                document.getElementById('sealDisplay').textContent = totalW === totalTechniques ? '🟢' :
                    totalW > 0 ? '🟡' : '⚪';

                // === EVENTOS ===

                // Acordeón
                document.querySelectorAll('.category-header').forEach(header => {
                    header.addEventListener('click', function() {
                        const target = this.dataset.target;
                        const body = document.getElementById(`body-${target}`);
                        const arrow = this.querySelector('.cat-arrow');
                        if (body) {
                            body.classList.toggle('open');
                            if (arrow) arrow.classList.toggle('open');
                        }
                    });
                });

                // Práctica (textarea)
                document.querySelectorAll('.practice-text').forEach(ta => {
                    ta.addEventListener('input', function() {
                        const id = parseInt(this.dataset.id);
                        const val = this.value;
                        if (!appState.entries[id]) appState.entries[id] = { text: '', written: false,
                            style: 'normal' };
                        appState.entries[id].text = val;
                        saveState();
                        const preview = document.querySelector(`.practice-preview[data-id="${id}"]`);
                        if (preview) {
                            preview.textContent = val || '';
                            const style = appState.entries[id].style || 'normal';
                            preview.className = `practice-preview ${getStyleClassFor(style)}`;
                        }
                        const btn = document.querySelector(`.btn-speech-small[data-id="${id}"]`);
                        if (btn) btn.dataset.text = val || '';
                    });
                });

                // Checkbox "escrita"
                document.querySelectorAll('.written-check').forEach(cb => {
                    cb.addEventListener('change', function() {
                        const id = parseInt(this.dataset.id);
                        const checked = this.checked;
                        if (!appState.entries[id]) appState.entries[id] = { text: '', written: false,
                            style: 'normal' };
                        appState.entries[id].written = checked;
                        saveState();
                        renderAll();
                        // Re-renderizar ejercicios y quiz
                        renderExercise();
                        renderQuiz();
                    });
                });

                // Botones de escuchar (ejemplo)
                document.querySelectorAll('.btn-speech').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = parseInt(this.dataset.id);
                        const text = this.dataset.text;
                        if (!text) return;
                        speakText(text, id);
                    });
                });

                // Botones de escuchar (texto del usuario)
                document.querySelectorAll('.btn-speech-small').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = parseInt(this.dataset.id);
                        let text = this.dataset.text;
                        if (!text || text.trim() === '') {
                            const exampleBtn = document.querySelector(`.btn-speech[data-id="${id}"]`);
                            if (exampleBtn) text = exampleBtn.dataset.text || '';
                        }
                        if (!text) return;
                        speakText(text, id);
                    });
                });

                // Estilos
                document.querySelectorAll('.style-pill').forEach(pill => {
                    pill.addEventListener('click', function() {
                        const targetId = parseInt(this.dataset.target);
                        const style = this.dataset.style;
                        if (!appState.entries[targetId]) appState.entries[targetId] = { text: '',
                            written: false, style: 'normal' };
                        appState.entries[targetId].style = style;
                        saveState();
                        const preview = document.querySelector(`.practice-preview[data-id="${targetId}"]`);
                        if (preview) {
                            preview.className = `practice-preview ${getStyleClassFor(style)}`;
                        }
                        const parent = this.closest('.style-pills');
                        parent.querySelectorAll('.style-pill').forEach(p => p.classList.remove('active'));
                        this.classList.add('active');
                    });
                });

                saveState();
            }

            // ============================================================
            //  5. FUNCIONES DE ESTILO
            // ============================================================

            function getStyleClassFor(style) {
                switch (style) {
                    case 'spencerian':
                        return 'preview-spencerian';
                    case 'copperplate':
                        return 'preview-copperplate';
                    case 'chancery':
                        return 'preview-chancery';
                    case 'palmer':
                        return 'preview-palmer';
                    default:
                        return 'preview-normal';
                }
            }

            // ============================================================
            //  6. EJERCICIOS INTERACTIVOS
            // ============================================================

            const exercises = [{
                id: 1,
                prompt: 'Escribe una carta abriendo con un saludo geográfico, mencionando el lugar desde donde escribes.',
                hint: 'Piensa en tu entorno: el clima, los objetos que te rodean, el sonido del lugar.'
            }, {
                id: 2,
                prompt: 'Practica la técnica de la metáfora extendida: compara tu estado de ánimo con un fenómeno natural y desarróllalo en varias líneas.',
                hint: 'Por ejemplo: "Mi corazón es un mar en calma, pero bajo la superficie..."'
            }, {
                id: 3,
                prompt: 'Escribe un cierre de carta con una promesa. Promete algo que realmente quieras cumplir para el destinatario.',
                hint: 'Puede ser una promesa de escribir más seguido, de visitar, o de compartir algo especial.'
            }, {
                id: 4,
                prompt: 'Crea una carta de agradecimiento usando al menos tres imágenes sensoriales (olor, tacto, sonido).',
                hint: 'Agradece a alguien por algo concreto, usando los sentidos para hacerlo vívido.'
            }, {
                id: 5,
                prompt: 'Escribe una carta de despedida que termine con una pregunta que invite a la respuesta.',
                hint: 'La pregunta debe abrir la puerta a un futuro diálogo, no cerrarlo.'
            }];

            let currentExercise = 0;
            let exerciseFeedback = '';

            function renderExercise() {
                const container = document.getElementById('exerciseContent');
                const ex = exercises[currentExercise];
                const totalW = Object.values(appState.entries).filter(e => e.written).length;

                let html = `
                    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:0.3rem;margin-bottom:0.4rem;">
                        <span style="font-family:var(--font-uncial);font-size:0.6rem;color:var(--tinta-gris);">ejercicio ${currentExercise+1} de ${exercises.length}</span>
                        <span style="font-family:var(--font-serif);font-size:0.6rem;color:var(--tinta-gris);">cartas escritas: ${totalW}/100</span>
                    </div>
                    <div class="exercise-prompt">${ex.prompt}</div>
                    <div style="font-size:0.65rem;color:var(--tinta-gris);opacity:0.5;margin-bottom:0.3rem;">💡 ${ex.hint}</div>
                    <textarea class="exercise-input" id="exerciseInput" placeholder="Escribe tu carta aquí..."></textarea>
                    <div class="exercise-actions">
                        <button class="btn-exercise" id="exercisePrevBtn">◀ anterior</button>
                        <button class="btn-exercise" id="exerciseNextBtn">siguiente ▶</button>
                        <button class="btn-exercise primary" id="exerciseCheckBtn">🔍 revisar</button>
                        <button class="btn-exercise" id="exerciseSaveBtn">💾 guardar</button>
                    </div>
                    <div class="exercise-feedback" id="exerciseFeedback">${exerciseFeedback || 'Escribe tu carta y presiona "revisar" para obtener retroalimentación.'}</div>
                `;

                container.innerHTML = html;

                // Eventos
                document.getElementById('exercisePrevBtn').addEventListener('click', function() {
                    if (currentExercise > 0) { currentExercise--;
                        exerciseFeedback = '';
                        renderExercise(); }
                });
                document.getElementById('exerciseNextBtn').addEventListener('click', function() {
                    if (currentExercise < exercises.length - 1) { currentExercise++;
                        exerciseFeedback = '';
                        renderExercise(); }
                });

                document.getElementById('exerciseCheckBtn').addEventListener('click', function() {
                    const text = document.getElementById('exerciseInput').value.trim();
                    if (!text) {
                        exerciseFeedback = '✧ Escribe algo antes de revisar.';
                        renderExercise();
                        return;
                    }
                    // Feedback simple basado en palabras clave
                    const words = text.split(/\s+/);
                    const wordCount = words.length;
                    const hasEmotion = /\b(amor|tristeza|alegría|esperanza|miedo|silencio|distancia)\b/i.test(text);
                    const hasImage = /\b(como|semejante|parece|metal|flor|viento|mar|tinta|papel)\b/i.test(text);

                    let feedback = '✧ ';
                    if (wordCount < 5) feedback += 'Tu carta es breve. Prueba a extenderla con más detalles. ';
                    else feedback += 'Bien, has escrito con extensión. ';

                    if (hasEmotion) feedback += 'Incluyes emoción, eso da vida a la carta. ';
                    else feedback += 'Añade algún sentimiento para que la carta conecte. ';

                    if (hasImage) feedback += 'Usas imágenes, excelente. ';
                    else feedback += 'Prueba a añadir una imagen sensorial (olor, tacto, color). ';

                    feedback += '✧';

                    // Guardar el texto en una entrada temporal
                    const tempId = 999; // ID temporal para guardar el ejercicio
                    if (!appState.entries[tempId]) appState.entries[tempId] = { text: '', written: false,
                        style: 'normal' };
                    appState.entries[tempId].text = text;
                    saveState();

                    exerciseFeedback = feedback;
                    renderExercise();
                    document.getElementById('exerciseInput').value = text;
                });

                document.getElementById('exerciseSaveBtn').addEventListener('click', function() {
                    const text = document.getElementById('exerciseInput').value.trim();
                    if (!text) { exerciseFeedback = '✧ Escribe algo para guardar.';
                        renderExercise(); return; }
                    const tempId = 999;
                    if (!appState.entries[tempId]) appState.entries[tempId] = { text: '', written: false,
                        style: 'normal' };
                    appState.entries[tempId].text = text;
                    saveState();
                    exerciseFeedback = '✧ Carta guardada en tu cuaderno. ✧';
                    renderExercise();
                    document.getElementById('exerciseInput').value = text;
                });

                // Cargar texto guardado si existe
                const saved = appState.entries[999];
                if (saved && saved.text) {
                    document.getElementById('exerciseInput').value = saved.text;
                }
            }

            // ============================================================
            //  7. QUIZ
            // ============================================================

            const quizQuestions = [{
                question: '¿Qué técnica consiste en iniciar la carta mencionando el lugar desde donde se escribe?',
                options: ['Saludo clásico', 'Saludo geográfico', 'Saludo temporal', 'Saludo por el clima'],
                correct: 1
            }, {
                question: '¿Qué recurso retórico consiste en desarrollar una comparación a lo largo de toda la carta?',
                options: ['Símil', 'Metáfora extendida', 'Anáfora', 'Personificación'],
                correct: 1
            }, {
                question: '¿Cómo se llama la técnica de cierre que termina con una pregunta?',
                options: ['Cierre clásico', 'Cierre con deseo', 'Cierre con pregunta', 'Cierre con promesa'],
                correct: 2
            }, {
                question: '¿Qué estilo epistolar utiliza un tono y vocabulario que reflejan distancia y respeto?',
                options: ['Estilo coloquial', 'Estilo formal', 'Estilo poético', 'Estilo fragmentario'],
                correct: 1
            }, {
                question: '¿Qué tipo de carta tiene como propósito principal pedir o conceder perdón?',
                options: ['Carta de amor', 'Carta de despedida', 'Carta de perdón', 'Carta de agradecimiento'],
                correct: 2
            }, {
                question: '¿Qué figura retórica consiste en repetir una palabra al inicio de varias frases?',
                options: ['Epífora', 'Anáfora', 'Hipérbole', 'Antítesis'],
                correct: 1
            }, {
                question: '¿Cómo se llama la técnica de añadir un pensamiento después del final de la carta?',
                options: ['Apertura', 'Cierre', 'Postdata', 'Firma'],
                correct: 2
            }, {
                question: '¿Qué técnica consiste en escribir con la naturalidad de una conversación cotidiana?',
                options: ['Estilo formal', 'Estilo coloquial', 'Estilo poético', 'Estilo visual'],
                correct: 1
            }, {
                question: '¿Qué recurso retórico mezcla sensaciones de diferentes sentidos?',
                options: ['Metáfora', 'Sinestesia', 'Personificación', 'Ironía'],
                correct: 1
            }, {
                question: '¿Qué tipo de carta se escribe para dar fuerzas y esperanza al destinatario?',
                options: ['Carta de ánimo', 'Carta de despedida', 'Carta de reflexión', 'Carta de propuesta'],
                correct: 0
            }];

            let currentQuiz = 0;
            let quizFeedback = '';
            let quizAnswered = false;

            function renderQuiz() {
                const container = document.getElementById('quizContent');
                const q = quizQuestions[currentQuiz];

                let html = `
                    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:0.3rem;margin-bottom:0.4rem;">
                        <span style="font-family:var(--font-uncial);font-size:0.6rem;color:var(--tinta-gris);">pregunta ${currentQuiz+1} de ${quizQuestions.length}</span>
                        <span style="font-family:var(--font-serif);font-size:0.6rem;color:var(--tinta-gris);">aciertos: ${getQuizScore()}</span>
                    </div>
                    <div class="quiz-question">${q.question}</div>
                    <div class="quiz-options">
                `;

                q.options.forEach((opt, idx) => {
                    const checked = quizAnswered && idx === q.correct ? 'checked' : '';
                    html += `
                        <label>
                            <input type="radio" name="quizOption" value="${idx}" ${checked} ${quizAnswered ? 'disabled' : ''} />
                            ${opt}
                        </label>
                    `;
                });

                html += `
                    </div>
                    <div class="quiz-actions">
                        <button class="btn-quiz" id="quizPrevBtn">◀ anterior</button>
                        <button class="btn-quiz" id="quizNextBtn">siguiente ▶</button>
                        <button class="btn-quiz primary" id="quizCheckBtn">${quizAnswered ? 'respondida' : 'responder'}</button>
                    </div>
                    <div class="quiz-result" id="quizFeedback">${quizFeedback || 'Selecciona una opción y presiona "responder".'}</div>
                `;

                container.innerHTML = html;

                // Eventos
                document.getElementById('quizPrevBtn').addEventListener('click', function() {
                    if (currentQuiz > 0) { currentQuiz--;
                        quizFeedback = '';
                        quizAnswered = false;
                        renderQuiz(); }
                });
                document.getElementById('quizNextBtn').addEventListener('click', function() {
                    if (currentQuiz < quizQuestions.length - 1) { currentQuiz++;
                        quizFeedback = '';
                        quizAnswered = false;
                        renderQuiz(); }
                });

                document.getElementById('quizCheckBtn').addEventListener('click', function() {
                    const selected = document.querySelector('input[name="quizOption"]:checked');
                    if (!selected) {
                        quizFeedback = '✧ Selecciona una opción.';
                        renderQuiz();
                        return;
                    }
                    const value = parseInt(selected.value);
                    const isCorrect = value === q.correct;
                    quizAnswered = true;

                    if (isCorrect) {
                        quizFeedback =
                            `<span class="correct">✓ Correcto. ¡Bien hecho!</span> ${q.options[q.correct]}`;
                        // Guardar acierto
                        const score = JSON.parse(localStorage.getItem('quiz_score_epistolar') || '[]');
                        score.push({ q: currentQuiz, correct: true });
                        localStorage.setItem('quiz_score_epistolar', JSON.stringify(score));
                    } else {
                        quizFeedback =
                            `<span class="incorrect">✗ Incorrecto.</span> La respuesta correcta es: ${q.options[q.correct]}`;
                        const score = JSON.parse(localStorage.getItem('quiz_score_epistolar') || '[]');
                        score.push({ q: currentQuiz, correct: false });
                        localStorage.setItem('quiz_score_epistolar', JSON.stringify(score));
                    }
                    renderQuiz();
                });

                // Marcar la respuesta guardada si existe
                const score = JSON.parse(localStorage.getItem('quiz_score_epistolar') || '[]');
                const existing = score.find(s => s.q === currentQuiz);
                if (existing && existing.correct !== undefined) {
                    quizAnswered = true;
                    if (existing.correct) {
                        quizFeedback = `<span class="correct">✓ Ya acertaste esta pregunta.</span>`;
                    } else {
                        quizFeedback =
                            `<span class="incorrect">✗ Fallaste esta pregunta. Inténtalo de nuevo.</span>`;
                        // Permitir reintentar
                        quizAnswered = false;
                        const radio = document.querySelector('input[name="quizOption"]');
                        if (radio) radio.disabled = false;
                    }
                    renderQuiz();
                }
            }

            function getQuizScore() {
                const score = JSON.parse(localStorage.getItem('quiz_score_epistolar') || '[]');
                return score.filter(s => s.correct).length;
            }

            // ============================================================
            //  8. TABS
            // ============================================================

            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    const target = this.dataset.tab;
                    document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
                    document.getElementById(target).classList.add('active');

                    if (target === 'tab-ejercicios') renderExercise();
                    if (target === 'tab-quiz') renderQuiz();
                });
            });

            // ============================================================
            //  9. RESET
            // ============================================================

            document.getElementById('resetAllBtn').addEventListener('click', function() {
                if (confirm('¿Limpiar todas las entradas del cuaderno?')) {
                    appState = { entries: {} };
                    CATEGORIES.forEach(cat => {
                        cat.techniques.forEach(t => {
                            appState.entries[t.id] = { text: '', written: false, style: 'normal' };
                        });
                    });
                    saveState();
                    localStorage.removeItem('quiz_score_epistolar');
                    renderAll();
                    renderExercise();
                    renderQuiz();
                    stopSpeaking();
                }
            });

            // ============================================================
            //  10. INICIO
            // ============================================================

            renderAll();
            renderExercise();
            renderQuiz();

            console.log('📜 CÓDICE EPISTOLAR cargado. 100 técnicas de carta manuscrita.');
            const totalW = Object.values(appState.entries).filter(e => e.written).length;
            console.log(`📊 ${totalW}/100 cartas escritas.`);

        })();
    </script>

</body>
</html>
