<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>🎨 GRAPHICA · 100 técnicas de novela gráfica</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=MedievalSharp&family=Uncial+Antiqua&family=EB+Garamond:ital,wght@0,400;0,600;1,400;1,600&family=Cinzel:wght@400;600;700&family=Great+Vibes&family=Alex+Brush&family=Cedarville+Cursive&family=Dancing+Script:wght@400..700&display=swap" rel="stylesheet" />

    <style>
        /* ============================================================
           BASE · ESTILO CUADERNO DE BOCETOS
           ============================================================ */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --papel: #fcf8f0;
            --papel-rayado: #f5efe4;
            --tinta: #1a1a2e;
            --tinta-clara: #4a4a6a;
            --tinta-gris: #8a8aaa;
            --linea-viñeta: #2c2c4a;
            --acuarela1: #e8d5b0;
            --acuarela2: #c9b89a;
            --acuarela3: #b8a88a;
            --rotulador: #d42a2a;
            --rotulador-claro: #e86a6a;
            --lapiz: #6a6a8a;
            --lapiz-claro: #aaaacc;
            --sombra: rgba(26, 26, 46, 0.15);
            --font-serif: 'EB Garamond', 'Times New Roman', serif;
            --font-cinzel: 'Cinzel', serif;
            --font-spencerian: 'Great Vibes', cursive;
            --font-copperplate: 'Alex Brush', cursive;
            --font-chancery: 'Cedarville Cursive', cursive;
            --font-palmer: 'Dancing Script', cursive;
        }

        body {
            font-family: var(--font-serif);
            background: #e8e0d0;
            background-image:
                radial-gradient(ellipse at 20% 30%, #f0e8d8 0%, transparent 60%),
                radial-gradient(ellipse at 80% 70%, #e8e0d0 0%, transparent 50%);
            min-height: 100vh;
            padding: 1rem;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            color: var(--tinta);
        }

        .codex {
            max-width: 1350px;
            width: 100%;
            background: var(--papel);
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(200, 190, 175, 0.15) 27px, rgba(200, 190, 175, 0.15) 28px),
                repeating-linear-gradient(90deg, transparent, transparent 28px, rgba(200, 190, 175, 0.05) 28px, rgba(200, 190, 175, 0.05) 29px);
            border-radius: 18px;
            box-shadow:
                0 8px 60px rgba(26, 26, 46, 0.15),
                inset 0 0 80px rgba(200, 190, 175, 0.10),
                0 0 0 1px var(--lapiz-claro),
                0 0 0 3px var(--acuarela2),
                0 0 0 5px var(--lapiz);
            padding: 2rem 2rem 1.5rem;
            position: relative;
        }

        .codex::before {
            content: '';
            position: absolute;
            inset: 8px;
            border: 1px dashed rgba(100, 100, 150, 0.10);
            border-radius: 14px;
            pointer-events: none;
        }

        .codex::after {
            content: '✧ ✧ ✧';
            position: absolute;
            bottom: -14px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--lapiz);
            font-size: 0.8rem;
            letter-spacing: 10px;
            background: var(--papel);
            padding: 0 1.8rem;
            font-family: var(--font-serif);
            text-shadow: 0 0 8px rgba(100, 100, 150, 0.05);
            opacity: 0.3;
        }

        /* ============================================================
           ENCABEZADO
           ============================================================ */

        .app-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem 1.5rem;
            margin-bottom: 1.2rem;
            padding-bottom: 0.8rem;
            border-bottom: 2px solid var(--lapiz-claro);
            position: relative;
        }

        .app-header h1 {
            font-family: var(--font-cinzel);
            font-weight: 700;
            font-size: 2.2rem;
            color: var(--rotulador);
            text-shadow: 0 1px 4px rgba(212, 42, 42, 0.04);
            letter-spacing: 0.04em;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .app-header h1 small {
            font-family: var(--font-serif);
            font-size: 0.7rem;
            font-weight: 400;
            color: var(--tinta-clara);
            opacity: 0.4;
            letter-spacing: 0.06em;
            line-height: 1.2;
            max-width: 200px;
        }

        .app-header .header-actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .btn-graphica {
            font-family: var(--font-serif);
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0.35rem 1.4rem;
            border-radius: 30px;
            border: 1px solid var(--lapiz-claro);
            background: rgba(255, 255, 255, 0.2);
            color: var(--tinta-clara);
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 0.04em;
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }

        .btn-graphica:hover {
            background: rgba(212, 42, 42, 0.04);
            border-color: var(--rotulador);
            color: var(--rotulador);
        }

        .btn-graphica.primary {
            background: rgba(212, 42, 42, 0.04);
            border-color: var(--rotulador-claro);
            color: var(--rotulador);
        }

        .btn-graphica.primary:hover {
            background: rgba(212, 42, 42, 0.08);
            border-color: var(--rotulador);
        }

        /* ============================================================
           PESTAÑAS
           ============================================================ */

        .tab-bar {
            display: flex;
            gap: 0.1rem;
            border-bottom: 2px solid var(--lapiz-claro);
            margin-bottom: 1.5rem;
            padding-bottom: 0.1rem;
            flex-wrap: wrap;
        }

        .tab-btn {
            font-family: var(--font-cinzel);
            font-size: 0.8rem;
            padding: 0.4rem 1.8rem 0.35rem;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            color: var(--tinta-gris);
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 0.04em;
        }

        .tab-btn:hover {
            color: var(--tinta-clara);
            background: rgba(100, 100, 150, 0.02);
        }

        .tab-btn.active {
            color: var(--rotulador);
            border-bottom-color: var(--rotulador);
            background: rgba(212, 42, 42, 0.02);
        }

        .tab-btn .badge-progress {
            display: inline-block;
            font-family: var(--font-serif);
            font-size: 0.55rem;
            background: var(--lapiz-claro);
            color: var(--tinta);
            border-radius: 30px;
            padding: 0.02rem 0.6rem;
            margin-left: 0.2rem;
            font-weight: 600;
            vertical-align: middle;
            line-height: 1.4;
        }

        .tab-pane {
            display: none;
            animation: fadeIn 0.4s ease;
        }

        .tab-pane.active {
            display: block;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(8px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============================================================
           PROGRESO
           ============================================================ */

        .progress-summary {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.5rem 1.2rem;
            background: rgba(200, 190, 175, 0.06);
            border-radius: 12px;
            border: 1px solid rgba(200, 190, 175, 0.06);
            margin-bottom: 1.2rem;
            flex-wrap: wrap;
            backdrop-filter: blur(2px);
        }

        .progress-summary .progress-bar-bg {
            flex: 1;
            min-width: 100px;
            height: 8px;
            background: rgba(200, 190, 175, 0.10);
            border-radius: 30px;
            overflow: hidden;
            border: 1px solid rgba(200, 190, 175, 0.06);
        }

        .progress-summary .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--rotulador-claro), var(--rotulador), var(--acuarela3));
            border-radius: 30px;
            transition: width 0.6s ease;
        }

        .progress-summary .progress-text {
            font-family: var(--font-cinzel);
            font-size: 0.8rem;
            color: var(--tinta-clara);
            white-space: nowrap;
        }

        .progress-summary .progress-text strong {
            color: var(--rotulador);
            font-family: var(--font-serif);
        }

        /* ============================================================
           BÚSQUEDA Y FILTROS
           ============================================================ */

        .search-box {
            display: flex;
            gap: 0.5rem;
            margin-bottom: 1rem;
            flex-wrap: wrap;
        }

        .search-box input {
            flex: 1;
            min-width: 200px;
            padding: 0.4rem 1rem;
            border: 1px solid var(--lapiz-claro);
            border-radius: 40px;
            background: rgba(255, 255, 255, 0.15);
            font-family: var(--font-serif);
            font-size: 0.85rem;
            color: var(--tinta);
            transition: border-color 0.3s;
            outline: none;
        }

        .search-box input:focus {
            border-color: var(--rotulador);
            box-shadow: 0 0 0 3px rgba(212, 42, 42, 0.04);
        }

        .search-box input::placeholder {
            color: var(--tinta-gris);
            opacity: 0.4;
            font-style: italic;
        }

        .search-box .btn-filter {
            font-family: var(--font-cinzel);
            font-size: 0.6rem;
            padding: 0.3rem 1rem;
            border-radius: 40px;
            border: 1px solid var(--lapiz-claro);
            background: rgba(255, 255, 255, 0.10);
            color: var(--tinta-clara);
            cursor: pointer;
            transition: all 0.3s;
        }

        .search-box .btn-filter:hover {
            background: rgba(212, 42, 42, 0.03);
            border-color: var(--rotulador);
        }

        .search-box .btn-filter.active {
            background: rgba(212, 42, 42, 0.04);
            border-color: var(--rotulador);
            color: var(--rotulador);
        }

        /* ============================================================
           ACORDEÓN DE TÉCNICAS
           ============================================================ */

        .category-accordion {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            max-height: 580px;
            overflow-y: auto;
            padding-right: 0.3rem;
        }

        .category-accordion::-webkit-scrollbar {
            width: 6px;
        }
        .category-accordion::-webkit-scrollbar-track {
            background: var(--papel);
            border-radius: 30px;
        }
        .category-accordion::-webkit-scrollbar-thumb {
            background: var(--lapiz);
            border-radius: 30px;
        }

        .category-item {
            border: 1px solid rgba(100, 100, 150, 0.08);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.10);
            overflow: hidden;
            transition: all 0.25s;
        }

        .category-item:hover {
            border-color: rgba(212, 42, 42, 0.08);
            box-shadow: 0 2px 20px rgba(26, 26, 46, 0.02);
        }

        .category-header {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.6rem 1rem;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.05);
            transition: background 0.2s;
            user-select: none;
            flex-wrap: wrap;
        }

        .category-header:hover {
            background: rgba(212, 42, 42, 0.02);
        }

        .category-header .cat-icon {
            font-size: 1.3rem;
            color: var(--rotulador);
            width: 2.2rem;
            text-align: center;
            opacity: 0.5;
        }

        .category-header .cat-title {
            font-family: var(--font-cinzel);
            font-weight: 600;
            font-size: 0.85rem;
            color: var(--tinta);
            flex: 1;
            letter-spacing: 0.02em;
        }

        .category-header .cat-count {
            font-size: 0.65rem;
            color: var(--tinta-gris);
            background: rgba(200, 190, 175, 0.04);
            padding: 0.02rem 0.7rem;
            border-radius: 30px;
            font-family: var(--font-serif);
            font-weight: 600;
        }

        .category-header .cat-arrow {
            color: var(--lapiz);
            font-size: 0.7rem;
            transition: transform 0.3s;
            margin-left: 0.1rem;
        }

        .category-header .cat-arrow.open {
            transform: rotate(180deg);
            color: var(--rotulador);
        }

        .category-body {
            padding: 0 1rem 1rem;
            display: none;
            border-top: 1px solid rgba(200, 190, 175, 0.05);
            padding-top: 0.6rem;
        }

        .category-body.open {
            display: block;
        }

        /* ============================================================
           TARJETA DE TÉCNICA (INTERACTIVA)
           ============================================================ */

        .tech-card {
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
            padding: 0.6rem 0.8rem;
            margin-bottom: 0.3rem;
            border-radius: 10px;
            border-left: 4px solid var(--lapiz-claro);
            background: rgba(255, 255, 255, 0.05);
            transition: all 0.25s;
            cursor: pointer;
            position: relative;
        }

        .tech-card:hover {
            background: rgba(255, 255, 255, 0.15);
            border-left-color: var(--rotulador);
            transform: translateX(4px);
            box-shadow: 0 2px 16px rgba(26, 26, 46, 0.02);
        }

        .tech-card .tech-head {
            display: flex;
            align-items: baseline;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .tech-card .tech-num {
            font-family: var(--font-cinzel);
            font-size: 0.6rem;
            color: var(--lapiz);
            min-width: 2.4rem;
            font-weight: 600;
            opacity: 0.4;
        }

        .tech-card .tech-name {
            font-weight: 700;
            font-size: 1rem;
            color: var(--tinta);
            font-family: var(--font-serif);
        }

        .tech-card .tech-rhetoric {
            font-size: 0.55rem;
            background: rgba(212, 42, 42, 0.03);
            padding: 0.02rem 0.6rem;
            border-radius: 30px;
            color: var(--rotulador);
            font-style: italic;
            border: 1px solid rgba(212, 42, 42, 0.04);
        }

        .tech-card .tech-def {
            font-size: 0.8rem;
            color: var(--tinta-clara);
            line-height: 1.6;
            margin: 0.05rem 0 0.05rem;
            padding-left: 0.1rem;
        }

        .tech-card .tech-example-box {
            font-size: 0.75rem;
            color: var(--tinta-clara);
            font-style: italic;
            background: rgba(200, 190, 175, 0.02);
            padding: 0.2rem 0.7rem;
            border-radius: 8px;
            border-left: 3px solid var(--lapiz-claro);
            margin: 0.05rem 0 0.1rem;
            line-height: 1.7;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.4rem;
        }

        .tech-card .tech-example-box .example-text {
            flex: 1;
            min-width: 140px;
        }

        .tech-card .tech-example-box .btn-speech {
            font-family: var(--font-cinzel);
            font-size: 0.5rem;
            padding: 0.05rem 0.6rem;
            border-radius: 30px;
            border: 1px solid rgba(100, 100, 150, 0.06);
            background: transparent;
            color: var(--tinta-gris);
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.1rem;
            white-space: nowrap;
        }

        .tech-card .tech-example-box .btn-speech:hover {
            background: rgba(212, 42, 42, 0.03);
            border-color: var(--rotulador);
            color: var(--rotulador);
        }

        .tech-card .tech-example-box .btn-speech.speaking {
            color: var(--rotulador);
            border-color: var(--rotulador-claro);
            background: rgba(212, 42, 42, 0.03);
        }

        /* Área de práctica */
        .tech-card .tech-practice-area {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 0.4rem 0.8rem;
            margin-top: 0.1rem;
            padding-top: 0.3rem;
            border-top: 1px dashed rgba(200, 190, 175, 0.10);
        }

        .tech-card .tech-practice-area .practice-input-group {
            flex: 1;
            min-width: 180px;
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
        }

        .tech-card .tech-practice-area .practice-input-group textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.10);
            border: 1px solid rgba(200, 190, 175, 0.06);
            border-radius: 8px;
            padding: 0.25rem 0.6rem;
            font-family: var(--font-serif);
            font-size: 0.75rem;
            color: var(--tinta);
            resize: vertical;
            min-height: 36px;
            transition: border-color 0.3s;
        }

        .tech-card .tech-practice-area .practice-input-group textarea:focus {
            border-color: var(--rotulador);
            outline: none;
            box-shadow: 0 0 0 3px rgba(212, 42, 42, 0.02);
        }

        .tech-card .tech-practice-area .practice-input-group .practice-preview {
            font-size: 0.85rem;
            padding: 0.1rem 0.3rem;
            min-height: 1.6rem;
            color: var(--tinta-clara);
            border-bottom: 1px solid rgba(200, 190, 175, 0.05);
            line-height: 1.7;
            word-break: break-word;
            transition: all 0.15s;
            font-style: italic;
            opacity: 0.5;
        }

        .tech-card .tech-practice-area .practice-input-group .practice-preview:empty::before {
            content: 'tu viñeta o narrativa aparecerá aquí...';
            color: var(--tinta-gris);
            opacity: 0.2;
            font-size: 0.65rem;
            font-style: italic;
        }

        .preview-spencerian {
            font-family: var(--font-spencerian);
            font-style: normal;
            opacity: 1;
        }
        .preview-copperplate {
            font-family: var(--font-copperplate);
            font-style: normal;
            opacity: 1;
        }
        .preview-chancery {
            font-family: var(--font-chancery);
            font-style: normal;
            opacity: 1;
        }
        .preview-palmer {
            font-family: var(--font-palmer);
            font-style: normal;
            opacity: 1;
        }
        .preview-normal {
            font-family: var(--font-serif);
            font-style: italic;
            opacity: 0.5;
        }

        .tech-card .tech-practice-area .tech-actions {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            flex-wrap: wrap;
            padding-top: 0.1rem;
        }

        .tech-card .tech-practice-area .tech-actions .btn-speech-small {
            font-family: var(--font-cinzel);
            font-size: 0.45rem;
            padding: 0.04rem 0.5rem;
            border-radius: 30px;
            border: 1px solid rgba(200, 190, 175, 0.06);
            background: transparent;
            color: var(--tinta-gris);
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.05rem;
        }

        .tech-card .tech-practice-area .tech-actions .btn-speech-small:hover {
            background: rgba(212, 42, 42, 0.02);
            border-color: var(--rotulador);
            color: var(--rotulador);
        }

        .tech-card .tech-practice-area .tech-actions .btn-speech-small.speaking {
            color: var(--rotulador);
            border-color: var(--rotulador-claro);
        }

        .tech-card .tech-practice-area .tech-actions label {
            display: flex;
            align-items: center;
            gap: 0.15rem;
            font-size: 0.55rem;
            color: var(--tinta-gris);
            cursor: pointer;
            font-family: var(--font-serif);
        }

        .tech-card .tech-practice-area .tech-actions input[type="checkbox"] {
            appearance: none;
            width: 1rem;
            height: 1rem;
            border: 2px solid var(--lapiz);
            border-radius: 4px;
            cursor: pointer;
            background: var(--papel);
            transition: all 0.15s;
            position: relative;
            flex-shrink: 0;
        }

        .tech-card .tech-practice-area .tech-actions input[type="checkbox"]:checked {
            background: var(--rotulador);
            border-color: var(--rotulador);
        }

        .tech-card .tech-practice-area .tech-actions input[type="checkbox"]:checked::after {
            content: '✓';
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--papel);
            font-size: 0.65rem;
            font-weight: 700;
        }

        .tech-card .tech-practice-area .tech-actions .wax-seal {
            display: inline-flex;
            align-items: center;
            gap: 0.1rem;
            font-size: 0.5rem;
            color: var(--rotulador);
            font-weight: 600;
            font-family: var(--font-cinzel);
            letter-spacing: 0.04em;
            opacity: 0.2;
            transition: opacity 0.3s;
        }

        .tech-card .tech-practice-area .tech-actions .wax-seal.active {
            opacity: 1;
        }

        .tech-card .tech-practice-area .tech-actions .wax-seal .seal-icon {
            font-size: 0.9rem;
        }

        /* Estilos de caligrafía */
        .style-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 0.1rem;
            margin: 0.15rem 0 0.05rem;
            padding: 0.1rem 0.3rem;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 40px;
            border: 1px solid rgba(200, 190, 175, 0.03);
        }

        .style-pill {
            font-family: var(--font-cinzel);
            font-size: 0.4rem;
            padding: 0.04rem 0.5rem;
            border-radius: 30px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--tinta-gris);
            cursor: pointer;
            transition: all 0.2s;
            font-weight: 400;
            letter-spacing: 0.02em;
        }

        .style-pill:hover {
            background: rgba(212, 42, 42, 0.02);
            border-color: rgba(100, 100, 150, 0.05);
            color: var(--tinta-clara);
        }

        .style-pill.active {
            background: rgba(212, 42, 42, 0.04);
            border-color: var(--rotulador);
            color: var(--rotulador);
        }

        .style-pill .pill-preview {
            display: inline-block;
            font-size: 0.65rem;
            margin-left: 0.05rem;
            opacity: 0.25;
        }

        .style-pill.active .pill-preview {
            opacity: 1;
        }

        /* ============================================================
           EJERCICIOS Y QUIZ
           ============================================================ */

        .exercise-section,

    <script>
        (function() {
            'use strict';

            // ============================================================
            //  1. DATOS: 100 TÉCNICAS DE NOVELA GRÁFICA
            // ============================================================

            const CATEGORIES = [{
                id: 'g1',
                icon: '🎬',
                name: 'Narrativa visual y composición',
                techniques: [
                    { id: 1, name: 'Storyboard completo', rhetoric: 'Planificación',
                        def: 'Planificar toda la historia en viñetas antes de dibujar, definiendo la estructura narrativa y el ritmo visual.',
                        example: 'El storyboard de "Maus" de Art Spiegelman muestra cómo la planificación permite una narrativa compleja y emocional.' },
                    { id: 2, name: 'Viñeta splash', rhetoric: 'Composición',
                        def: 'Una viñeta que ocupa toda la página o una gran extensión, usada para impactar visualmente en momentos clave.',
                        example: 'La splash page de "Watchmen" de Alan Moore y Dave Gibbons en el momento del descubrimiento de la conspiración.' },
                    { id: 3, name: 'Gutter (callejón)', rhetoric: 'Espacio',
                        def: 'El espacio entre viñetas que el lector rellena con su imaginación, creando el ritmo y la temporalidad de la historia.',
                        example: 'Chris Ware utiliza el gutter en "Jimmy Corrigan" para crear pausas y silencios narrativos.' },
                    { id: 4, name: 'Planos cinematográficos', rhetoric: 'Composición',
                        def: 'Uso de planos (general, medio, primer plano, detalle) como en el cine para guiar la atención del lector.',
                        example: 'El uso de planos en "Persépolis" de Marjane Satrapi crea una narrativa visual poderosa y cercana.' },
                    { id: 5, name: 'Angulación dramática', rhetoric: 'Perspectiva',
                        def: 'Uso de ángulos de cámara (picado, contrapicado, cenital) para crear efectos emocionales y dramáticos.',
                        example: 'La angulación en "Sin City" de Frank Miller potencia el estilo noir y la tensión narrativa.' },
                    { id: 6, name: 'Composición de página', rhetoric: 'Diseño',
                        def: 'Organización de las viñetas en la página para controlar el flujo de lectura y el ritmo narrativo.',
                        example: 'La composición de página en "El Eternauta" de Oesterheld y Solano López crea una narrativa dinámica y envolvente.' },
                    { id: 7, name: 'Viñeta panorámica', rhetoric: 'Composición',
                        def: 'Viñeta horizontal alargada que abarca un paisaje o una escena amplia, usada para establecer el escenario.',
                        example: 'Las viñetas panorámicas en "El arte de volar" de Antonio Altarriba y Kim muestran la inmensidad del paisaje.' },

                name: 'Innovación y experimentación',

                        def: 'Uso de técnicas digitales para crear la novela gráfica, explorando nuevas posibilidades visuales.',
                        example: '"Scott Pilgrim" de Bryan Lee O\'Malley utiliza técnicas digitales para crear un estilo de dibujo vibrante.' }
                ]
            }];

            // ============================================================
            //  2. ESTADO
            // ============================================================

            const STORAGE_KEY = 'graphica_universal_100';

            function loadState() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) return JSON.parse(raw);
                } catch (_) { /* ignore */ }
                return { entries: {} };
            }

            function saveState() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
                } catch (_) { /* ignore */ }
            }

            let appState = loadState();

            // Inicializar técnicas
            CATEGORIES.forEach(cat => {
                cat.techniques.forEach(t => {
                    if (!appState.entries[t.id]) {
                        appState.entries[t.id] = { text: '', written: false, style: 'normal' };
                    }
                });
            });
            saveState();

            // ============================================================
            //  3. VOZ (Web Speech API)
            // ============================================================

            let speechSynth = window.speechSynthesis;
            let isSpeaking = false;
            let speakingId = null;
            const floatStopBtn = document.getElementById('floatStopBtn');

            function speakText(text, id, onStart, onEnd) {
                if (isSpeaking) {
                    speechSynth.cancel();
                    isSpeaking = false;
                    floatStopBtn.classList.remove('visible');
                    if (onEnd) onEnd();
                    setTimeout(() => speakText(text, id, onStart, onEnd), 100);
                    return;
                }

                const utterance = new SpeechSynthesisUtterance(text);
                const voices = speechSynth.getVoices();
                const esVoice = voices.find(v => v.lang.startsWith('es')) || voices[0];
                if (esVoice) utterance.voice = esVoice;
                utterance.lang = 'es-ES';
                utterance.rate = 0.85;
                utterance.pitch = 1;

                utterance.onstart = function() {
                    isSpeaking = true;
                    speakingId = id;
                    floatStopBtn.classList.add('visible');
                    if (onStart) onStart();
                    document.querySelectorAll(`.btn-speech[data-id="${id}"]`).forEach(b => b.classList.add('speaking'));
                    document.querySelectorAll(`.btn-speech-small[data-id="${id}"]`).forEach(b => b.classList.add(
                    'speaking'));
                };

                utterance.onend = function() {
                    isSpeaking = false;
                    speakingId = null;
                    floatStopBtn.classList.remove('visible');
                    if (onEnd) onEnd();
                    document.querySelectorAll('.btn-speech.speaking').forEach(b => b.classList.remove('speaking'));
                    document.querySelectorAll('.btn-speech-small.speaking').forEach(b => b.classList.remove('speaking'));
                };

                utterance.onerror = function() {
                    isSpeaking = false;
                    speakingId = null;
                    floatStopBtn.classList.remove('visible');
                    if (onEnd) onEnd();
                    document.querySelectorAll('.btn-speech.speaking').forEach(b => b.classList.remove('speaking'));
                    document.querySelectorAll('.btn-speech-small.speaking').forEach(b => b.classList.remove('speaking'));
                };

                speechSynth.speak(utterance);
            }

            function stopSpeaking() {
                if (isSpeaking) {
                    speechSynth.cancel();
                    isSpeaking = false;
                    speakingId = null;
                    floatStopBtn.classList.remove('visible');
                    document.querySelectorAll('.btn-speech.speaking').forEach(b => b.classList.remove('speaking'));
                    document.querySelectorAll('.btn-speech-small.speaking').forEach(b => b.classList.remove('speaking'));
                }
            }

            floatStopBtn.addEventListener('click', stopSpeaking);

            // ============================================================
            //  4. RENDER con búsqueda y filtros
            // ============================================================

            const accordionContainer = document.getElementById('accordionContainer');
            let searchTerm = '';
            let filterMode = 'all';

            function renderAll() {
                let html = '';
                let totalWritten = 0;
                let totalTechniques = 0;

                CATEGORIES.forEach((cat, idx) => {
                    let catWritten = 0;
                    let catFiltered = cat.techniques.filter(t => {
                        const e = appState.entries[t.id] || { text: '', written: false };
                        if (e.written) catWritten++;
                        const matchSearch = searchTerm === '' ||
                            t.name.toLowerCase().includes(searchTerm.toLowerCase()) ||
                            t.def.toLowerCase().includes(searchTerm.toLowerCase()) ||
                            t.example.toLowerCase().includes(searchTerm.toLowerCase()) ||
                            t.rhetoric.toLowerCase().includes(searchTerm.toLowerCase());
                        if (filterMode === 'written') return matchSearch && e.written;
                        if (filterMode === 'pending') return matchSearch && !e.written;
                        return matchSearch;
                    });

                    if (catFiltered.length === 0) return;

                    const isOpen = idx === 0 ? 'open' : '';
                    const arrowClass = isOpen ? 'open' : '';

                    html += `
                        <div class="category-item" data-cat="${cat.id}">
                            <div class="category-header" data-target="${cat.id}">
                                <span class="cat-icon">${cat.icon}</span>
                                <span class="cat-title">${cat.name}</span>
                                <span class="cat-count">${catWritten}/${cat.techniques.length}</span>
                                <span class="cat-arrow ${arrowClass}">▾</span>
                            </div>
                            <div class="category-body ${isOpen}" id="body-${cat.id}">
                    `;

                    catFiltered.forEach(t => {
                        const e = appState.entries[t.id] || { text: '', written: false, style: 'normal' };
                        const isWritten = e.written || false;
                        const userText = e.text || '';
                        const style = e.style || 'normal';
                        const styleClass = getStyleClassFor(style);
                        totalTechniques++;
                        if (isWritten) totalWritten++;

                        html += `
                            <div class="tech-card" data-tech-id="${t.id}">
                                <div class="tech-head">
                                    <span class="tech-num">#${String(t.id).padStart(3, '0')}</span>
                                    <span class="tech-name">${t.name}</span>
                                    <span class="tech-rhetoric">${t.rhetoric}</span>
                                    <span class="wax-seal ${isWritten ? 'active' : ''}" style="margin-left:auto;">
                                        <span class="seal-icon">${isWritten ? '🔴' : '○'}</span>
                                        ${isWritten ? 'sellada' : 'pendiente'}
                                    </span>
                                </div>

                                <div class="tech-def">${t.def}</div>

                                <div class="tech-example-box">
                                    <span class="example-text">“${t.example}”</span>
                                    <button class="btn-speech" data-id="${t.id}" data-text="${t.example.replace(/"/g, '')}">🔊</button>
                                </div>

                                <div class="tech-practice-area">
                                    <div class="practice-input-group">
                                        <textarea class="practice-text" data-id="${t.id}" placeholder="escribe tu viñeta o narrativa...">${userText}</textarea>
                                        <div class="practice-preview ${styleClass}" data-id="${t.id}">${userText || ''}</div>
                                    </div>
                                    <div class="tech-actions">
                                        <button class="btn-speech-small" data-id="${t.id}" data-text="${userText || t.example}" title="Escuchar mi texto">🔊</button>
                                        <label>
                                            <input type="checkbox" class="written-check" data-id="${t.id}" ${isWritten ? 'checked' : ''} />
                                            escrito
                                        </label>
                                        <span class="wax-seal ${isWritten ? 'active' : ''}">
                                            <span class="seal-icon">${isWritten ? '🔴' : '○'}</span>
                                        </span>
                                    </div>
                                </div>

                                <div class="style-pills" data-target="${t.id}">
                                    <button class="style-pill ${style === 'normal' ? 'active' : ''}" data-style="normal" data-target="${t.id}">normal</button>
                                    <button class="style-pill ${style === 'spencerian' ? 'active' : ''}" data-style="spencerian" data-target="${t.id}">Spencerian <span class="pill-preview" style="font-family:'Great Vibes',cursive;">Aa</span></button>
                                    <button class="style-pill ${style === 'copperplate' ? 'active' : ''}" data-style="copperplate" data-target="${t.id}">Copperplate <span class="pill-preview" style="font-family:'Alex Brush',cursive;">Aa</span></button>
                                    <button class="style-pill ${style === 'chancery' ? 'active' : ''}" data-style="chancery" data-target="${t.id}">Chancery <span class="pill-preview" style="font-family:'Cedarville Cursive',cursive;">Aa</span></button>
                                    <button class="style-pill ${style === 'palmer' ? 'active' : ''}" data-style="palmer" data-target="${t.id}">Palmer <span class="pill-preview" style="font-family:'Dancing Script',cursive;">Aa</span></button>
                                </div>
                            </div>
                        `;
                    });

                    html += `</div></div>`;
                });

                accordionContainer.innerHTML = html;

                // Actualizar contadores
                document.getElementById('progressNum').textContent = totalWritten;
                document.getElementById('progressBadge').textContent = `${totalWritten}/100`;
                const pct = totalTechniques > 0 ? (totalWritten / totalTechniques) * 100 : 0;
                document.getElementById('progressFill').style.width = `${pct}%`;
                document.getElementById('sealDisplay').textContent = totalWritten === totalTechniques ? '🌟' :
                    totalWritten > 0 ? '✧' : '○';

                // === EVENTOS ===

                // Acordeón
                document.querySelectorAll('.category-header').forEach(header => {
                    header.addEventListener('click', function() {
                        const target = this.dataset.target;
                        const body = document.getElementById(`body-${target}`);
                        const arrow = this.querySelector('.cat-arrow');
                        if (body) {
                            body.classList.toggle('open');
                            if (arrow) arrow.classList.toggle('open');
                        }
                    });
                });

                // Click en tarjeta → abrir modal
                document.querySelectorAll('.tech-card').forEach(card => {
                    card.addEventListener('click', function(e) {
                        if (e.target.closest('button') || e.target.closest('input') || e.target.closest(
                                'label') || e.target.closest('.style-pill') || e.target.closest(
                                '.style-pills')) return;
                        const id = parseInt(this.dataset.techId);
                        openModal(id);
                    });
                });

                // Práctica (textarea)
                document.querySelectorAll('.practice-text').forEach(ta => {
                    ta.addEventListener('input', function() {
                        const id = parseInt(this.dataset.id);
                        const val = this.value;
                        if (!appState.entries[id]) appState.entries[id] = { text: '', written: false,
                            style: 'normal' };
                        appState.entries[id].text = val;
                        saveState();
                        const preview = document.querySelector(`.practice-preview[data-id="${id}"]`);
                        if (preview) {
                            preview.textContent = val || '';
                            const style = appState.entries[id].style || 'normal';
                            preview.className = `practice-preview ${getStyleClassFor(style)}`;
                        }
                        const btn = document.querySelector(`.btn-speech-small[data-id="${id}"]`);
                        if (btn) btn.dataset.text = val || '';
                    });
                });

                // Checkbox "escrito"
                document.querySelectorAll('.written-check').forEach(cb => {
                    cb.addEventListener('change', function() {
                        const id = parseInt(this.dataset.id);
                        const checked = this.checked;
                        if (!appState.entries[id]) appState.entries[id] = { text: '', written: false,
                            style: 'normal' };
                        appState.entries[id].written = checked;
                        saveState();
                        renderAll();
                        renderExercise();
                        renderQuiz();
                        if (modalOpen && modalId === id) {
                            updateModalContent(id);
                        }
                    });
                });

                // Botones de escuchar (ejemplo)
                document.querySelectorAll('.btn-speech').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = parseInt(this.dataset.id);
                        const text = this.dataset.text;
                        if (!text) return;
                        speakText(text, id);
                    });
                });

                // Botones de escuchar (texto del usuario)
                document.querySelectorAll('.btn-speech-small').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = parseInt(this.dataset.id);
                        let text = this.dataset.text;
                        if (!text || text.trim() === '') {
                            const exampleBtn = document.querySelector(`.btn-speech[data-id="${id}"]`);
                            if (exampleBtn) text = exampleBtn.dataset.text || '';
                        }
                        if (!text) return;
                        speakText(text, id);
                    });
                });

                // Estilos
                document.querySelectorAll('.style-pill').forEach(pill => {
                    pill.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const targetId = parseInt(this.dataset.target);
                        const style = this.dataset.style;
                        if (!appState.entries[targetId]) appState.entries[targetId] = { text: '',
                            written: false, style: 'normal' };
                        appState.entries[targetId].style = style;
                        saveState();
                        const preview = document.querySelector(`.practice-preview[data-id="${targetId}"]`);
                        if (preview) {
                            preview.className = `practice-preview ${getStyleClassFor(style)}`;
                        }
                        const parent = this.closest('.style-pills');
                        parent.querySelectorAll('.style-pill').forEach(p => p.classList.remove('active'));
                        this.classList.add('active');
                        if (modalOpen && modalId === targetId) {
                            updateModalContent(targetId);
                        }
                    });
                });

                saveState();
            }

            // ============================================================
            //  5. FUNCIONES DE ESTILO
            // ============================================================

            function getStyleClassFor(style) {
                switch (style) {
                    case 'spencerian':
                        return 'preview-spencerian';
                    case 'copperplate':
                        return 'preview-copperplate';
                    case 'chancery':
                        return 'preview-chancery';
                    case 'palmer':
                        return 'preview-palmer';
                    default:
                        return 'preview-normal';
                }
            }

            // ============================================================
            //  6. MODAL INTERACTIVO
            // ============================================================

            const modalOverlay = document.getElementById('modalOverlay');
            const modalClose = document.getElementById('modalClose');
            const modalBody = document.getElementById('modalBody');
            let modalOpen = false;
            let modalId = null;

            function openModal(id) {
                modalId = id;
                modalOpen = true;
                updateModalContent(id);
                modalOverlay.classList.add('open');
                document.body.style.overflow = 'hidden';
            }

            function updateModalContent(id) {
                const tech = findTechnique(id);
                if (!tech) return;
                const e = appState.entries[id] || { text: '', written: false, style: 'normal' };
                const isWritten = e.written || false;
                const userText = e.text || '';
                const style = e.style || 'normal';
                const styleClass = getStyleClassFor(style);

                modalBody.innerHTML = `
                    <div class="modal-head">
                        <span class="modal-num">#${String(tech.id).padStart(3, '0')}</span>
                        <span class="modal-title">${tech.name}</span>
                        <span class="modal-rhetoric">${tech.rhetoric}</span>
                        <span class="wax-seal-modal ${isWritten ? 'active' : ''}" style="margin-left:auto;">
                            <span class="seal-icon">${isWritten ? '🔴' : '○'}</span>
                            ${isWritten ? 'sellada' : 'pendiente'}
                        </span>
                    </div>
                    <div class="modal-def">${tech.def}</div>
                    <div class="modal-example"><strong>Ejemplo:</strong> “${tech.example}”</div>
                    <div class="modal-practice-area">
                        <label style="font-size:0.75rem;color:var(--tinta-gris);">✧ escribe tu propia viñeta o narrativa</label>
                        <textarea id="modalPracticeText" data-id="${tech.id}" placeholder="Escribe tu texto aquí...">${userText}</textarea>
                        <div class="modal-style-pills">
                            <button class="style-pill ${style === 'normal' ? 'active' : ''}" data-style="normal" data-target="${tech.id}">normal</button>
                            <button class="style-pill ${style === 'spencerian' ? 'active' : ''}" data-style="spencerian" data-target="${tech.id}">Spencerian <span class="pill-preview" style="font-family:'Great Vibes',cursive;">Aa</span></button>
                            <button class="style-pill ${style === 'copperplate' ? 'active' : ''}" data-style="copperplate" data-target="${tech.id}">Copperplate <span class="pill-preview" style="font-family:'Alex Brush',cursive;">Aa</span></button>
                            <button class="style-pill ${style === 'chancery' ? 'active' : ''}" data-style="chancery" data-target="${tech.id}">Chancery <span class="pill-preview" style="font-family:'Cedarville Cursive',cursive;">Aa</span></button>
                            <button class="style-pill ${style === 'palmer' ? 'active' : ''}" data-style="palmer" data-target="${tech.id}">Palmer <span class="pill-preview" style="font-family:'Dancing Script',cursive;">Aa</span></button>
                        </div>
                        <div class="modal-preview ${styleClass}" id="modalPreview">${userText || ''}</div>
                    </div>
                    <div class="modal-actions-bottom">
                        <button class="btn-modal" id="modalSpeakBtn">🔊 escuchar</button>
                        <button class="btn-modal primary" id="modalSaveBtn">💾 guardar</button>
                        <label style="display:flex;align-items:center;gap:0.3rem;font-size:0.55rem;color:var(--tinta-gris);cursor:pointer;margin-left:0.5rem;">
                            <input type="checkbox" id="modalWrittenCheck" ${isWritten ? 'checked' : ''} />
                            escrito
                        </label>
                        <span class="wax-seal-modal ${isWritten ? 'active' : ''}">
                            <span class="seal-icon">${isWritten ? '🔴' : '○'}</span>
                            ${isWritten ? 'sellado' : 'sin sello'}
                        </span>
                    </div>
                `;

                // Eventos del modal
                const modalTextarea = document.getElementById('modalPracticeText');
                const modalPreview = document.getElementById('modalPreview');

                modalTextarea.addEventListener('input', function() {
                    const val = this.value;
                    const id = parseInt(this.dataset.id);
                    if (!appState.entries[id]) appState.entries[id] = { text: '', written: false,
                        style: 'normal' };
                    appState.entries[id].text = val;
                    saveState();
                    if (modalPreview) {
                        modalPreview.textContent = val || '';
                        const style = appState.entries[id].style || 'normal';
                        modalPreview.className = `modal-preview ${getStyleClassFor(style)}`;
                    }
                    const cardPreview = document.querySelector(`.practice-preview[data-id="${id}"]`);
                    if (cardPreview) {
                        cardPreview.textContent = val || '';
                        const style = appState.entries[id].style || 'normal';
                        cardPreview.className = `practice-preview ${getStyleClassFor(style)}`;
                    }
                    const speakBtn = document.getElementById('modalSpeakBtn');
                    if (speakBtn) speakBtn.dataset.text = val || '';
                });

                modalBody.querySelectorAll('.modal-style-pills .style-pill').forEach(pill => {
                    pill.addEventListener('click', function() {
                        const targetId = parseInt(this.dataset.target);
                        const style = this.dataset.style;
                        if (!appState.entries[targetId]) appState.entries[targetId] = { text: '',
                            written: false, style: 'normal' };
                        appState.entries[targetId].style = style;
                        saveState();
                        if (modalPreview) {
                            modalPreview.className = `modal-preview ${getStyleClassFor(style)}`;
                        }
                        const cardPreview = document.querySelector(`.practice-preview[data-id="${targetId}"]`);
                        if (cardPreview) {
                            cardPreview.className = `practice-preview ${getStyleClassFor(style)}`;
                        }
                        const parent = this.closest('.modal-style-pills');
                        parent.querySelectorAll('.style-pill').forEach(p => p.classList.remove('active'));
                        this.classList.add('active');
                        const cardPills = document.querySelector(`.style-pills[data-target="${targetId}"]`);
                        if (cardPills) {
                            cardPills.querySelectorAll('.style-pill').forEach(p => p.classList.remove('active'));
                            cardPills.querySelectorAll('.style-pill').forEach(p => {
                                if (p.dataset.style === style) p.classList.add('active');
                            });
                        }
                    });
                });

                document.getElementById('modalSpeakBtn').addEventListener('click', function() {
                    const id = parseInt(this.dataset.id || modalId);
                    const text = modalTextarea.value.trim() || findTechnique(id).example;
                    if (text) speakText(text, id);
                });

                document.getElementById('modalSaveBtn').addEventListener('click', function() {
                    const id = parseInt(modalId);
                    const val = modalTextarea.value.trim();
                    if (!appState.entries[id]) appState.entries[id] = { text: '', written: false,
                        style: 'normal' };
                    appState.entries[id].text = val;
                    saveState();
                    const cardPreview = document.querySelector(`.practice-preview[data-id="${id}"]`);
                    if (cardPreview) {
                        cardPreview.textContent = val || '';
                        const style = appState.entries[id].style || 'normal';
                        cardPreview.className = `practice-preview ${getStyleClassFor(style)}`;
                    }
                    const cardSpeakBtn = document.querySelector(`.btn-speech-small[data-id="${id}"]`);
                    if (cardSpeakBtn) cardSpeakBtn.dataset.text = val || '';
                    const btn = this;
                    const origText = btn.innerHTML;
                    btn.innerHTML = '✓ guardado';
                    btn.style.background = 'rgba(212,42,42,0.05)';
                    setTimeout(() => {
                        btn.innerHTML = origText;
                        btn.style.background = '';
                    }, 1200);
                });

                document.getElementById('modalWrittenCheck').addEventListener('change', function() {
                    const id = parseInt(modalId);
                    const checked = this.checked;
                    if (!appState.entries[id]) appState.entries[id] = { text: '', written: false,
                        style: 'normal' };
                    appState.entries[id].written = checked;
                    saveState();
                    const cardCheck = document.querySelector(`.written-check[data-id="${id}"]`);
                    if (cardCheck) cardCheck.checked = checked;
                    const seal = document.querySelector(`.wax-seal[data-tech-id="${id}"]`);
                    if (seal) {
                        const icon = seal.querySelector('.seal-icon');
                        if (icon) icon.textContent = checked ? '🔴' : '○';
                        seal.classList.toggle('active', checked);
                    }
                    modalBody.querySelectorAll('.wax-seal-modal').forEach(s => {
                        s.classList.toggle('active', checked);
                        const icon = s.querySelector('.seal-icon');
                        if (icon) icon.textContent = checked ? '🔴' : '○';
                        const label = s.textContent.trim();
                        if (label === 'sellada' || label === 'sin sello' || label === 'sellado' || label ===
                            'pendiente') {
                            s.innerHTML =
                                `<span class="seal-icon">${checked ? '🔴' : '○'}</span> ${checked ? 'sellada' : 'pendiente'}`;
                        }
                    });
                    renderAll();
                    renderExercise();
                    renderQuiz();
                });
            }

            function findTechnique(id) {
                for (const cat of CATEGORIES) {
                    for (const t of cat.techniques) {
                        if (t.id === id) return t;
                    }
                }
                return null;
            }

            modalClose.addEventListener('click', function() {
                modalOverlay.classList.remove('open');
                document.body.style.overflow = '';
                modalOpen = false;
                modalId = null;
                stopSpeaking();
            });

            modalOverlay.addEventListener('click', function(e) {
                if (e.target === this) {
                    modalOverlay.classList.remove('open');
                    document.body.style.overflow = '';
                    modalOpen = false;
                    modalId = null;
                    stopSpeaking();
                }
            });

            // ============================================================
            //  7. EJERCICIOS INTERACTIVOS
            // ============================================================

            const exercises = [{
                id: 1,
                prompt: 'Diseña un storyboard de 4 viñetas para una escena de acción. Describe el plano, el encuadre y el movimiento de cada viñeta.',
                hint: 'Piensa en una escena de persecución o pelea. Usa planos cinematográficos (general, medio, primer plano) para guiar al lector.'
            }, {
                id: 2,
                prompt: 'Crea un diálogo entre dos personajes usando globos de diálogo. Muestra la personalidad de cada uno a través de su forma de hablar y las expresiones faciales.',
                hint: 'Un personaje puede ser sarcástico, otro serio. Usa la tipografía y la forma del globo para reflejar sus emociones.'
            }, {
                id: 3,
                prompt: 'Diseña una viñeta splash para un momento clave de una historia. Describe la composición, el color y la atmósfera que quieres crear.',
                hint: 'La viñeta splash debe tener un gran impacto visual. Piensa en un momento de revelación o clímax.'
            }, {
                id: 4,
                prompt: 'Crea una secuencia de viñetas que muestre el paso del tiempo (flashback o flash-forward) de manera visual, sin usar texto narrativo.',
                hint: 'Usa el diseño de la viñeta, el color y la composición para indicar el cambio de tiempo. Por ejemplo, sepia para el pasado.'
            }, {
                id: 5,
                prompt: 'Escribe la descripción de una novela gráfica de realismo mágico. Define el género, la trama y el estilo visual que usarías.',
                hint: 'Combina elementos cotidianos con lo fantástico. Piensa en un estilo de dibujo que refleje esa mezcla, como acuarela o dibujo a línea.'
            }];

            let currentExercise = 0;
            let exerciseFeedback = '';

            function renderExercise() {
                const container = document.getElementById('exerciseContent');
                const ex = exercises[currentExercise];
                const totalW = Object.values(appState.entries).filter(e => e.written).length;

                let html = `
                    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:0.3rem;margin-bottom:0.5rem;">
                        <span style="font-family:var(--font-cinzel);font-size:0.7rem;color:var(--tinta-gris);">ejercicio ${currentExercise+1} de ${exercises.length}</span>
                        <span style="font-family:var(--font-serif);font-size:0.6rem;color:var(--tinta-gris);">técnicas escritas: ${totalW}/100</span>
                    </div>
                    <div class="exercise-prompt">${ex.prompt}</div>
                    <div style="font-size:0.7rem;color:var(--tinta-gris);opacity:0.4;margin-bottom:0.4rem;">💡 ${ex.hint}</div>
                    <textarea class="exercise-input" id="exerciseInput" placeholder="Escribe tu texto aquí..."></textarea>
                    <div class="exercise-actions">
                        <button class="btn-exercise" id="exercisePrevBtn">◀ anterior</button>
                        <button class="btn-exercise" id="exerciseNextBtn">siguiente ▶</button>
                        <button class="btn-exercise primary" id="exerciseCheckBtn">🔍 revisar</button>
                        <button class="btn-exercise" id="exerciseSaveBtn">💾 guardar</button>
                    </div>
                    <div class="exercise-feedback" id="exerciseFeedback">${exerciseFeedback || 'Escribe tu texto y presiona "revisar" para obtener retroalimentación.'}</div>
                `;

                container.innerHTML = html;

                document.getElementById('exercisePrevBtn').addEventListener('click', function() {
                    if (currentExercise > 0) { currentExercise--;
                        exerciseFeedback = '';
                        renderExercise(); }
                });
                document.getElementById('exerciseNextBtn').addEventListener('click', function() {
                    if (currentExercise < exercises.length - 1) { currentExercise++;
                        exerciseFeedback = '';
                        renderExercise(); }
                });

                document.getElementById('exerciseCheckBtn').addEventListener('click', function() {
                    const text = document.getElementById('exerciseInput').value.trim();
                    if (!text) {
                        exerciseFeedback = '✧ Escribe algo antes de revisar.';
                        renderExercise();
                        return;
                    }
                    const words = text.split(/\s+/);
                    const wordCount = words.length;
                    const hasVisual = /\b(viñeta|plano|composición|color|dibujo|storyboard)\b/i.test(text);
                    const hasNarrative = /\b(personaje|diálogo|acción|escena|clímax|narración)\b/i.test(text);
                    const isDescriptive = wordCount > 10;

                    let feedback = '✧ ';
                    if (!isDescriptive) feedback += 'Intenta extender tu descripción con más detalles visuales y narrativos. ';
                    else feedback += 'Bien, has escrito con extensión. ';

                    if (hasVisual) feedback += 'Incluyes elementos visuales, excelente para una novela gráfica. ';
                    else feedback += 'Añade referencias a lo visual (composición, color, viñetas). ';

                    if (hasNarrative) feedback += 'Muy bien, incluyes elementos narrativos. ';
                    else feedback += 'Añade elementos narrativos (personajes, diálogo, acción). ';

                    feedback += '✧';

                    const tempId = 999;
                    if (!appState.entries[tempId]) appState.entries[tempId] = { text: '', written: false,
                        style: 'normal' };
                    appState.entries[tempId].text = text;
                    saveState();

                    exerciseFeedback = feedback;
                    renderExercise();
                    document.getElementById('exerciseInput').value = text;
                });

                document.getElementById('exerciseSaveBtn').addEventListener('click', function() {
                    const text = document.getElementById('exerciseInput').value.trim();
                    if (!text) { exerciseFeedback = '✧ Escribe algo para guardar.';
                        renderExercise(); return; }
                    const tempId = 999;
                    if (!appState.entries[tempId]) appState.entries[tempId] = { text: '', written: false,
                        style: 'normal' };
                    appState.entries[tempId].text = text;
                    saveState();
                    exerciseFeedback = '✧ Texto guardado en tu cuaderno. ✧';
                    renderExercise();
                    document.getElementById('exerciseInput').value = text;
                });

                const saved = appState.entries[999];
                if (saved && saved.text) {
                    document.getElementById('exerciseInput').value = saved.text;
                }
            }

            // ============================================================
            //  8. QUIZ
            // ============================================================

            const quizQuestions = [{
                question: '¿Qué técnica consiste en una viñeta que ocupa toda la página para un impacto visual máximo?',
                options: ['Viñeta panorámica', 'Viñeta splash', 'Viñeta vertical', 'Viñeta sin bordes'],
                correct: 1
            }, {
                question: '¿Cómo se llama el espacio entre viñetas que el lector rellena con su imaginación?',
                options: ['Gutter', 'Splash', 'Panel', 'Storyboard'],
                correct: 0
            }, {
                question: '¿Qué técnica de diálogo usa globos con formas especiales para indicar emociones?',
                options: ['Bocadillo con forma', 'Globo de pensamiento', 'Onomatopeya', 'Diálogo interno'],
                correct: 0
            }, {
                question: '¿Qué técnica de dibujo utiliza líneas entrecruzadas para crear tonos y texturas?',
                options: ['Hatching', 'Cross-hatching', 'Bordado de tinta', 'Acuarela'],
                correct: 1
            }, {
                question: '¿Qué género de novela gráfica narra la vida del autor?',
                options: ['Novela gráfica autobiográfica', 'Novela gráfica histórica', 'Novela gráfica de superhéroes',
                    'Novela gráfica de ciencia ficción'
                ],
                correct: 0
            }, {
                question: '¿Qué técnica de color utiliza el blanco y negro para crear atmósfera de drama?',
                options: ['Paleta monocromática', 'Color plano', 'Uso del blanco y negro', 'Color simbólico'],
                correct: 2
            }, {
                question: '¿Qué técnica narrativa consiste en saltos temporales no lineales?',
                options: ['Narración no lineal', 'Pausa narrativa', 'Montaje cinematográfico', 'Transición temporal'],
                correct: 0
            }, {
                question: '¿Qué técnica de diseño de personaje usa animales con características humanas?',
                options: ['Antropomorfismo', 'Silueta reconocible', 'Personaje sin rostro', 'Multiplicidad de personajes'],
                correct: 0
            }, {
                question: '¿Qué técnica de viñeta imita el formato de cine para crear una experiencia visual inmersiva?',
                options: ['Estilo cinematográfico', 'Viñeta panorámica', 'Viñeta splash', 'Gutter'],
                correct: 0
            }, {
                question: '¿Qué técnica experimental usa la metanarrativa para reflexionar sobre la novela gráfica?',
                options: ['Metanarrativa', 'Novela gráfica experimental', 'Poesía visual', 'Novela gráfica sin diálogos'],
                correct: 0
            }];

            let currentQuiz = 0;
            let quizFeedback = '';
            let quizAnswered = false;

            function renderQuiz() {
                const container = document.getElementById('quizContent');
                const q = quizQuestions[currentQuiz];

                let html = `
                    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:0.3rem;margin-bottom:0.5rem;">
                        <span style="font-family:var(--font-cinzel);font-size:0.7rem;color:var(--tinta-gris);">pregunta ${currentQuiz+1} de ${quizQuestions.length}</span>
                        <span style="font-family:var(--font-serif);font-size:0.6rem;color:var(--tinta-gris);">aciertos: ${getQuizScore()}</span>
                    </div>
                    <div class="quiz-question">${q.question}</div>
                    <div class="quiz-options">
                `;

                q.options.forEach((opt, idx) => {
                    const checked = quizAnswered && idx === q.correct ? 'checked' : '';
                    html += `
                        <label>
                            <input type="radio" name="quizOption" value="${idx}" ${checked} ${quizAnswered ? 'disabled' : ''} />
                            ${opt}
                        </label>
                    `;
                });

                html += `
                    </div>
                    <div class="quiz-actions">
                        <button class="btn-quiz" id="quizPrevBtn">◀ anterior</button>
                        <button class="btn-quiz" id="quizNextBtn">siguiente ▶</button>
                        <button class="btn-quiz primary" id="quizCheckBtn">${quizAnswered ? 'respondida' : 'responder'}</button>
                    </div>
                    <div class="quiz-result" id="quizFeedback">${quizFeedback || 'Selecciona una opción y presiona "responder".'}</div>
                `;

                container.innerHTML = html;

                document.getElementById('quizPrevBtn').addEventListener('click', function() {
                    if (currentQuiz > 0) { currentQuiz--;
                        quizFeedback = '';
                        quizAnswered = false;
                        renderQuiz(); }
                });
                document.getElementById('quizNextBtn').addEventListener('click', function() {
                    if (currentQuiz < quizQuestions.length - 1) { currentQuiz++;
                        quizFeedback = '';
                        quizAnswered = false;
                        renderQuiz(); }
                });

                document.getElementById('quizCheckBtn').addEventListener('click', function() {
                    const selected = document.querySelector('input[name="quizOption"]:checked');
                    if (!selected) {
                        quizFeedback = '✧ Selecciona una opción.';
                        renderQuiz();
                        return;
                    }
                    const value = parseInt(selected.value);
                    const isCorrect = value === q.correct;
                    quizAnswered = true;

                    if (isCorrect) {
                        quizFeedback =
                            `<span class="correct">✓ Correcto. ¡Bien hecho!</span> ${q.options[q.correct]}`;
                        const score = JSON.parse(localStorage.getItem('quiz_score_graphica') || '[]');
                        score.push({ q: currentQuiz, correct: true });
                        localStorage.setItem('quiz_score_graphica', JSON.stringify(score));
                    } else {
                        quizFeedback =
                            `<span class="incorrect">✗ Incorrecto.</span> La respuesta correcta es: ${q.options[q.correct]}`;
                        const score = JSON.parse(localStorage.getItem('quiz_score_graphica') || '[]');
                        score.push({ q: currentQuiz, correct: false });
                        localStorage.setItem('quiz_score_graphica', JSON.stringify(score));
                    }
                    renderQuiz();
                });

                const score = JSON.parse(localStorage.getItem('quiz_score_graphica') || '[]');
                const existing = score.find(s => s.q === currentQuiz);
                if (existing && existing.correct !== undefined) {
                    quizAnswered = true;
                    if (existing.correct) {
                        quizFeedback = `<span class="correct">✓ Ya acertaste esta pregunta.</span>`;
                    } else {
                        quizFeedback =
                            `<span class="incorrect">✗ Fallaste esta pregunta. Inténtalo de nuevo.</span>`;
                        quizAnswered = false;
                        const radio = document.querySelector('input[name="quizOption"]');
                        if (radio) radio.disabled = false;
                    }
                    renderQuiz();
                }
            }

            function getQuizScore() {
                const score = JSON.parse(localStorage.getItem('quiz_score_graphica') || '[]');
                return score.filter(s => s.correct).length;
            }

            // ============================================================
            //  9. TABS
            // ============================================================

            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    const target = this.dataset.tab;
                    document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
                    document.getElementById(target).classList.add('active');

                    if (target === 'tab-ejercicios') renderExercise();
                    if (target === 'tab-quiz') renderQuiz();
                    if (target === 'tab-tecnicas') {
                        if (modalOpen) {
                            modalOverlay.classList.remove('open');
                            document.body.style.overflow = '';
                            modalOpen = false;
                            modalId = null;
                            stopSpeaking();
                        }
                    }
                });
            });

            // ============================================================
            //  10. BÚSQUEDA Y FILTROS
            // ============================================================

            document.getElementById('searchInput').addEventListener('input', function() {
                searchTerm = this.value;
                renderAll();
            });

            document.getElementById('filterAllBtn').addEventListener('click', function() {
                filterMode = 'all';
                document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                renderAll();
            });
            document.getElementById('filterWrittenBtn').addEventListener('click', function() {
                filterMode = 'written';
                document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                renderAll();
            });
            document.getElementById('filterPendingBtn').addEventListener('click', function() {
                filterMode = 'pending';
                document.querySelectorAll('.btn-filter').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                renderAll();
            });
            document.getElementById('filterAllBtn').classList.add('active');

            // ============================================================
            //  11. RESET
            // ============================================================

            document.getElementById('resetAllBtn').addEventListener('click', function() {
                if (confirm('¿Limpiar todas las entradas del cuaderno?')) {
                    appState = { entries: {} };
                    CATEGORIES.forEach(cat => {
                        cat.techniques.forEach(t => {
                            appState.entries[t.id] = { text: '', written: false, style: 'normal' };
                        });
                    });
                    saveState();
                    localStorage.removeItem('quiz_score_graphica');
                    renderAll();
                    renderExercise();
                    renderQuiz();
                    stopSpeaking();
                    if (modalOpen) {
                        modalOverlay.classList.remove('open');
                        document.body.style.overflow = '';
                        modalOpen = false;
                        modalId = null;
                    }
                }
            });

            // ============================================================
            //  12. INICIO
            // ============================================================

            renderAll();
            renderExercise();
            renderQuiz();

            console.log('🎨 GRAPHICA cargada. 100 técnicas de novela gráfica.');
            const totalW = Object.values(appState.entries).filter(e => e.written).length;
            console.log(`📊 ${totalW}/100 técnicas escritas.`);

        })();
    </script>

</body>
</html>
