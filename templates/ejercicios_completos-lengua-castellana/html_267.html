<div class="dashboard-container">
    <!-- Resumen rápido -->
    <div class="row g-3 mb-4">
        <div class="col-md-3">
            <div class="stat-card">
                <div class="stat-icon">📚</div>
                <div class="stat-number" id="stat-tecnicas">0</div>
                <div class="stat-label">Técnicas completadas</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card">
                <div class="stat-icon">🔥</div>
                <div class="stat-number" id="stat-racha">0</div>
                <div class="stat-label">Racha actual (días)</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card">
                <div class="stat-icon">🏆</div>
                <div class="stat-number" id="stat-logros">0</div>
                <div class="stat-label">Logros desbloqueados</div>
            </div>
        </div>
        <div class="col-md-3">
            <div class="stat-card">
                <div class="stat-icon">⭐</div>

                <div class="stat-label">Puntos totales</div>
            </div>
        </div>

    <!-- Gráficos -->

                <canvas id="chart-logros"></canvas>
            </div>
        </div>
    </div>
    
    <div class="row g-3 mt-2">
        <div class="col-md-6">
            <div class="chart-card">
                <h6>📅 Actividad semanal</h6>
                <canvas id="chart-actividad"></canvas>
            </div>
        </div>
        <div class="col-md-6">
            <div class="chart-card">
                <h6>🎯 Niveles de dificultad</h6>
                <canvas id="chart-dificultad"></canvas>
            </div>
        </div>
    </div>
</div>
