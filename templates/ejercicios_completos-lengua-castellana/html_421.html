<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>📖 CUADERNO AUTOBIOGRÁFICO · 100 técnicas para escribir tu vida</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&family=Quicksand:wght@300;400;500;600;700&family=Nunito:wght@300;400;600;700&family=Dancing+Script:wght@400..700&family=Great+Vibes&family=Alex+Brush&family=Cedarville+Cursive&display=swap" rel="stylesheet" />

    <style>
        /* ============================================================
           BASE · ESTILO CUADERNO DE CALIGRAFÍA (pastel)
           ============================================================ */

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        :root {
            --pastel-blue: #d4e8f7;
            --pastel-blue-dark: #b5d4e8;
            --pastel-yellow: #fdf6d3;
            --pastel-yellow-dark: #f5e8b0;
            --pastel-cream: #fcf8f0;
            --pastel-pink: #fce4ec;
            --pastel-mint: #d5f5e3;
            --ink-blue: #2c4a6e;
            --ink-blue-light: #5a7fa8;
            --ink-gray: #8a9bb5;
            --text-dark: #1a2a3a;
            --text-soft: #3d5a78;
            --shadow-soft: rgba(44, 74, 110, 0.08);
            --shadow-medium: rgba(44, 74, 110, 0.12);
            --font-hand: 'Patrick Hand', 'Quicksand', cursive;
            --font-sans: 'Quicksand', 'Nunito', sans-serif;
            --font-spencerian: 'Great Vibes', cursive;
            --font-copperplate: 'Alex Brush', cursive;
            --font-chancery: 'Cedarville Cursive', cursive;
            --font-palmer: 'Dancing Script', cursive;
            --border-radius: 16px;
        }

        body {
            font-family: var(--font-sans);
            background: var(--pastel-cream);
            background-image:
                radial-gradient(ellipse at 20% 30%, var(--pastel-blue) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 70%, var(--pastel-yellow) 0%, transparent 50%);
            min-height: 100vh;
            padding: 0.8rem;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            color: var(--text-dark);
        }

        /* ── Contenedor principal ── */
        .notebook {
            max-width: 1200px;
            width: 100%;
            background: var(--pastel-cream);
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 27px, rgba(180, 200, 220, 0.12) 27px, rgba(180, 200, 220, 0.12) 28px);
            border-radius: var(--border-radius);
            box-shadow:
                0 4px 40px var(--shadow-medium),
                inset 0 0 60px rgba(255, 255, 255, 0.4);
            padding: 1.8rem 1.8rem 1.2rem;
            position: relative;
            border: 2px solid var(--pastel-blue-dark);
        }

        .notebook::before {
            content: '';
            position: absolute;
            inset: 6px;
            border: 1px dashed rgba(180, 200, 220, 0.3);
            border-radius: 12px;
            pointer-events: none;
        }

        .notebook::after {
            content: '✧ ✧ ✧';
            position: absolute;
            bottom: -10px;
            left: 50%;
            transform: translateX(-50%);
            color: var(--pastel-blue-dark);
            font-size: 0.6rem;
            letter-spacing: 6px;
            background: var(--pastel-cream);
            padding: 0 1rem;
            font-family: var(--font-hand);
            opacity: 0.4;
        }

        /* ============================================================
           ENCABEZADO
           ============================================================ */

        .app-header {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 0.5rem 1rem;
            margin-bottom: 1rem;
            padding-bottom: 0.6rem;
            border-bottom: 2px dotted var(--pastel-blue-dark);
        }

        .app-header h1 {
            font-family: var(--font-hand);
            font-weight: 700;
            font-size: 1.8rem;
            color: var(--ink-blue);
            letter-spacing: 0.02em;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .app-header h1 small {
            font-family: var(--font-sans);
            font-size: 0.65rem;
            font-weight: 400;
            color: var(--ink-gray);
            letter-spacing: 0.06em;
        }

        .app-header .header-actions {
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        .btn-notebook {
            font-family: var(--font-sans);
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0.3rem 1.2rem;
            border-radius: 30px;
            border: 2px solid var(--pastel-blue-dark);
            background: rgba(255, 255, 255, 0.4);
            color: var(--ink-blue);
            cursor: pointer;
            transition: all 0.3s;
            backdrop-filter: blur(4px);
        }

        .btn-notebook:hover {
            background: rgba(255, 255, 255, 0.7);
            border-color: var(--ink-blue);
            box-shadow: 0 2px 12px var(--shadow-soft);
        }

        .btn-notebook.primary {
            background: var(--pastel-blue);
            border-color: var(--pastel-blue-dark);
        }

        .btn-notebook.primary:hover {
            background: var(--pastel-blue-dark);
        }

        .btn-notebook.yellow {
            background: var(--pastel-yellow);
            border-color: var(--pastel-yellow-dark);
        }

        .btn-notebook.yellow:hover {
            background: var(--pastel-yellow-dark);
        }

        /* ============================================================
           PESTAÑAS
           ============================================================ */

        .tab-bar {
            display: flex;
            gap: 0.1rem;
            border-bottom: 2px solid var(--pastel-blue-dark);
            margin-bottom: 1.2rem;
            padding-bottom: 0.1rem;
            flex-wrap: wrap;
        }

        .tab-btn {
            font-family: var(--font-hand);
            font-size: 0.85rem;
            padding: 0.4rem 1.6rem 0.35rem;
            background: transparent;
            border: none;
            border-bottom: 3px solid transparent;
            color: var(--ink-gray);
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 0.02em;
        }

        .tab-btn:hover {
            color: var(--ink-blue);
            background: rgba(255, 255, 255, 0.2);
        }

        .tab-btn.active {
            color: var(--ink-blue);
            border-bottom-color: var(--pastel-blue-dark);
            background: rgba(255, 255, 255, 0.3);
        }

        .tab-btn .badge-progress {
            display: inline-block;
            font-family: var(--font-sans);
            font-size: 0.55rem;
            background: var(--pastel-yellow);
            color: var(--ink-blue);
            border-radius: 30px;
            padding: 0.02rem 0.5rem;
            margin-left: 0.2rem;
            font-weight: 600;
            vertical-align: middle;
            line-height: 1.4;
        }

        .tab-pane {
            display: none;
            animation: fadeIn 0.35s ease;
        }

        .tab-pane.active {
            display: block;
        }

        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(6px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* ============================================================
           PROGRESO
           ============================================================ */

        .progress-summary {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.4rem 1rem;
            background: rgba(255, 255, 255, 0.4);
            border-radius: 12px;
            border: 1px solid var(--pastel-blue-dark);
            margin-bottom: 1rem;
            flex-wrap: wrap;
            backdrop-filter: blur(4px);
        }

        .progress-summary .progress-bar-bg {
            flex: 1;
            min-width: 80px;
            height: 8px;
            background: rgba(180, 200, 220, 0.2);
            border-radius: 30px;
            overflow: hidden;
            border: 1px solid var(--pastel-blue-dark);
        }

        .progress-summary .progress-bar-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--pastel-blue-dark), var(--ink-blue));
            border-radius: 30px;
            transition: width 0.5s ease;
        }

        .progress-summary .progress-text {
            font-family: var(--font-hand);
            font-size: 0.8rem;
            color: var(--ink-blue);
            white-space: nowrap;
        }

        .progress-summary .progress-text strong {
            color: var(--ink-blue);
            font-family: var(--font-sans);
        }

        /* ============================================================
           ACORDEÓN DE TÉCNICAS
           ============================================================ */

        .category-accordion {
            display: flex;
            flex-direction: column;
            gap: 0.4rem;
            max-height: 540px;
            overflow-y: auto;
            padding-right: 0.3rem;
        }

        .category-accordion::-webkit-scrollbar {
            width: 5px;
        }
        .category-accordion::-webkit-scrollbar-track {
            background: var(--pastel-cream);
            border-radius: 30px;
        }
        .category-accordion::-webkit-scrollbar-thumb {
            background: var(--pastel-blue-dark);
            border-radius: 30px;
        }

        .category-item {
            border: 1px solid var(--pastel-blue-dark);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.2);
            overflow: hidden;
            transition: all 0.25s;
            backdrop-filter: blur(2px);
        }

        .category-item:hover {
            border-color: var(--ink-blue);
            box-shadow: 0 2px 16px var(--shadow-soft);
        }

        .category-header {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.6rem 0.8rem;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.15);
            transition: background 0.2s;
            user-select: none;
            flex-wrap: wrap;
        }

        .category-header:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .category-header .cat-icon {
            font-size: 1.2rem;
            color: var(--ink-blue);
            width: 2rem;
            text-align: center;
        }

        .category-header .cat-title {
            font-family: var(--font-hand);
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--ink-blue);
            flex: 1;
        }

        .category-header .cat-count {
            font-size: 0.6rem;
            color: var(--ink-gray);
            background: rgba(255, 255, 255, 0.3);
            padding: 0.02rem 0.6rem;
            border-radius: 30px;
            font-family: var(--font-sans);
            font-weight: 600;
        }

        .category-header .cat-arrow {
            color: var(--ink-gray);
            font-size: 0.7rem;
            transition: transform 0.3s;
        }

        .category-header .cat-arrow.open {
            transform: rotate(180deg);
            color: var(--ink-blue);
        }

        .category-body {
            padding: 0 0.8rem 0.8rem;
            display: none;
            border-top: 1px solid var(--pastel-blue-dark);
            padding-top: 0.5rem;
        }

        .category-body.open {
            display: block;
        }

        /* ============================================================
           TARJETA DE TÉCNICA
           ============================================================ */

        .tech-card {
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
            padding: 0.5rem 0.6rem;
            margin-bottom: 0.25rem;
            border-radius: 10px;
            border-left: 4px solid var(--pastel-yellow-dark);
            background: rgba(255, 255, 255, 0.15);
            transition: background 0.2s;
        }

        .tech-card:hover {
            background: rgba(255, 255, 255, 0.35);
        }

        .tech-card .tech-head {
            display: flex;
            align-items: baseline;
            gap: 0.4rem;
            flex-wrap: wrap;
        }

        .tech-card .tech-num {
            font-family: var(--font-hand);
            font-size: 0.6rem;
            color: var(--ink-gray);
            min-width: 2.2rem;
            font-weight: 600;
        }

        .tech-card .tech-name {
            font-weight: 600;
            font-size: 0.95rem;
            color: var(--ink-blue);
            font-family: var(--font-sans);
        }

        .tech-card .tech-rhetoric {
            font-size: 0.55rem;
            background: var(--pastel-yellow);
            padding: 0.02rem 0.5rem;
            border-radius: 30px;
            color: var(--ink-blue);
            font-style: italic;
            font-weight: 500;
            border: 1px solid var(--pastel-yellow-dark);
        }

        .tech-card .tech-def {
            font-size: 0.8rem;
            color: var(--text-soft);
            line-height: 1.5;
            margin: 0.05rem 0 0.05rem;
            padding-left: 0.1rem;
        }

        .tech-card .tech-example-box {
            font-size: 0.75rem;
            color: var(--text-soft);
            font-style: italic;
            background: rgba(255, 255, 255, 0.3);
            padding: 0.15rem 0.6rem;
            border-radius: 8px;
            border-left: 3px solid var(--pastel-blue-dark);
            margin: 0.05rem 0 0.1rem;
            line-height: 1.6;
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            gap: 0.3rem;
        }

        .tech-card .tech-example-box .example-text {
            flex: 1;
            min-width: 120px;
        }

        .tech-card .tech-example-box .btn-speech {
            font-family: var(--font-sans);
            font-size: 0.5rem;
            padding: 0.05rem 0.5rem;
            border-radius: 30px;
            border: 1px solid var(--pastel-blue-dark);
            background: rgba(255, 255, 255, 0.3);
            color: var(--ink-gray);
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.1rem;
            white-space: nowrap;
        }

        .tech-card .tech-example-box .btn-speech:hover {
            background: rgba(255, 255, 255, 0.6);
            border-color: var(--ink-blue);
            color: var(--ink-blue);
        }

        .tech-card .tech-example-box .btn-speech.speaking {
            color: var(--ink-blue);
            border-color: var(--ink-blue);
            background: var(--pastel-yellow);
        }

        .tech-card .tech-practice-area {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            gap: 0.3rem 0.6rem;
            margin-top: 0.1rem;
            padding-top: 0.2rem;
            border-top: 1px dashed var(--pastel-blue-dark);
        }

        .tech-card .tech-practice-area .practice-input-group {
            flex: 1;
            min-width: 160px;
            display: flex;
            flex-direction: column;
            gap: 0.1rem;
        }

        .tech-card .tech-practice-area .practice-input-group textarea {
            width: 100%;
            background: rgba(255, 255, 255, 0.3);
            border: 1px solid var(--pastel-blue-dark);
            border-radius: 8px;
            padding: 0.2rem 0.5rem;
            font-family: var(--font-sans);
            font-size: 0.75rem;
            color: var(--text-dark);
            resize: vertical;
            min-height: 32px;
            transition: border-color 0.3s;
        }

        .tech-card .tech-practice-area .practice-input-group textarea:focus {
            border-color: var(--ink-blue);
            outline: none;
            box-shadow: 0 0 0 3px rgba(44, 74, 110, 0.05);
        }

        .tech-card .tech-practice-area .practice-input-group .practice-preview {
            font-size: 0.85rem;
            padding: 0.1rem 0.3rem;
            min-height: 1.4rem;
            color: var(--ink-blue);
            border-bottom: 1px solid var(--pastel-blue-dark);
            line-height: 1.6;
            word-break: break-word;
            transition: all 0.15s;
            font-style: italic;
            opacity: 0.5;
        }

        .tech-card .tech-practice-area .practice-input-group .practice-preview:empty::before {
            content: 'tu historia aparecerá aquí...';
            color: var(--ink-gray);
            opacity: 0.3;
            font-size: 0.6rem;
            font-style: italic;
        }

        /* Estilos de caligrafía para previsualización */
        .preview-spencerian {
            font-family: var(--font-spencerian);
            font-style: normal;
            opacity: 1;
        }
        .preview-copperplate {
            font-family: var(--font-copperplate);
            font-style: normal;
            opacity: 1;
        }
        .preview-chancery {
            font-family: var(--font-chancery);
            font-style: normal;
            opacity: 1;
        }
        .preview-palmer {
            font-family: var(--font-palmer);
            font-style: normal;
            opacity: 1;
        }
        .preview-normal {
            font-family: var(--font-sans);
            font-style: italic;
            opacity: 0.5;
        }

        .tech-card .tech-practice-area .tech-actions {
            display: flex;
            align-items: center;
            gap: 0.3rem;
            flex-wrap: wrap;
            padding-top: 0.1rem;
        }

        .tech-card .tech-practice-area .tech-actions .btn-speech-small {
            font-family: var(--font-sans);
            font-size: 0.45rem;
            padding: 0.04rem 0.4rem;
            border-radius: 30px;
            border: 1px solid var(--pastel-blue-dark);
            background: rgba(255, 255, 255, 0.2);
            color: var(--ink-gray);
            cursor: pointer;
            transition: all 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 0.05rem;
        }

        .tech-card .tech-practice-area .tech-actions .btn-speech-small:hover {
            background: rgba(255, 255, 255, 0.5);
            border-color: var(--ink-blue);
            color: var(--ink-blue);
        }

        .tech-card .tech-practice-area .tech-actions .btn-speech-small.speaking {
            color: var(--ink-blue);
            border-color: var(--ink-blue);
            background: var(--pastel-yellow);
        }

        .tech-card .tech-practice-area .tech-actions label {
            display: flex;
            align-items: center;
            gap: 0.15rem;
            font-size: 0.55rem;
            color: var(--ink-gray);
            cursor: pointer;
            font-family: var(--font-sans);
        }

        .tech-card .tech-practice-area .tech-actions input[type="checkbox"] {
            appearance: none;
            width: 0.9rem;
            height: 0.9rem;
            border: 2px solid var(--pastel-blue-dark);
            border-radius: 4px;
            cursor: pointer;
            background: rgba(255, 255, 255, 0.3);
            transition: all 0.15s;
            position: relative;
            flex-shrink: 0;
        }

        .tech-card .tech-practice-area .tech-actions input[type="checkbox"]:checked {
            background: var(--pastel-blue-dark);
            border-color: var(--ink-blue);
        }

        .tech-card .tech-practice-area .tech-actions input[type="checkbox"]:checked::after {
            content: '✓';
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--pastel-cream);
            font-size: 0.6rem;
            font-weight: 700;
        }

        .tech-card .tech-practice-area .tech-actions .wax-seal {
            display: inline-flex;
            align-items: center;
            gap: 0.1rem;
            font-size: 0.5rem;
            color: var(--ink-blue);
            font-weight: 600;
            font-family: var(--font-hand);
            opacity: 0.2;
            transition: opacity 0.3s;
        }

        .tech-card .tech-practice-area .tech-actions .wax-seal.active {
            opacity: 1;
        }

        .tech-card .tech-practice-area .tech-actions .wax-seal .seal-icon {
            font-size: 0.8rem;
        }

        /* ============================================================
           PASTILLAS DE ESTILO (caligrafía)
           ============================================================ */

        .style-pills {
            display: flex;
            flex-wrap: wrap;
            gap: 0.1rem;
            margin: 0.15rem 0 0.05rem;
            padding: 0.1rem 0.2rem;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            border: 1px solid var(--pastel-blue-dark);
        }

        .style-pill {
            font-family: var(--font-sans);
            font-size: 0.4rem;
            font-weight: 600;
            padding: 0.04rem 0.4rem;
            border-radius: 30px;
            border: 1px solid transparent;
            background: transparent;
            color: var(--ink-gray);
            cursor: pointer;
            transition: all 0.2s;
        }

        .style-pill:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: var(--pastel-blue-dark);
            color: var(--ink-blue);
        }

        .style-pill.active {
            background: var(--pastel-yellow);
            border-color: var(--pastel-yellow-dark);
            color: var(--ink-blue);
        }

        .style-pill .pill-preview {
            display: inline-block;
            font-size: 0.6rem;
            margin-left: 0.05rem;
            opacity: 0.3;
        }

        .style-pill.active .pill-preview {
            opacity: 1;
        }

        /* ============================================================
           EJERCICIOS INTERACTIVOS
           ============================================================ */

        .exercise-section {
            background: rgba(255, 255, 255, 0.3);
            border: 1px solid var(--pastel-blue-dark);
            border-radius: 12px;
            padding: 1rem 1.2rem;
            margin-top: 1rem;
            backdrop-filter: blur(4px);
        }

        .exercise-section h3 {
            font-family: var(--font-hand);
            font-size: 1rem;
            color: var(--ink-blue);
            margin-bottom: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }

        .exercise-section .exercise-prompt {
            font-size: 0.85rem;
            color: var(--text-soft);
            margin-bottom: 0.4rem;
            line-height: 1.6;
        }

        .exercise-section .exercise-input {
            width: 100%;
            background: rgba(255, 255, 255, 0.3);
            border: 1px solid var(--pastel-blue-dark);
            border-radius: 8px;
            padding: 0.4rem 0.6rem;
            font-family: var(--font-sans);
            font-size: 0.8rem;
            color: var(--text-dark);
            resize: vertical;
            min-height: 60px;
            transition: border-color 0.3s;
        }

        .exercise-section .exercise-input:focus {
            border-color: var(--ink-blue);
            outline: none;
            box-shadow: 0 0 0 3px rgba(44, 74, 110, 0.05);
        }

        .exercise-section .exercise-actions {
            display: flex;
            gap: 0.4rem;
            margin-top: 0.4rem;
            flex-wrap: wrap;
        }

        .exercise-section .exercise-actions .btn-exercise {
            font-family: var(--font-sans);
            font-size: 0.65rem;
            font-weight: 600;
            padding: 0.2rem 1rem;
            border-radius: 30px;
            border: 1px solid var(--pastel-blue-dark);
            background: rgba(255, 255, 255, 0.3);
            color: var(--ink-blue);
            cursor: pointer;
            transition: all 0.3s;
        }

        .exercise-section .exercise-actions .btn-exercise:hover {
            background: rgba(255, 255, 255, 0.6);
            border-color: var(--ink-blue);
        }

        .exercise-section .exercise-actions .btn-exercise.primary {
            background: var(--pastel-yellow);
            border-color: var(--pastel-yellow-dark);
        }

            //  2. ESTADO

            const STORAGE_KEY = 'cuaderno_autobiografico_100';

            function loadState() {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) return JSON.parse(raw);
                } catch (_) { /* ignore */ }
                return { entries: {} };
            }

            function saveState() {
                try {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(appState));
                } catch (_) { /* ignore */ }
            }

            let appState = loadState();

            // Inicializar técnicas
            CATEGORIES.forEach(cat => {
                cat.techniques.forEach(t => {
                    if (!appState.entries[t.id]) {
                        appState.entries[t.id] = { text: '', written: false, style: 'normal' };
                    }
                });
            });
            saveState();

            // ============================================================
            //  3. VOZ (Web Speech API)
            // ============================================================

            let speechSynth = window.speechSynthesis;
            let isSpeaking = false;
            let speakingId = null;
            const floatStopBtn = document.getElementById('floatStopBtn');

            function speakText(text, id, onStart, onEnd) {
                if (isSpeaking) {
                    speechSynth.cancel();
                    isSpeaking = false;
                    floatStopBtn.classList.remove('visible');
                    if (onEnd) onEnd();
                    setTimeout(() => speakText(text, id, onStart, onEnd), 100);
                    return;
                }

                const utterance = new SpeechSynthesisUtterance(text);
                const voices = speechSynth.getVoices();
                const esVoice = voices.find(v => v.lang.startsWith('es')) || voices[0];
                if (esVoice) utterance.voice = esVoice;
                utterance.lang = 'es-ES';
                utterance.rate = 0.9;
                utterance.pitch = 1;

                utterance.onstart = function() {
                    isSpeaking = true;
                    speakingId = id;
                    floatStopBtn.classList.add('visible');
                    if (onStart) onStart();
                    document.querySelectorAll(`.btn-speech[data-id="${id}"]`).forEach(b => b.classList.add('speaking'));
                    document.querySelectorAll(`.btn-speech-small[data-id="${id}"]`).forEach(b => b.classList.add(
                    'speaking'));
                };

                utterance.onend = function() {
                    isSpeaking = false;
                    speakingId = null;
                    floatStopBtn.classList.remove('visible');
                    if (onEnd) onEnd();
                    document.querySelectorAll('.btn-speech.speaking').forEach(b => b.classList.remove('speaking'));
                    document.querySelectorAll('.btn-speech-small.speaking').forEach(b => b.classList.remove('speaking'));
                };

                utterance.onerror = function() {
                    isSpeaking = false;
                    speakingId = null;
                    floatStopBtn.classList.remove('visible');
                    if (onEnd) onEnd();
                    document.querySelectorAll('.btn-speech.speaking').forEach(b => b.classList.remove('speaking'));
                    document.querySelectorAll('.btn-speech-small.speaking').forEach(b => b.classList.remove('speaking'));
                };

                speechSynth.speak(utterance);
            }

            function stopSpeaking() {
                if (isSpeaking) {
                    speechSynth.cancel();
                    isSpeaking = false;
                    speakingId = null;
                    floatStopBtn.classList.remove('visible');
                    document.querySelectorAll('.btn-speech.speaking').forEach(b => b.classList.remove('speaking'));
                    document.querySelectorAll('.btn-speech-small.speaking').forEach(b => b.classList.remove('speaking'));
                }
            }

            floatStopBtn.addEventListener('click', stopSpeaking);

                                        <span class="wax-seal ${isWritten ? 'active' : ''}">
                                            <span class="seal-icon">${isWritten ? '📖' : '○'}</span>
                                        </span>
                                    </div>
                                </div>

                                <div class="style-pills" data-target="${t.id}">
                                    <button class="style-pill ${style === 'normal' ? 'active' : ''}" data-style="normal" data-target="${t.id}">normal</button>
                                    <button class="style-pill ${style === 'spencerian' ? 'active' : ''}" data-style="spencerian" data-target="${t.id}">Spencerian <span class="pill-preview" style="font-family:'Great Vibes',cursive;">Aa</span></button>
                                    <button class="style-pill ${style === 'copperplate' ? 'active' : ''}" data-style="copperplate" data-target="${t.id}">Copperplate <span class="pill-preview" style="font-family:'Alex Brush',cursive;">Aa</span></button>
                                    <button class="style-pill ${style === 'chancery' ? 'active' : ''}" data-style="chancery" data-target="${t.id}">Chancery <span class="pill-preview" style="font-family:'Cedarville Cursive',cursive;">Aa</span></button>
                                    <button class="style-pill ${style === 'palmer' ? 'active' : ''}" data-style="palmer" data-target="${t.id}">Palmer <span class="pill-preview" style="font-family:'Dancing Script',cursive;">Aa</span></button>
                                </div>
                            </div>
                        `;
                    });

                    html += `</div></div>`;
                });

                accordionContainer.innerHTML = html;

                // Actualizar contadores
                let totalW = 0;
                CATEGORIES.forEach(cat => {
                    cat.techniques.forEach(t => {
                        const e = appState.entries[t.id] || { text: '', written: false };
                        if (e.written) totalW++;
                    });
                });
                document.getElementById('progressNum').textContent = totalW;
                document.getElementById('progressBadge').textContent = `${totalW}/100`;
                const pct = totalTechniques > 0 ? (totalW / totalTechniques) * 100 : 0;
                document.getElementById('progressFill').style.width = `${pct}%`;
                document.getElementById('sealDisplay').textContent = totalW === totalTechniques ? '📖' :
                    totalW > 0 ? '✧' : '○';

                // === EVENTOS ===

                // Acordeón
                document.querySelectorAll('.category-header').forEach(header => {
                    header.addEventListener('click', function() {
                        const target = this.dataset.target;
                        const body = document.getElementById(`body-${target}`);
                        const arrow = this.querySelector('.cat-arrow');
                        if (body) {
                            body.classList.toggle('open');
                            if (arrow) arrow.classList.toggle('open');
                        }
                    });
                });

                // Práctica (textarea)
                document.querySelectorAll('.practice-text').forEach(ta => {
                    ta.addEventListener('input', function() {
                        const id = parseInt(this.dataset.id);
                        const val = this.value;
                        if (!appState.entries[id]) appState.entries[id] = { text: '', written: false,
                            style: 'normal' };
                        appState.entries[id].text = val;
                        saveState();
                        const preview = document.querySelector(`.practice-preview[data-id="${id}"]`);
                        if (preview) {
                            preview.textContent = val || '';
                            const style = appState.entries[id].style || 'normal';
                            preview.className = `practice-preview ${getStyleClassFor(style)}`;
                        }
                        const btn = document.querySelector(`.btn-speech-small[data-id="${id}"]`);
                        if (btn) btn.dataset.text = val || '';
                    });
                });

                // Checkbox "escrita"
                document.querySelectorAll('.written-check').forEach(cb => {
                    cb.addEventListener('change', function() {
                        const id = parseInt(this.dataset.id);
                        const checked = this.checked;
                        if (!appState.entries[id]) appState.entries[id] = { text: '', written: false,
                            style: 'normal' };
                        appState.entries[id].written = checked;
                        saveState();
                        renderAll();
                        renderExercise();
                        renderQuiz();
                    });
                });

                // Botones de escuchar (ejemplo)
                document.querySelectorAll('.btn-speech').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = parseInt(this.dataset.id);
                        const text = this.dataset.text;
                        if (!text) return;
                        speakText(text, id);
                    });
                });

                // Botones de escuchar (texto del usuario)
                document.querySelectorAll('.btn-speech-small').forEach(btn => {
                    btn.addEventListener('click', function(e) {
                        e.stopPropagation();
                        const id = parseInt(this.dataset.id);
                        let text = this.dataset.text;
                        if (!text || text.trim() === '') {
                            const exampleBtn = document.querySelector(`.btn-speech[data-id="${id}"]`);
                            if (exampleBtn) text = exampleBtn.dataset.text || '';
                        }
                        if (!text) return;
                        speakText(text, id);
                    });
                });

                // Estilos
                document.querySelectorAll('.style-pill').forEach(pill => {
                    pill.addEventListener('click', function() {
                        const targetId = parseInt(this.dataset.target);
                        const style = this.dataset.style;
                        if (!appState.entries[targetId]) appState.entries[targetId] = { text: '',
                            written: false, style: 'normal' };
                        appState.entries[targetId].style = style;
                        saveState();
                        const preview = document.querySelector(`.practice-preview[data-id="${targetId}"]`);
                        if (preview) {
                            preview.className = `practice-preview ${getStyleClassFor(style)}`;
                        }
                        const parent = this.closest('.style-pills');
                        parent.querySelectorAll('.style-pill').forEach(p => p.classList.remove('active'));
                        this.classList.add('active');
                    });
                });

                saveState();
            }

            // ============================================================
            //  5. FUNCIONES DE ESTILO
            // ============================================================

            function getStyleClassFor(style) {
                switch (style) {
                    case 'spencerian':
                        return 'preview-spencerian';
                    case 'copperplate':
                        return 'preview-copperplate';
                    case 'chancery':
                        return 'preview-chancery';
                    case 'palmer':
                        return 'preview-palmer';
                    default:
                        return 'preview-normal';
                }
            }

            // ============================================================
            //  6. EJERCICIOS INTERACTIVOS
            // ============================================================

            const exercises = [{
                id: 1,
                prompt: 'Escribe sobre el lugar donde naciste. Describe el paisaje, el clima, los olores, y cómo ese lugar marcó el inicio de tu historia.',
                hint: 'Piensa en los detalles sensoriales: el color del cielo, el sonido del viento, el olor de la tierra.'
            }, {
                id: 2,
                prompt: 'Evoca un recuerdo de la infancia a través de un olor específico. Describe cómo ese olor te transporta en el tiempo.',
                hint: 'El olor a pan, a tierra mojada, a madera vieja... todos pueden ser máquinas del tiempo.'
            }, {
                id: 3,
                prompt: 'Escribe sobre una persona que marcó tu vida. No tiene que ser famosa; puede ser alguien común que te enseñó algo importante.',
                hint: 'Describe su carácter, sus gestos, y lo que aprendiste de ella.'
            }, {
                id: 4,
                prompt: 'Reflexiona sobre un momento de miedo que hayas superado. ¿Cómo era ese miedo? ¿Cómo lograste enfrentarlo?',
                hint: 'El miedo puede ser un monstruo bajo la cama o el miedo al fracaso. Cuéntalo con honestidad.'
            }, {
                id: 5,
                prompt: 'Escribe sobre el primer viaje que hiciste y cómo te cambió. ¿Qué viste, qué sentiste, qué aprendiste?',
                hint: 'No tiene que ser un viaje lejano; puede ser el primer viaje en tren o en coche.'
            }];

            let currentExercise = 0;
            let exerciseFeedback = '';

            function renderExercise() {
                const container = document.getElementById('exerciseContent');
                const ex = exercises[currentExercise];
                const totalW = Object.values(appState.entries).filter(e => e.written).length;

                let html = `
                    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:0.3rem;margin-bottom:0.4rem;">
                        <span style="font-family:var(--font-hand);font-size:0.7rem;color:var(--ink-gray);">ejercicio ${currentExercise+1} de ${exercises.length}</span>
                        <span style="font-family:var(--font-sans);font-size:0.6rem;color:var(--ink-gray);">historias escritas: ${totalW}/100</span>
                    </div>
                    <div class="exercise-prompt">${ex.prompt}</div>
                    <div style="font-size:0.65rem;color:var(--ink-gray);opacity:0.5;margin-bottom:0.3rem;">💡 ${ex.hint}</div>
                    <textarea class="exercise-input" id="exerciseInput" placeholder="Escribe tu historia aquí..."></textarea>
                    <div class="exercise-actions">
                        <button class="btn-exercise" id="exercisePrevBtn">◀ anterior</button>
                        <button class="btn-exercise" id="exerciseNextBtn">siguiente ▶</button>
                        <button class="btn-exercise primary" id="exerciseCheckBtn">🔍 revisar</button>
                        <button class="btn-exercise" id="exerciseSaveBtn">💾 guardar</button>
                    </div>
                    <div class="exercise-feedback" id="exerciseFeedback">${exerciseFeedback || 'Escribe tu historia y presiona "revisar" para obtener retroalimentación.'}</div>
                `;

                container.innerHTML = html;

                // Eventos
                document.getElementById('exercisePrevBtn').addEventListener('click', function() {
                    if (currentExercise > 0) { currentExercise--;
                        exerciseFeedback = '';
                        renderExercise(); }
                });
                document.getElementById('exerciseNextBtn').addEventListener('click', function() {
                    if (currentExercise < exercises.length - 1) { currentExercise++;
                        exerciseFeedback = '';
                        renderExercise(); }
                });

                document.getElementById('exerciseCheckBtn').addEventListener('click', function() {
                    const text = document.getElementById('exerciseInput').value.trim();
                    if (!text) {
                        exerciseFeedback = '✧ Escribe algo antes de revisar.';
                        renderExercise();
                        return;
                    }
                    const words = text.split(/\s+/);
                    const wordCount = words.length;
                    const hasEmotion = /\b(amor|tristeza|alegría|esperanza|miedo|silencio|soledad|gratitud)\b/i.test(text);
                    const hasDetail = /\b(como|semejante|olor|color|sonido|tacto|sabor)\b/i.test(text);
                    const hasTime = /\b(cuando|mientras|antes|después|años|días|recuerdo|memoria)\b/i.test(text);

                    let feedback = '✧ ';
                    if (wordCount < 5) feedback += 'Tu historia es breve. Prueba a extenderla con más detalles. ';
                    else feedback += 'Bien, has escrito con extensión. ';

                    if (hasEmotion) feedback += 'Incluyes emociones, eso da vida a tu historia. ';
                    else feedback += 'Añade algún sentimiento para conectar con el lector. ';

                    if (hasDetail) feedback += 'Usas detalles sensoriales, excelente. ';
                    else feedback += 'Prueba a añadir una imagen sensorial (olor, color, sonido). ';

                    if (hasTime) feedback += 'Mencionas el tiempo, eso ayuda a situar el relato. ';
                    else feedback += 'Añade alguna referencia temporal para dar contexto. ';

                    feedback += '✧';

                    const tempId = 999;
                    if (!appState.entries[tempId]) appState.entries[tempId] = { text: '', written: false,
                        style: 'normal' };
                    appState.entries[tempId].text = text;
                    saveState();

                    exerciseFeedback = feedback;
                    renderExercise();
                    document.getElementById('exerciseInput').value = text;
                });

                document.getElementById('exerciseSaveBtn').addEventListener('click', function() {
                    const text = document.getElementById('exerciseInput').value.trim();
                    if (!text) { exerciseFeedback = '✧ Escribe algo para guardar.';
                        renderExercise(); return; }
                    const tempId = 999;
                    if (!appState.entries[tempId]) appState.entries[tempId] = { text: '', written: false,
                        style: 'normal' };
                    appState.entries[tempId].text = text;
                    saveState();
                    exerciseFeedback = '✧ Historia guardada en tu cuaderno. ✧';
                    renderExercise();
                    document.getElementById('exerciseInput').value = text;
                });

                const saved = appState.entries[999];
                if (saved && saved.text) {
                    document.getElementById('exerciseInput').value = saved.text;
                }
            }

            // ============================================================
            //  7. QUIZ
            // ============================================================

            const quizQuestions = [{
                question: '¿Qué técnica consiste en describir el lugar donde naciste y cómo marcó tu identidad?',
                options: ['El lugar de nacimiento', 'La casa de la infancia', 'El primer viaje', 'La familia'],
                correct: 0
            }, {
                question: '¿Cómo se llama la técnica que evoca un olor del pasado que te transporta en el tiempo?',
                options: ['El olor de la infancia', 'La fotografía borrosa', 'El sabor del pasado', 'El tacto que recuerdo'],
                correct: 0
            }, {
                question: '¿Qué técnica autobiográfica utiliza una reflexión sobre el nombre y su significado?',
                options: ['El nombre que me dieron', 'El primer amor', 'El primer recuerdo', 'La familia'],
                correct: 0
            }, {
                question: '¿Cómo se llama el recurso que consiste en describir el primer viaje que marcó tu vida?',
                options: ['El viaje que me transformó', 'El primer viaje', 'El camino de ida', 'El viaje a solas'],
                correct: 1
            }, {
                question: '¿Qué técnica evoca la pérdida de un ser querido y su legado?',
                options: ['La despedida', 'La pérdida de un ser querido', 'El adiós', 'La elegía'],
                correct: 1
            }, {
                question: '¿Qué recurso consiste en describir un juguete de la infancia y su simbolismo?',
                options: ['El juguete olvidado', 'El objeto de la infancia', 'El recuerdo de la infancia',
                    'El amigo perdido'
                ],
                correct: 0
            }, {
                question: '¿Qué técnica se centra en el proceso de aprender a quererte a ti mismo?',
                options: ['El descubrimiento del amor propio', 'El perdón', 'La aceptación', 'La autoestima'],
                correct: 0
            }, {
                question: '¿Cómo se llama la técnica que habla sobre un sueño que dejaste atrás?',
                options: ['El sueño olvidado', 'El sueño de la infancia', 'El sueño cumplido', 'El sueño compartido'],
                correct: 0
            }, {
                question: '¿Qué técnica reflexiona sobre el presente y lo que significa para ti?',
                options: ['El aquí y ahora', 'La vida que llevo', 'Lo que me hace feliz', 'El futuro que imagino'],
                correct: 0
            }, {
                question: '¿Cómo se llama la técnica que cierra el cuaderno autobiográfico con un nuevo comienzo?',
                options: ['El punto de partida', 'El fin de una etapa', 'El reencuentro', 'El renacimiento'],
                correct: 0
            }];

            let currentQuiz = 0;
            let quizFeedback = '';
            let quizAnswered = false;

            function renderQuiz() {
                const container = document.getElementById('quizContent');
                const q = quizQuestions[currentQuiz];

                let html = `
                    <div style="display:flex;justify-content:space-between;flex-wrap:wrap;gap:0.3rem;margin-bottom:0.4rem;">
                        <span style="font-family:var(--font-hand);font-size:0.7rem;color:var(--ink-gray);">pregunta ${currentQuiz+1} de ${quizQuestions.length}</span>
                        <span style="font-family:var(--font-sans);font-size:0.6rem;color:var(--ink-gray);">aciertos: ${getQuizScore()}</span>
                    </div>
                    <div class="quiz-question">${q.question}</div>
                    <div class="quiz-options">
                `;

                q.options.forEach((opt, idx) => {
                    const checked = quizAnswered && idx === q.correct ? 'checked' : '';
                    html += `
                        <label>
                            <input type="radio" name="quizOption" value="${idx}" ${checked} ${quizAnswered ? 'disabled' : ''} />
                            ${opt}
                        </label>
                    `;
                });

                html += `
                    </div>
                    <div class="quiz-actions">
                        <button class="btn-quiz" id="quizPrevBtn">◀ anterior</button>
                        <button class="btn-quiz" id="quizNextBtn">siguiente ▶</button>
                        <button class="btn-quiz primary" id="quizCheckBtn">${quizAnswered ? 'respondida' : 'responder'}</button>
                    </div>
                    <div class="quiz-result" id="quizFeedback">${quizFeedback || 'Selecciona una opción y presiona "responder".'}</div>
                `;

                container.innerHTML = html;

                document.getElementById('quizPrevBtn').addEventListener('click', function() {
                    if (currentQuiz > 0) { currentQuiz--;
                        quizFeedback = '';
                        quizAnswered = false;
                        renderQuiz(); }
                });
                document.getElementById('quizNextBtn').addEventListener('click', function() {
                    if (currentQuiz < quizQuestions.length - 1) { currentQuiz++;
                        quizFeedback = '';
                        quizAnswered = false;
                        renderQuiz(); }
                });

                document.getElementById('quizCheckBtn').addEventListener('click', function() {
                    const selected = document.querySelector('input[name="quizOption"]:checked');
                    if (!selected) {
                        quizFeedback = '✧ Selecciona una opción.';
                        renderQuiz();
                        return;
                    }
                    const value = parseInt(selected.value);
                    const isCorrect = value === q.correct;
                    quizAnswered = true;

                    if (isCorrect) {
                        quizFeedback =
                            `<span class="correct">✓ Correcto. ¡Bien hecho!</span> ${q.options[q.correct]}`;
                        const score = JSON.parse(localStorage.getItem('quiz_score_autobiografico') || '[]');
                        score.push({ q: currentQuiz, correct: true });
                        localStorage.setItem('quiz_score_autobiografico', JSON.stringify(score));
                    } else {
                        quizFeedback =
                            `<span class="incorrect">✗ Incorrecto.</span> La respuesta correcta es: ${q.options[q.correct]}`;
                        const score = JSON.parse(localStorage.getItem('quiz_score_autobiografico') || '[]');
                        score.push({ q: currentQuiz, correct: false });
                        localStorage.setItem('quiz_score_autobiografico', JSON.stringify(score));
                    }
                    renderQuiz();
                });

                const score = JSON.parse(localStorage.getItem('quiz_score_autobiografico') || '[]');
                const existing = score.find(s => s.q === currentQuiz);
                if (existing && existing.correct !== undefined) {
                    quizAnswered = true;
                    if (existing.correct) {
                        quizFeedback = `<span class="correct">✓ Ya acertaste esta pregunta.</span>`;
                    } else {
                        quizFeedback =
                            `<span class="incorrect">✗ Fallaste esta pregunta. Inténtalo de nuevo.</span>`;
                        quizAnswered = false;
                        const radio = document.querySelector('input[name="quizOption"]');
                        if (radio) radio.disabled = false;
                    }
                    renderQuiz();
                }
            }

            function getQuizScore() {
                const score = JSON.parse(localStorage.getItem('quiz_score_autobiografico') || '[]');
                return score.filter(s => s.correct).length;
            }

            // ============================================================
            //  8. TABS
            // ============================================================

            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
                    this.classList.add('active');
                    const target = this.dataset.tab;
                    document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));
                    document.getElementById(target).classList.add('active');

                    if (target === 'tab-ejercicios') renderExercise();
                    if (target === 'tab-quiz') renderQuiz();
                });
            });

            // ============================================================
            //  9. RESET
            // ============================================================

            document.getElementById('resetAllBtn').addEventListener('click', function() {
                if (confirm('¿Limpiar todas las entradas del cuaderno?')) {
                    appState = { entries: {} };
                    CATEGORIES.forEach(cat => {
                        cat.techniques.forEach(t => {
                            appState.entries[t.id] = { text: '', written: false, style: 'normal' };
                        });
                    });
                    saveState();
                    localStorage.removeItem('quiz_score_autobiografico');
                    renderAll();
                    renderExercise();
                    renderQuiz();
                    stopSpeaking();
                }
            });

            // ============================================================
            //  10. INICIO
            // ============================================================

            renderAll();
            renderExercise();
            renderQuiz();

            console.log('📖 CUADERNO AUTOBIOGRÁFICO cargado. 100 técnicas para escribir tu vida.');
            const totalW = Object.values(appState.entries).filter(e => e.written).length;
            console.log(`📊 ${totalW}/100 historias escritas.`);

        })();
    </script>

</body>
</html>
