<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Academia Puente Digital - Aula Virtual</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .card { border-radius: 15px; border: none; }
        .btn-audio { background-color: #6c5ce7; color: white; transition: 0.3s; }
        .btn-audio:hover { background-color: #a29bfe; transform: scale(1.05); }
    </style>
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-lg p-5">
                    <h2 class="text-center mb-4 text-primary">{{ ejercicio.titulo }}</h2>
                    
                    <div class="text-center mb-4">
                        <button onclick="reproducirVoz()" class="btn btn-audio btn-lg px-5 shadow">
                            🔊 Escuchar la Oración
                        </button>
                    </div>

                    <div class="alert alert-info py-4">
                        <p class="fs-3 text-center mb-0" id="texto-original">
                            {{ ejercicio.configuracion.texto_voz }}
                        </p>
                    </div>

                    <div class="mt-4">
                        <h4 class="mb-3">Pregunta de Sintaxis:</h4>
                        <p class="lead">{{ ejercicio.configuracion.pregunta }}</p>
                        
                        <div class="list-group mt-3">
                            {% for opcion in ejercicio.configuracion.opciones %}
                            <button class="list-group-item list-group-item-action py-3 fs-5" onclick="verificarRespuesta('{{ opcion }}')">
                                {{ opcion }}
                            </button>
                            {% endfor %}
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
    function reproducirVoz() {
        // Obtenemos el texto que guardaste en el JSON
        const texto = "{{ ejercicio.configuracion.texto_voz }}";
        
        // Configuramos el motor de voz del navegador
        const mensaje = new SpeechSynthesisUtterance(texto);
        mensaje.lang = 'es-CO'; // Acento colombiano para el Licenciado
        mensaje.rate = 0.8;     // Velocidad pausada pedagógica
        mensaje.pitch = 1.1;    // Tono claro
        
        window.speechSynthesis.speak(mensaje);
    }

    function verificarRespuesta(seleccion) {
        const correcta = "{{ ejercicio.configuracion.respuesta_correcta }}";
        if (seleccion === correcta) {
            alert("¡Excelente, Hernán! Respuesta correcta.");
        } else {
            alert("Sigue intentando. Recuerda analizar el núcleo del sujeto.");
        }
    }
    </script>
</body>
</html>
